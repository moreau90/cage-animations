          const e2x=pos[c3]-pos[a3], e2y=pos[c3+1]-pos[a3+1], e2z=pos[c3+2]-pos[a3+2];
          const dnx=e1y*e2z-e1z*e2y, dny=e1z*e2x-e1x*e2z, dnz=e1x*e2y-e1y*e2x;
          const r1x=meshRestPos[b3]-meshRestPos[a3], r1y=meshRestPos[b3+1]-meshRestPos[a3+1], r1z=meshRestPos[b3+2]-meshRestPos[a3+2];
          const r2x=meshRestPos[c3]-meshRestPos[a3], r2y=meshRestPos[c3+1]-meshRestPos[a3+1], r2z=meshRestPos[c3+2]-meshRestPos[a3+2];
          const rnx=r1y*r2z-r1z*r2y, rny=r1z*r2x-r1x*r2z, rnz=r1x*r2y-r1y*r2x;
          const entries = meshVertRegions[a];
          let domRid = 0, domW = -1;
          if (entries) { for (let e=0; e<entries.length; e+=2) { if (entries[e+1]>domW) { domRid=entries[e]; domW=entries[e+1]; } } }
          const tf = transforms[domRid];
          let dotN;
          if (tf) {
            const R = tf.R;
            dotN = dnx*(R[0]*rnx+R[1]*rny+R[2]*rnz) + dny*(R[3]*rnx+R[4]*rny+R[5]*rnz) + dnz*(R[6]*rnx+R[7]*rny+R[8]*rnz);
          } else {
            dotN = dnx*rnx + dny*rny + dnz*rnz;
          }
          if (dotN < 0) frameInverted++;
        }
        totalInverted += frameInverted;
        totalTris += nTri;
        invertedFrames++;
      }

      // ── Jitter measurement: per-vertex acceleration between consecutive frames ──
      if (pos && s > 1 && prevPos && prevVel) {
        // Velocity this frame
        let frameMaxAccel = 0, frameSumAccel = 0;
        for (let i = 0; i < nMesh; i++) {
          const i3 = i * 3;
          const vx = pos[i3] - prevPos[i3];
          const vy = pos[i3+1] - prevPos[i3+1];
          const vz = pos[i3+2] - prevPos[i3+2];
          const ax = vx - prevVel[i3];
          const ay = vy - prevVel[i3+1];
          const az = vz - prevVel[i3+2];
          const accel = Math.sqrt(ax*ax + ay*ay + az*az) * 1000; // mm
          if (accel > frameMaxAccel) frameMaxAccel = accel;
          frameSumAccel += accel;
        }
        if (frameMaxAccel > maxJitterMM) maxJitterMM = frameMaxAccel;
        sumJitterMM += frameSumAccel / nMesh;
        jitterVertCount++;
      }
      // Update prev buffers for next frame's jitter calc
      if (pos) {
        if (!prevPos) prevPos = new Float32Array(nMesh * 3);
        if (!prevVel) {
          prevVel = new Float32Array(nMesh * 3);
          if (s > 0) {
            // First velocity: diff from previous frame
            for (let i = 0; i < nMesh * 3; i++) prevVel[i] = pos[i] - prevPos[i];
          }
        } else {
          for (let i = 0; i < nMesh * 3; i++) prevVel[i] = pos[i] - prevPos[i];
        }
        prevPos.set(pos);
      }
    }

    // Restore original state
    time = savedTime;
    if (playCheck) playCheck.checked = wasPlaying;
    // Reset jitter buffers so normal playback starts clean
    _jitterVel = null;
    prevMeshPos = null;
    if (jointPosData && jointPosData.rest_quats) computeDirectFKJoints(time);
    else if (typeof driveCageFromMixamo === 'function') driveCageFromMixamo(time);
    if (typeof deformMesh === 'function') deformMesh();

    // Build results and log
    const results = { _segments: {} };
    const segOrder = Object.keys(segAccum).sort();
    for (const key of segOrder) {
      const acc = segAccum[key];
      if (acc.nFrames === 0) continue;
      const n = acc.nFrames;
      const meanErr = acc.sumMean / n;
      const avgMax = acc.sumMax / n;
      const meanBlend = acc.sumBlend / n;
      const highPct = (acc.sumHighPct / n * 100);
      const meanDistMM = (acc.sumDistMean / n * 1000);
      const avgMaxDistMM = (acc.sumDistMax / n * 1000);

      let tag;
      if (meanErr < 0.005 && meanBlend < 0.2) tag = 'GOOD';
      else if (meanErr > 0.02 && meanBlend < 0.2) tag = 'TRANSFORM?';
      else if (meanErr > 0.02 && meanBlend > 0.4) tag = 'WEIGHTS';
      else if (meanErr < 0.01 && meanBlend > 0.4) tag = 'SHIFT';
      else tag = 'OK';

      results._segments[acc.label] = {
        mean_pct: +(meanErr*100).toFixed(2),
        avgmax_pct: +(avgMax*100).toFixed(2),
        blend: +meanBlend.toFixed(3),
        high_err_pct: +highPct.toFixed(1),
        mean_mm: +meanDistMM.toFixed(1),
        avgmax_mm: +avgMaxDistMM.toFixed(1),
        tag, nFrames: n
      };
      // Keep flat keys for backward compat
      results[acc.label] = results._segments[acc.label];

      console.log('  ' + acc.label.padEnd(22) +
        'mean=' + (meanErr*100).toFixed(2) + '% avgmax=' + (avgMax*100).toFixed(2) +
        '% blend=' + meanBlend.toFixed(3) + ' >2%:' + highPct.toFixed(1) + '% ' +
        'dist=' + meanDistMM.toFixed(1) + '/' + avgMaxDistMM.toFixed(1) + 'mm ' + tag);
    }

    // Global metrics
    const avgInvertedPct = invertedFrames > 0 ? +(totalInverted / totalTris * 100).toFixed(3) : 0;
    const avgInvertedCount = invertedFrames > 0 ? Math.round(totalInverted / invertedFrames) : 0;
    const avgTriCount = invertedFrames > 0 ? Math.round(totalTris / invertedFrames) : 0;
    const meanJitter = jitterVertCount > 0 ? +(sumJitterMM / jitterVertCount).toFixed(1) : 0;
    const maxJitter = +maxJitterMM.toFixed(1);

    results._global = {
      inverted_count: avgInvertedCount,
      inverted_total: avgTriCount,
      inverted_pct: avgInvertedPct,
      jitter_mean_mm: meanJitter,
      jitter_max_mm: maxJitter,
      mode: modeName
    };

    console.log('  --- Global: inverted=' + avgInvertedCount + '/' + avgTriCount +
      ' (' + avgInvertedPct + '%) jitter_mean=' + meanJitter + 'mm jitter_max=' + maxJitter + 'mm mode=' + modeName);
    console.log('=== END FIXED-FRAME RIGIDITY ===');
    return results;
  };

  // ═══════════════════════════════════════════════════════════
  // CIRCUMFERENCE / VOLUME PRESERVATION DIAGNOSTIC
  // ═══════════════════════════════════════════════════════════
  // Measures cross-sectional shape change: for each limb segment, compares
  // rest-pose radial distance (r) from bone axis to deformed-pose radial
  // distance (r') from the deformed bone axis. r'/r = 1.0 means shape preserved.
  // Catches volume collapse that rigidity diagnostics miss (LBS "candy wrapper").
  let _circumLastLog = 0;

  // Limb segments for circumference analysis
  const CIRCUMFERENCE_SEGMENTS = [
    { parent: 'l_hip',      child: 'l_knee',  label: 'L thigh' },
    { parent: 'r_hip',      child: 'r_knee',  label: 'R thigh' },
    { parent: 'l_knee',     child: 'l_ankle',  label: 'L shin' },
    { parent: 'r_knee',     child: 'r_ankle',  label: 'R shin' },
    { parent: 'l_shoulder', child: 'l_elbow',  label: 'L upper arm' },
    { parent: 'r_shoulder', child: 'r_elbow',  label: 'R upper arm' },
    { parent: 'l_elbow',    child: 'l_wrist',  label: 'L forearm' },
    { parent: 'r_elbow',    child: 'r_wrist',  label: 'R forearm' },
  ];

  function computeCircumferenceDiagnostic(boneTransforms, pos, colors, alpha) {
    if (!meshBoneWeights || !meshRestPos || !P || !retargetedJoints || !_boneNameToIdx) return;
    const nMesh = meshRestPos.length / 3;
    const gc = lastGroundCorrection || 0;

    // Build reverse lookup if needed
    if (!_jointToBoneIdx) {
      _jointToBoneIdx = {};
      for (const [biStr, jn] of Object.entries(_boneNameToIdx)) {
        _jointToBoneIdx[jn] = +biStr;
      }
    }

    const segResults = [];

    for (const seg of CIRCUMFERENCE_SEGMENTS) {
      const pRest = P[seg.parent], cRest = P[seg.child];
      const pDef = retargetedJoints[seg.parent], cDef = retargetedJoints[seg.child];
      if (!pRest || !cRest || !pDef || !cDef) continue;

      // Rest axis
      const rax = cRest[0]-pRest[0], ray = cRest[1]-pRest[1], raz = cRest[2]-pRest[2];
      const raLen = Math.sqrt(rax*rax + ray*ray + raz*raz);
      if (raLen < 1e-6) continue;
      const rnx = rax/raLen, rny = ray/raLen, rnz = raz/raLen;

      // Deformed axis (with ground correction on Y)
      const dax = cDef[0]-pDef[0], day = cDef[1]-pDef[1], daz = cDef[2]-pDef[2];
      const daLen = Math.sqrt(dax*dax + day*day + daz*daz);
      if (daLen < 1e-6) continue;
      const dnx = dax/daLen, dny = day/daLen, dnz = daz/daLen;

      // Deformed parent position (with ground correction)
      const dpx = pDef[0], dpy = pDef[1] + gc, dpz = pDef[2];

      // Find the bone index for this segment's parent joint
      const parentBi = _jointToBoneIdx[seg.parent];

      // Collect per-vertex radial ratios for vertices on this segment
      const ratios = [];
      const vertIndices = [];

      for (let i = 0; i < nMesh; i++) {
        const bw = meshBoneWeights[i];
        if (!bw || bw.length < 2) continue;

        // Find dominant bone
        let domBi = bw[0], domW = bw[1];
        for (let e = 2; e < bw.length; e += 2) {
          if (bw[e+1] > domW) { domBi = bw[e]; domW = bw[e+1]; }
        }
        // Only include vertices dominated by this segment's parent bone
        const domJn = _boneNameToIdx[domBi];
        if (domJn !== seg.parent) continue;
        if (domW < 0.5) continue; // skip heavily blended verts

        const rx = meshRestPos[i*3], ry = meshRestPos[i*3+1], rz = meshRestPos[i*3+2];

        // Rest: project onto rest axis, compute radial distance
        const vx = rx - pRest[0], vy = ry - pRest[1], vz = rz - pRest[2];
        const t_rest = vx*rnx + vy*rny + vz*rnz;
        // Skip verts outside segment range [0.1, 0.9] to avoid joint zones
        const t_norm = t_rest / raLen;
        if (t_norm < 0.1 || t_norm > 0.9) continue;
        // Radial component
        const prx = vx - t_rest*rnx, pry = vy - t_rest*rny, prz = vz - t_rest*rnz;
        const r_rest = Math.sqrt(prx*prx + pry*pry + prz*prz);
        if (r_rest < 1e-5) continue; // on-axis verts can't measure circumference

        // Deformed: project onto deformed axis
        const dx = pos[i*3] - dpx, dy = pos[i*3+1] - dpy, dz = pos[i*3+2] - dpz;
        const t_def = dx*dnx + dy*dny + dz*dnz;
        const pdx = dx - t_def*dnx, pdy = dy - t_def*dny, pdz = dz - t_def*dnz;
        const r_def = Math.sqrt(pdx*pdx + pdy*pdy + pdz*pdz);

        const ratio = r_def / r_rest;
        ratios.push(ratio);
        vertIndices.push(i);
      }

      if (ratios.length < 5) continue;

      // Sort for percentile computation
      const sorted = ratios.slice().sort((a, b) => a - b);
      const n = sorted.length;
      const p5  = sorted[Math.floor(n * 0.05)];
      const p50 = sorted[Math.floor(n * 0.50)];
      const p95 = sorted[Math.floor(n * 0.95)];
      const mean = ratios.reduce((a, b) => a + b, 0) / n;

      // Flatten score: stddev(r') / mean(r') vs rest
      // If cross-section becomes elliptical (some r' compressed, others expanded),
      // this increases even when mean r'/r ≈ 1.0
      let sumR = 0, sumRSq = 0, sumR0 = 0, sumR0Sq = 0;
      for (let j = 0; j < ratios.length; j++) {
        const vi = vertIndices[j];
        const rx = meshRestPos[vi*3], ry = meshRestPos[vi*3+1], rz = meshRestPos[vi*3+2];
        const vx = rx - pRest[0], vy = ry - pRest[1], vz = rz - pRest[2];
        const t_rest = vx*rnx + vy*rny + vz*rnz;
        const prx = vx - t_rest*rnx, pry = vy - t_rest*rny, prz = vz - t_rest*rnz;
        const r0 = Math.sqrt(prx*prx + pry*pry + prz*prz);

        const dx = pos[vi*3] - dpx, dy = pos[vi*3+1] - dpy, dz = pos[vi*3+2] - dpz;
        const t_def = dx*dnx + dy*dny + dz*dnz;
        const pdx = dx - t_def*dnx, pdy = dy - t_def*dny, pdz = dz - t_def*dnz;
        const rD = Math.sqrt(pdx*pdx + pdy*pdy + pdz*pdz);

        sumR0 += r0; sumR0Sq += r0*r0;
        sumR += rD;  sumRSq += rD*rD;
      }
      const meanR0 = sumR0 / n, meanR = sumR / n;
      const stdR0 = Math.sqrt(Math.max(0, sumR0Sq/n - meanR0*meanR0));
      const stdR  = Math.sqrt(Math.max(0, sumRSq/n - meanR*meanR));
      const cvRest = meanR0 > 1e-6 ? stdR0 / meanR0 : 0;
      const cvDef  = meanR > 1e-6 ? stdR / meanR : 0;
      const flattenScore = cvDef - cvRest; // positive = more elliptical than rest

      segResults.push({
        label: seg.label, parent: seg.parent, child: seg.child,
        mean, p5, p50, p95, flattenScore, count: n,
        ratios, vertIndices
      });

      // Colorize: blue (compressed r'/r < 0.85) → green (1.0) → red (expanded r'/r > 1.15)
      if (colors) {
        for (let j = 0; j < vertIndices.length; j++) {
          const vi = vertIndices[j];
          const ratio = ratios[j];
          let cr, cg, cb;
          if (ratio < 0.85) {
            // Blue (compressed) → green
            const t01 = Math.max(0, (ratio - 0.7) / 0.15);
            cr = 0; cg = t01; cb = 1 - t01;
          } else if (ratio < 1.0) {
            // Green (slight compression)
            const t01 = (ratio - 0.85) / 0.15;
            cr = 0; cg = 0.5 + 0.5 * t01; cb = 0;
          } else if (ratio < 1.15) {
            // Green → yellow (slight expansion)
            const t01 = (ratio - 1.0) / 0.15;
            cr = t01; cg = 1; cb = 0;
          } else {
            // Yellow → red (expansion)
            const t01 = Math.min(1, (ratio - 1.15) / 0.15);
            cr = 1; cg = 1 - t01; cb = 0;
          }
          colors[vi*3] = cr; colors[vi*3+1] = cg; colors[vi*3+2] = cb;
        }
      }
    }

    // Store for fixed-frame evaluation
    window._lastCircumferenceResults = segResults;

    // Console + HUD summary (throttled)
    const now = performance.now();
    if (now - _circumLastLog > 1000) {
      _circumLastLog = now;
      let hudLines = ['<b style="color:#ff8">Circumference (r\'/r)</b>'];
      console.log('=== CIRCUMFERENCE DIAGNOSTIC (mid-segment, domW≥0.5) ===');
      for (const sr of segResults) {
        const tag = sr.p5 < 0.80 ? 'COLLAPSE' : sr.p5 < 0.90 ? 'COMPRESS' : sr.mean > 1.10 ? 'BULGE' : 'OK';
        const tagColor = tag === 'OK' ? '#4f4' : tag === 'COMPRESS' ? '#ff8' : '#f44';
        console.log('  ' + sr.label.padEnd(14) +
          ' mean=' + sr.mean.toFixed(3) +
          ' p5=' + sr.p5.toFixed(3) +
          ' p50=' + sr.p50.toFixed(3) +
          ' p95=' + sr.p95.toFixed(3) +
          ' flat=' + (sr.flattenScore > 0 ? '+' : '') + sr.flattenScore.toFixed(3) +
          ' n=' + sr.count + ' ' + tag);
        hudLines.push('<span style="color:' + tagColor + '">' + sr.label.padEnd(12) +
          '</span> mean=' + sr.mean.toFixed(2) + ' p5=' + sr.p5.toFixed(2) +
          ' p95=' + sr.p95.toFixed(2) + ' ' + tag);
      }
      console.log('=== END CIRCUMFERENCE ===');

      const hudEl = document.getElementById('hudCircumference');
      if (hudEl) hudEl.innerHTML = hudLines.join('<br>');
    }
  }

  // ═══════════════════════════════════════════════════════════
  // FIXED-FRAME CIRCUMFERENCE EVALUATION
  // ═══════════════════════════════════════════════════════════
  // Evaluates circumference at N evenly-spaced times, averages r'/r per segment.
  // Returns { segments: { label: { mean, p5, p50, p95, flattenScore, count } } }
  window.evaluateCircumferenceFixedFrame = function(nSamples) {
    nSamples = nSamples || 8;
    if (!meshBoneWeights || !meshRestPos || !P || !cycleDuration) {
      console.warn('[CIRCUM-EVAL] Missing data'); return null;
    }

    const savedTime = time;
    const playCheck = document.getElementById('play');
    const wasPlaying = playCheck ? playCheck.checked : false;
    if (playCheck) playCheck.checked = false;

    // Ensure circumference checkbox is on
    const circumCheck = $('showCircumference');
    const wasCircum = circumCheck ? circumCheck.checked : false;
    if (circumCheck) circumCheck.checked = true;

    // Accumulate per-segment results across samples
    const segAccum = {}; // label → { sumMean, sumP5, sumP50, sumP95, sumFlat, count, n }

    for (let si = 0; si < nSamples; si++) {
      const t = (si / nSamples) * cycleDuration;
      time = t;
      deformMesh(t);

      const results = window._lastCircumferenceResults;
      if (!results) continue;
      for (const sr of results) {
        if (!segAccum[sr.label]) {
          segAccum[sr.label] = { sumMean: 0, sumP5: 0, sumP50: 0, sumP95: 0, sumFlat: 0, samples: 0, vertCount: 0 };
        }
        const a = segAccum[sr.label];
        a.sumMean += sr.mean;
        a.sumP5 += sr.p5;
        a.sumP50 += sr.p50;
        a.sumP95 += sr.p95;
        a.sumFlat += sr.flattenScore;
        a.samples++;
        a.vertCount = Math.max(a.vertCount, sr.count);
      }
    }

    // Restore state
    time = savedTime;
    if (playCheck) playCheck.checked = wasPlaying;
    if (circumCheck) circumCheck.checked = wasCircum;
    deformMesh(savedTime);

    // Build output
    const output = {};
    for (const [label, a] of Object.entries(segAccum)) {
      if (a.samples === 0) continue;
      output[label] = {
        mean: a.sumMean / a.samples,
        p5: a.sumP5 / a.samples,
        p50: a.sumP50 / a.samples,
        p95: a.sumP95 / a.samples,
        flattenScore: a.sumFlat / a.samples,
        vertCount: a.vertCount,
        samples: a.samples
      };
    }

    console.log('[CIRCUM-EVAL] Done. Segments: ' + Object.keys(output).length);
    return output;
  };

  // LBS vs DQS circumference comparison
  window.evaluateCircumferenceLBSvsDQS = function(nSamples) {
    nSamples = nSamples || 8;
    const dqsCheck = $('useDQS');
    if (!dqsCheck) { console.warn('[CIRCUM-LBSvsDQS] No DQS checkbox'); return null; }

    const wasDQS = dqsCheck.checked;

    dqsCheck.checked = false;
    const lbs = window.evaluateCircumferenceFixedFrame(nSamples);

    dqsCheck.checked = true;
    const dqs = window.evaluateCircumferenceFixedFrame(nSamples);

    dqsCheck.checked = wasDQS;

    return { lbs, dqs };
  };

  // ═══════════════════════════════════════════════════════════
  // LBS vs DQS COMPARISON
  // ═══════════════════════════════════════════════════════════
  // Runs evaluateRigidityFixedFrame in both LBS and DQS modes.
  // Returns { lbs: results, dqs: results } for direct comparison.
  window.evaluateLBSvsDQS = function(nSamples) {
    nSamples = nSamples || 8;
    const dqsCheck = $('useDQS');
    if (!dqsCheck) { console.warn('[LBSvsDQS] No DQS checkbox'); return null; }

    const wasDQS = dqsCheck.checked;

    // Run LBS
    console.log('[LBSvsDQS] Evaluating LBS...');
    dqsCheck.checked = false;
    const lbsResult = window.evaluateRigidityFixedFrame(nSamples);

    // Run DQS
    console.log('[LBSvsDQS] Evaluating DQS...');
    dqsCheck.checked = true;
    const dqsResult = window.evaluateRigidityFixedFrame(nSamples);

    // Restore original state
    dqsCheck.checked = wasDQS;

    console.log('[LBSvsDQS] Done.');
    return { lbs: lbsResult, dqs: dqsResult };
  };

  // ═══════════════════════════════════════════════════════════
  // BEND LOCALIZATION DIAGNOSTIC
  // ═══════════════════════════════════════════════════════════
  // Per-segment: is deformation concentrated at joints (good) or mid-segment (bad)?
  // Colors: blue = joint-band displacement, magenta = mid-segment displacement,
  // dark gray = rigid (low displacement).
  let _bendLocLastLog = 0;
  function computeBendLocalization(boneTransforms, pos, colors, alpha) {
    if (!meshBoneWeights || !meshRestPos || !P || !_boneNameToIdx) return;
    const nMesh = meshRestPos.length / 3;

    // Build reverse lookup if needed
    if (!_jointToBoneIdx) {
      _jointToBoneIdx = {};
      for (const [biStr, jn] of Object.entries(_boneNameToIdx)) {
        _jointToBoneIdx[jn] = +biStr;
      }
    }

    // Per-segment data collection — uses analysis segments (jn→primaryChild)
    const segData = {};
    const biToSeg = {}; // boneIdx → segKey
    for (const [biStr, jn] of Object.entries(_boneNameToIdx)) {
      const bi = +biStr;
      const child = JOINT_PRIMARY_CHILD[jn];
      let par, ch;
      if (child && P[jn] && P[child]) {
        par = jn; ch = child;
      } else {
        // Fallback: find BONE_SEGMENTS entry where jn is child
        let found = false;
        for (const [p, c] of BONE_SEGMENTS) {
          if (c === jn && P[p] && P[jn]) { par = p; ch = jn; found = true; break; }
        }
        if (!found) continue;
      }
      const key = par + '>' + ch;
      biToSeg[bi] = key;
      if (!segData[key]) {
        const pR = P[par], cR = P[ch];
        const dx = cR[0]-pR[0], dy = cR[1]-pR[1], dz = cR[2]-pR[2];
        const segLen = Math.sqrt(dx*dx + dy*dy + dz*dz);
        if (segLen < 1e-6) continue;
        segData[key] = {
          parentRest: pR, childRest: cR, segLen,
          axisX: dx/segLen, axisY: dy/segLen, axisZ: dz/segLen,
          parent: par, child: ch,
          dispWeightedT: 0, totalDisp: 0,
          jointDisp: 0, midDisp: 0, transDisp: 0,
          count: 0
        };
      }
    }

    for (let i = 0; i < nMesh; i++) {
      const bw = meshBoneWeights[i];
      if (!bw || bw.length < 2) continue;

      // Find dominant bone
      let domBi = bw[0], domW = bw[1];
      for (let e = 2; e < bw.length; e += 2) {
        if (bw[e+1] > domW) { domBi = bw[e]; domW = bw[e+1]; }
      }

      const segKey = biToSeg[domBi];
      if (!segKey) continue;
      const sd = segData[segKey];
      const tf = boneTransforms[domBi];
      if (!tf) continue;

      // Rigid position from dominant bone (alpha-blended same as LBS loop)
      const rx = meshRestPos[i*3], ry = meshRestPos[i*3+1], rz = meshRestPos[i*3+2];
      const R = tf.R, t = tf.t;
      const rpx = R[0]*rx + R[1]*ry + R[2]*rz + t[0];
      const rpy = R[3]*rx + R[4]*ry + R[5]*rz + t[1];
      const rpz = R[6]*rx + R[7]*ry + R[8]*rz + t[2];
      const rigidX = rx + alpha * (rpx - rx);
      const rigidY = ry + alpha * (rpy - ry);
      const rigidZ = rz + alpha * (rpz - rz);

      // Displacement
      const ddx = pos[i*3]-rigidX, ddy = pos[i*3+1]-rigidY, ddz = pos[i*3+2]-rigidZ;
      const disp = Math.sqrt(ddx*ddx + ddy*ddy + ddz*ddz);

      // Project rest position onto segment axis → t ∈ [0,1]
      const prx = rx - sd.parentRest[0], pry = ry - sd.parentRest[1], prz = rz - sd.parentRest[2];
      let tParam = (prx*sd.axisX + pry*sd.axisY + prz*sd.axisZ) / sd.segLen;
      tParam = Math.max(0, Math.min(1, tParam));

      sd.dispWeightedT += disp * tParam;
      sd.totalDisp += disp;
      sd.count++;

      // Classify displacement into zones
      if (tParam < JOINT_BAND_NEAR || tParam > JOINT_BAND_FAR) {
        sd.jointDisp += disp;
      } else if (tParam >= MID_BAND_LO && tParam <= MID_BAND_HI) {
        sd.midDisp += disp;
      } else {
        sd.transDisp += disp;
      }

      // Color by zone + displacement magnitude
      if (colors) {
        const dispNorm = disp / sd.segLen;
        if (dispNorm < 0.005) {
          // Low displacement: dark gray (rigid, good)
          colors[i*3] = 0.2; colors[i*3+1] = 0.2; colors[i*3+2] = 0.2;
        } else if (tParam < JOINT_BAND_NEAR || tParam > JOINT_BAND_FAR) {
          // Joint band: blue (expected)
          const intensity = Math.min(dispNorm / 0.05, 1);
          colors[i*3] = 0.1; colors[i*3+1] = 0.3 * intensity; colors[i*3+2] = 0.5 + 0.5 * intensity;
        } else if (tParam >= MID_BAND_LO && tParam <= MID_BAND_HI) {
          // Mid-segment: magenta (problematic)
          const intensity = Math.min(dispNorm / 0.05, 1);
          colors[i*3] = 0.8 * intensity; colors[i*3+1] = 0; colors[i*3+2] = 0.8 * intensity;
        } else {
          // Transition zone: orange
          const intensity = Math.min(dispNorm / 0.05, 1);
          colors[i*3] = 0.8 * intensity; colors[i*3+1] = 0.4 * intensity; colors[i*3+2] = 0;
        }
      }
    }

    // Console + HUD summary (throttled to 1/sec)
    const now = performance.now();
    if (now - _bendLocLastLog > 1000) {
      _bendLocLastLog = now;
      console.log('=== BEND LOCALIZATION ===');
      let hudLines = ['<b style="color:#8cf">Bend Localization</b>'];
      const bendSegOrder = Object.keys(segData).sort();
      for (const key of bendSegOrder) {
        const sd = segData[key];
        if (!sd || sd.count === 0) continue;
        const bendCenter = sd.totalDisp > 1e-8 ? sd.dispWeightedT / sd.totalDisp : 0.5;
        const totalDispNorm = sd.totalDisp / sd.count / sd.segLen;
        const jointPct = sd.totalDisp > 1e-8 ? (sd.jointDisp / sd.totalDisp * 100) : 0;
        const midPct = sd.totalDisp > 1e-8 ? (sd.midDisp / sd.totalDisp * 100) : 0;

        let tag;
        if (totalDispNorm < 0.005) tag = 'RIGID';
        else if (bendCenter < JOINT_BAND_NEAR || bendCenter > JOINT_BAND_FAR) tag = 'JOINT';
        else if (bendCenter >= MID_BAND_LO && bendCenter <= MID_BAND_HI) tag = 'MID-SEG!';
        else tag = 'TRANS';

        const tagColor = tag === 'RIGID' || tag === 'JOINT' ? '#4f4' : tag === 'TRANS' ? '#ff8' : '#f44';
        const label = sd.parent + '→' + sd.child;
        console.log('  ' + label.padEnd(22) + 'center=' + bendCenter.toFixed(2) +
          ' joint=' + jointPct.toFixed(0) + '% mid=' + midPct.toFixed(0) + '% disp=' +
          (totalDispNorm*100).toFixed(2) + '% ' + tag);
        hudLines.push('<span style="color:' + tagColor + '">' + label.padEnd(18) +
          '</span> c=' + bendCenter.toFixed(2) + ' j=' + jointPct.toFixed(0) + '% m=' + midPct.toFixed(0) + '% ' + tag);
      }
      console.log('=== END BEND LOCALIZATION ===');
      const hudEl = document.getElementById('hudBendLoc');
      if (hudEl) hudEl.innerHTML = hudLines.join('<br>');
    }
  }

    };
    retargetedAngles = {
      l_knee: jAngle(rj.l_hip, rj.l_knee, rj.l_ankle),
      r_knee: jAngle(rj.r_hip, rj.r_knee, rj.r_ankle),
      l_ankle: jAngle(rj.l_knee, rj.l_ankle, rj.l_toe),
      r_ankle: jAngle(rj.r_knee, rj.r_ankle, rj.r_toe),
      l_elbow: jAngle(rj.l_shoulder, rj.l_elbow, rj.l_wrist),
      r_elbow: jAngle(rj.r_shoulder, rj.r_elbow, rj.r_wrist),
      l_hip: dirAngle(rj.hips, rj.chest || rj.neck, rj.l_hip, rj.l_knee),
      r_hip: dirAngle(rj.hips, rj.chest || rj.neck, rj.r_hip, rj.r_knee),
      l_shoulder: dirAngle(rj.hips, rj.chest || rj.neck, rj.l_shoulder, rj.l_elbow),
      r_shoulder: dirAngle(rj.hips, rj.chest || rj.neck, rj.r_shoulder, rj.r_elbow),
      spine_joint: jAngle(rj.hips, rj.spine_joint, rj.spine1_joint),
      spine1_joint: jAngle(rj.spine_joint, rj.spine1_joint, rj.spine2_joint),
      spine2_joint: jAngle(rj.spine1_joint, rj.spine2_joint, rj.neck),
      neck: jAngle(rj.spine2_joint, rj.neck, rj.head),
    };
    fbxFrameAngles = {
      l_knee: jAngle(jp.l_hip, jp.l_knee, jp.l_ankle),
      r_knee: jAngle(jp.r_hip, jp.r_knee, jp.r_ankle),
      l_ankle: jAngle(jp.l_knee, jp.l_ankle, jp.l_toe),
      r_ankle: jAngle(jp.r_knee, jp.r_ankle, jp.r_toe),
      l_elbow: jAngle(jp.l_shoulder, jp.l_elbow, jp.l_wrist),
      r_elbow: jAngle(jp.r_shoulder, jp.r_elbow, jp.r_wrist),
      l_hip: dirAngle(jp.hips, jp.chest || jp.neck, jp.l_hip, jp.l_knee),
      r_hip: dirAngle(jp.hips, jp.chest || jp.neck, jp.r_hip, jp.r_knee),
      l_shoulder: dirAngle(jp.hips, jp.chest || jp.neck, jp.l_shoulder, jp.l_elbow),
      r_shoulder: dirAngle(jp.hips, jp.chest || jp.neck, jp.r_shoulder, jp.r_elbow),
      spine_joint: jAngle(jp.hips, jp.spine_joint, jp.spine1_joint),
      spine1_joint: jAngle(jp.spine_joint, jp.spine1_joint, jp.spine2_joint),
      spine2_joint: jAngle(jp.spine1_joint, jp.spine2_joint, jp.neck),
      neck: jAngle(jp.spine2_joint, jp.neck, jp.head),
    };

    // ─── BONE LENGTHS in mm (coordinate-agnostic: just distances) ───
    const bLen = (a, b) => (a && b) ? vlen(vsub(b, a)) * 1000 : null;
    retargetedBoneLens = {
      l_thigh: bLen(rj.l_hip, rj.l_knee), r_thigh: bLen(rj.r_hip, rj.r_knee),
      l_shin: bLen(rj.l_knee, rj.l_ankle), r_shin: bLen(rj.r_knee, rj.r_ankle),
      l_foot: bLen(rj.l_ankle, rj.l_toe), r_foot: bLen(rj.r_ankle, rj.r_toe),
      l_uarm: bLen(rj.l_shoulder, rj.l_elbow), r_uarm: bLen(rj.r_shoulder, rj.r_elbow),
      l_farm: bLen(rj.l_elbow, rj.l_wrist), r_farm: bLen(rj.r_elbow, rj.r_wrist),
      spine: bLen(rj.hips, rj.spine_joint),
      spine1: bLen(rj.spine_joint, rj.spine1_joint),
      spine2: bLen(rj.spine1_joint, rj.spine2_joint),
      chest: bLen(rj.spine2_joint, rj.neck),
      l_collar: bLen(rj.spine2_joint, rj.l_shoulder),
      r_collar: bLen(rj.spine2_joint, rj.r_shoulder),
    };
    fbxFrameBoneLens = {
      l_thigh: bLen(jp.l_hip, jp.l_knee), r_thigh: bLen(jp.r_hip, jp.r_knee),
      l_shin: bLen(jp.l_knee, jp.l_ankle), r_shin: bLen(jp.r_knee, jp.r_ankle),
      l_foot: bLen(jp.l_ankle, jp.l_toe), r_foot: bLen(jp.r_ankle, jp.r_toe),
      l_uarm: bLen(jp.l_shoulder, jp.l_elbow), r_uarm: bLen(jp.r_shoulder, jp.r_elbow),
      l_farm: bLen(jp.l_elbow, jp.l_wrist), r_farm: bLen(jp.r_elbow, jp.r_wrist),
      spine: bLen(jp.hips, jp.spine_joint),
      spine1: bLen(jp.spine_joint, jp.spine1_joint),
      spine2: bLen(jp.spine1_joint, jp.spine2_joint),
      chest: bLen(jp.spine2_joint, jp.neck),
      l_collar: bLen(jp.spine2_joint, jp.l_shoulder),
      r_collar: bLen(jp.spine2_joint, jp.r_shoulder),
    };

    // ─── RELATIVE POSITIONS (pelvis-relative, height-normalized — coordinate-agnostic) ───
    const bodyH = rj.head && rj.hips ? Math.max(0.01, vlen(vsub(rj.head, rj.hips))) : 1;
    const fbxBodyH = jp.head && jp.hips ? Math.max(0.01, vlen(vsub(jp.head, jp.hips))) : 1;
    const rPos = (joint, root, h) => {
      if (!joint || !root) return null;
      const d = vsub(joint, root);
      return [d[0]/h, d[1]/h, d[2]/h];
    };
    retargetedRelPos = {}; fbxFrameRelPos = {}; fbxFrameRelPosMM = {};
    const relJoints = ['l_knee','r_knee','l_ankle','r_ankle','l_toe','r_toe',
                       'l_elbow','r_elbow','l_wrist','r_wrist','l_shoulder','r_shoulder','head',
                       'spine_joint','spine1_joint','spine2_joint','l_collar','r_collar','neck'];
    for (const jn of relJoints) {
      retargetedRelPos[jn] = rPos(rj[jn], rj.hips, bodyH);
      fbxFrameRelPos[jn] = rPos(jp[jn], jp.hips, fbxBodyH);
      if (jp[jn] && jp.hips) {
        const d = vsub(jp[jn], jp.hips);
        fbxFrameRelPosMM[jn] = [d[0] * 1000, d[1] * 1000, d[2] * 1000];
      }
    }
    // Save FBX joint positions for shape fidelity diagnostic
    fbxFrameJointPos = {};
    for (const jn of Object.keys(jp)) {
      if (jp[jn]) fbxFrameJointPos[jn] = jp[jn].slice ? jp[jn].slice() : jp[jn];
    }
  }

  // ── DIRECT FK JOINTS (NO CAGE) ──
  // Computes retargetedJoints + lastGroundCorrection directly from FBX data,
  // bypassing the cage entirely. Uses P bone vectors (our mesh proportions)
  // with FBX quaternion rotations — same FK chain as computeFBXQuatTransforms.
  function computeDirectFKJoints(t) {
    if (!jointPosData || !jointPosData.rest_quats || !P || !P.hips) return;

    // 1. Pelvis world position from FBX root data (same as driveCageFromMixamo)
    const rootPos = getRootPositionAtTime(t);
    const restRoot = jointPosData.root_positions[0];
    if (!rootPos || !restRoot) return;
    const pr = fbxLegPropRatio;
    const dx = (rootPos[0] - restRoot[0]) * pr;
    const dy = (rootPos[1] - restRoot[1]) * pr;
    const dz = (rootPos[2] - restRoot[2]) * pr;
    const pelvisW = [P.hips[0] + dx, P.hips[1] + dy, P.hips[2] + dz];

    // 2. Read rotations from live skeleton if available, else from extracted keyframes
    let liveQuats = null;
    if (_liveSkeleton && fbxLiveMixer && _liveHipsBone) {
      liveQuats = readLiveSkeletonRotations(t);
      if (liveQuats && !window._liveRotDiagDone) {
        window._liveRotDiagDone = true;
        const nQuats = Object.keys(liveQuats).length;
        console.log('[LIVE SKEL] Using live skeleton rotations: ' + nQuats + ' joints');
      }
    }

    // 2b. Quaternion deltas for all joints
    const jointRMat = {};
    for (const jn of Object.keys(jointPosData.rest_quats)) {
      const curQ = liveQuats ? liveQuats[jn] : getJointQuaternionAtTime(jn, t);
      const restQ = jointPosData.rest_quats[jn];
      if (!curQ || !restQ) continue;
      let qd = quat_mul(curQ, quat_conjugate(restQ));
      if (qd[3] < 0) qd = [-qd[0], -qd[1], -qd[2], -qd[3]];
      jointRMat[jn] = quat_to_mat3(qd);
    }

    // 3. FK chain using P bone vectors + FBX quaternion rotations
    const fkPos = { hips: pelvisW };
    const FK_CHILDREN = CageCore.FK_CHILDREN;
    const queue = ['hips'];
    while (queue.length > 0) {
      const parent = queue.shift();
      const children = FK_CHILDREN[parent];
      if (!children) continue;
      const R_p = jointRMat[parent];
      if (!R_p || !P[parent]) continue;
      for (const child of children) {
        if (!P[child]) continue;
        const bx = P[child][0] - P[parent][0], by = P[child][1] - P[parent][1], bz = P[child][2] - P[parent][2];
        const rd = mat3_mulVec3(R_p, bx, by, bz);
        fkPos[child] = [fkPos[parent][0] + rd[0], fkPos[parent][1] + rd[1], fkPos[parent][2] + rd[2]];
        queue.push(child);
      }
    }

    // 4. Ground correction: the floor is a solid surface — NO body part can go below it.
    // Ground level = actual mesh floor (bounds.min[1]), not just foot joint Y.
    // Check ALL FK joint positions + extremity estimates for lowest body point.
    const floorY = bounds ? bounds.min[1] : (function() {
      let minY = Infinity;
      const footJoints = ['l_ankle', 'r_ankle', 'l_toe', 'r_toe'];
      for (const jn of footJoints) { if (P[jn]) minY = Math.min(minY, P[jn][1]); }
      return minY;
    })();

    let minFKAllY = Infinity;
    // Check all FK joint positions (includes fingertips from finger FK chain)
    for (const jn of Object.keys(fkPos)) {
      if (fkPos[jn] && Array.isArray(fkPos[jn])) {
        minFKAllY = Math.min(minFKAllY, fkPos[jn][1]);
      }
    }
    // Head-top estimate: mesh extends above head joint in rest pose. When inverted
    // (handstands, flips), that extent points downward. Use head rotation to estimate.
    if (fkPos.head && P.head && bounds && jointRMat.head) {
      const headTopRestOffset = bounds.max[1] - P.head[1]; // rest-pose head-to-top-of-mesh
      if (headTopRestOffset > 0.01) {
        const rotOff = mat3_mulVec3(jointRMat.head, 0, headTopRestOffset, 0);
        const headTopY = fkPos.head[1] + rotOff[1];
        minFKAllY = Math.min(minFKAllY, headTopY);
      }
    }
    // Only push UP (prevent penetration), never pull DOWN below natural animation
    lastGroundCorrection = Math.max(0, floorY - minFKAllY);

    // 5. Populate retargetedJoints (same format as cage pipeline)
    // Add chest alias (spine2_joint) for diagnostics that reference rj.chest
    fkPos.chest = fkPos.spine2_joint || null;
    retargetedJoints = fkPos;
    _lastJointRMat = jointRMat;

    // 6. Compute diagnostic variables (shared with cage pipeline)
    computeDiagnosticVariables(t);
  }

  // ── UPDATE FBX JOINT DEBUG SPHERES ──
  // Works in both cage and direct FK modes. Uses retargetedJoints (populated by either pipeline).
  // When animation is stopped, shows rest-pose positions.
  function updateFBXJointSpheres() {
    const show = false/*debugFBXJoints removed*/;
    if (!show) {
      for (const jn of fbxJointNames) { const s = fbxJointSpheres[jn]; if (s) s.visible = false; }
      return;
    }
    // Use retargetedJoints if available (animation running), else rest-pose P positions
    const useRJ = retargetedJoints && Object.keys(retargetedJoints).length > 0;
    for (const jn of fbxJointNames) {
      const s = fbxJointSpheres[jn];
      if (!s) continue;
      const pos = useRJ ? retargetedJoints[jn] : P[jn];
      if (pos) {
        s.position.set(pos[0], pos[1], pos[2]);
        s.visible = true;
      } else {
        s.visible = false;
      }
    }
  }

  // ── COMPREHENSIVE JOINT & WEIGHT DIAGNOSTIC ──
  // Logs a side-by-side comparison of our P joints, FBX rest_pose,
  // bone lengths, and weight coverage. Called after FBX load.
  function dumpJointDiagnostic() {
    if (!jointPosData || !jointPosData.rest_pose || !P.hips) {
      console.log('[JOINT DIAG] No FBX data loaded yet');
      return;
    }
    const rp = jointPosData.rest_pose;
    const anchor = P.hips;

    const allJoints = ['hips','l_hip','r_hip','l_knee','r_knee',
      'l_ankle','r_ankle','l_toe','r_toe',
      'l_shoulder','r_shoulder','l_elbow','r_elbow','l_wrist','r_wrist',
      'l_mid_knuckle','r_mid_knuckle',
      'neck','head','chest','spine_joint','spine1_joint','spine2_joint',
      'l_collar','r_collar'];

    console.log('╔══════════════════════════════════════════════════════════════════════╗');
    console.log('║  JOINT POSITION COMPARISON (mm from world origin)                   ║');
    console.log('║  P = our mesh joints (placed_joints.json).                          ║');
    console.log('║  FBX = FBX skeleton rest pose (pelvis-anchored).                    ║');
    console.log('║  Differences = proportion differences between our mesh and FBX.     ║');
    console.log('╠══════════════════════════════════════════════════════════════════════╣');
    console.log('  Pelvis (anchor): [' + anchor.map(v=>(v*1000).toFixed(1)).join(', ') + '] mm');
    console.log('');
    let maxDiff = 0, maxDiffJoint = '';
    for (const jn of allJoints) {
      const pj = P[jn];
      const rpj = rp[jn];
      if (!pj && !rpj) continue;
      const pStr = pj ? '[' + pj.map(v=>(v*1000).toFixed(1)).join(', ') + ']' : 'MISSING';
      const fbxW = rpj ? [rpj[0]+anchor[0], rpj[1]+anchor[1], rpj[2]+anchor[2]] : null;
      const fStr = fbxW ? '[' + fbxW.map(v=>(v*1000).toFixed(1)).join(', ') + ']' : 'MISSING';
      let diff = 0;
      if (pj && fbxW) {
        diff = Math.sqrt((pj[0]-fbxW[0])**2+(pj[1]-fbxW[1])**2+(pj[2]-fbxW[2])**2)*1000;
        if (diff > maxDiff) { maxDiff = diff; maxDiffJoint = jn; }
      }
      const dStr = (pj && fbxW) ? diff.toFixed(2)+'mm' : 'N/A';
      const status = (!pj) ? ' ← MISSING P' : (!fbxW) ? ' ← MISSING FBX' : (diff > 1.0) ? ' ← MISMATCH' : ' OK';
      console.log('  ' + jn.padEnd(16) + ' P=' + pStr.padEnd(32) + ' FBX=' + fStr.padEnd(32) + ' Δ=' + dStr + status);
    }
    console.log('  Max joint diff: ' + maxDiffJoint + ' = ' + maxDiff.toFixed(2) + 'mm');

    // Bone lengths — compare three sets:
    // 1. P (current, after FBX override) = should match FBX
    // 2. FBX rest_pose = the FBX skeleton bone lengths
    // 3. Pre-override P (original mesh anchors) = our mesh's actual proportions
    const BONES = [
      ['hips','l_hip','L hip offset'],['hips','r_hip','R hip offset'],
      ['l_hip','l_knee','L thigh'],['r_hip','r_knee','R thigh'],
      ['l_knee','l_ankle','L shin'],['r_knee','r_ankle','R shin'],
      ['l_ankle','l_toe','L foot'],['r_ankle','r_toe','R foot'],
      ['l_shoulder','l_elbow','L upper arm'],['r_shoulder','r_elbow','R upper arm'],
      ['l_elbow','l_wrist','L forearm'],['r_elbow','r_wrist','R forearm'],
      ['l_wrist','l_mid_knuckle','L hand'],['r_wrist','r_mid_knuckle','R hand'],
      ['hips','spine_joint','Pelvis→spine'],['spine_joint','spine1_joint','Spine 0→1'],
      ['spine1_joint','spine2_joint','Spine 1→2'],['spine2_joint','neck','Spine 2→neck'],
      ['neck','head','Neck→head'],
      ['l_collar','l_shoulder','L collar'],['r_collar','r_shoulder','R collar']
    ];
    const boneLen = (src, a, b) => {
      const pa = src[a], pb = src[b];
      return (pa && pb) ? Math.sqrt((pb[0]-pa[0])**2+(pb[1]-pa[1])**2+(pb[2]-pa[2])**2)*1000 : NaN;
    };
    console.log('');
    console.log('╠══════════════════════════════════════════════════════════════════════════════════╣');
    console.log('║  BONE LENGTH COMPARISON (mm)                                                    ║');
    console.log('║  OrigP = our mesh anchor positions (before FBX override)                        ║');
    console.log('║  FBX = FBX skeleton rest_pose                                                   ║');
    console.log('║  P = current (after FBX override, should match FBX)                             ║');
    console.log('║  Ratio = OrigP/FBX — if ≠ 1.0, FBX joints don\'t match our mesh proportions     ║');
    console.log('╠══════════════════════════════════════════════════════════════════════════════════╣');
    // Build FBX-as-world-space for bone length calculation (add anchor)
    const fbxW = {};
    for (const jn of allJoints) {
      if (rp[jn]) fbxW[jn] = [rp[jn][0]+anchor[0], rp[jn][1]+anchor[1], rp[jn][2]+anchor[2]];
    }
    fbxW.hips = anchor; // pelvis is the anchor itself
    const origP = preOverrideP || {};
    for (const [a, b, label] of BONES) {
      const pLen = boneLen(P, a, b);
      const fLen = boneLen(fbxW, a, b);
      const oLen = boneLen(origP, a, b);
      const ratio = (!isNaN(oLen) && !isNaN(fLen) && fLen > 0) ? (oLen/fLen).toFixed(3) : 'N/A';
      const flag = (ratio !== 'N/A' && (parseFloat(ratio) < 0.9 || parseFloat(ratio) > 1.1)) ? ' ← MISMATCH' : '';
      console.log('  ' + label.padEnd(20) +
        ' OrigP=' + (isNaN(oLen)?'N/A':oLen.toFixed(1)+'mm').padEnd(12) +
        ' FBX=' + (isNaN(fLen)?'N/A':fLen.toFixed(1)+'mm').padEnd(12) +
        ' P=' + (isNaN(pLen)?'N/A':pLen.toFixed(1)+'mm').padEnd(12) +
        ' ratio=' + ratio + flag);
    }
    // Summary: total leg and arm lengths
    const origLLeg = boneLen(origP,'l_hip','l_knee') + boneLen(origP,'l_knee','l_ankle');
    const fbxLLeg = boneLen(fbxW,'l_hip','l_knee') + boneLen(fbxW,'l_knee','l_ankle');
    const origLArm = boneLen(origP,'l_shoulder','l_elbow') + boneLen(origP,'l_elbow','l_wrist');
    const fbxLArm = boneLen(fbxW,'l_shoulder','l_elbow') + boneLen(fbxW,'l_elbow','l_wrist');
    console.log('  ─────────────────────────────────────────────────');
    console.log('  L leg total:   OrigP=' + origLLeg.toFixed(1) + 'mm  FBX=' + fbxLLeg.toFixed(1) + 'mm  ratio=' + (origLLeg/fbxLLeg).toFixed(3));
    console.log('  L arm total:   OrigP=' + origLArm.toFixed(1) + 'mm  FBX=' + fbxLArm.toFixed(1) + 'mm  ratio=' + (origLArm/fbxLArm).toFixed(3));

    // Weight coverage summary
    if (fbxSkinData) {
      console.log('');
      console.log('╠══════════════════════════════════════════════════════════════════════╣');
      console.log('║  FBX SKIN WEIGHT COVERAGE                                          ║');
      console.log('╠══════════════════════════════════════════════════════════════════════╣');
      const nFBX = fbxSkinData.nVerts;
      const regionNames = ['torso','l_thigh','r_thigh','l_shin','r_shin','l_foot','r_foot',
        'l_uarm','r_uarm','l_farm','r_farm','head','l_hand','r_hand','hips',
        'spine1','spine2','chest','neck','l_collar','r_collar','l_toe','r_toe'];
      const regionCounts = new Array(23).fill(0);
      const regionSoleOwner = new Array(23).fill(0);
      let multiRegion = 0;
      for (let i = 0; i < nFBX; i++) {
        const w = fbxSkinData.weights[i];
        if (!w) continue;
        const nEntries = w.length / 2;
        for (let j = 0; j < w.length; j += 2) {
          const rid = w[j];
          if (rid >= 0 && rid < 23) regionCounts[rid]++;
        }
        if (nEntries === 1) regionSoleOwner[w[0]]++;
        if (nEntries > 1) multiRegion++;
      }
      console.log('  FBX vertices: ' + nFBX + ' | Multi-region (blended): ' + multiRegion +
        ' (' + (multiRegion/nFBX*100).toFixed(1) + '%)');
      for (let r = 0; r < 23; r++) {
        if (regionCounts[r] > 0) {
          console.log('    Region ' + r + ' (' + (regionNames[r]||'?').padEnd(10) + '): ' +
            regionCounts[r] + ' verts influenced, ' + regionSoleOwner[r] + ' sole-owner');
        }
      }
    }

    // Our mesh weight coverage
    if (meshVertRegions) {
      console.log('');
      console.log('╠══════════════════════════════════════════════════════════════════════╣');
      console.log('║  OUR MESH WEIGHT COVERAGE (transferred to mesh)                    ║');
      console.log('╠══════════════════════════════════════════════════════════════════════╣');
      const nV = meshVertRegions.length;
      const regionNames = ['torso','l_thigh','r_thigh','l_shin','r_shin','l_foot','r_foot',
        'l_uarm','r_uarm','l_farm','r_farm','head','l_hand','r_hand','hips',
        'spine1','spine2','chest','neck','l_collar','r_collar','l_toe','r_toe'];
      const myCounts = new Array(23).fill(0);
      const mySoleOwner = new Array(23).fill(0);
      let myMulti = 0;
      for (let i = 0; i < nV; i++) {
        const w = meshVertRegions[i];
        if (!w) continue;
        const nEntries = w.length / 2;
        for (let j = 0; j < w.length; j += 2) {
          const rid = w[j];
          if (rid >= 0 && rid < 23) myCounts[rid]++;
        }
        if (nEntries === 1) mySoleOwner[w[0]]++;
        if (nEntries > 1) myMulti++;
      }
      console.log('  Mesh vertices: ' + nV + ' | Multi-region (blended): ' + myMulti +
        ' (' + (myMulti/nV*100).toFixed(1) + '%)');
      for (let r = 0; r < 23; r++) {
        if (myCounts[r] > 0) {
          console.log('    Region ' + r + ' (' + (regionNames[r]||'?').padEnd(10) + '): ' +
            myCounts[r] + ' verts influenced, ' + mySoleOwner[r] + ' sole-owner');
        }
      }
    }

    console.log('╚══════════════════════════════════════════════════════════════════════╝');
  }
  window.dumpJointDiagnostic = dumpJointDiagnostic;

  // ── FBX DEFORMATION TRANSFER ──
  // Deforms the FBX mesh using its own skeleton (FBX rest positions as pivots),
  // then transfers displacement to our mesh via K-neighbor interpolation.
  // This bypasses our weight/transform pipeline entirely and gives the closest
  // possible match to three.js's own GPU skinning of the FBX mesh.
  let _fbxDeformBuf = null;  // cached Float32Array for deformed FBX positions
  let _fbxJointRest = null;  // FBX joint rest positions in our coordinate space

  function computeFBXDeformTransfer(t, outPos) {
    if (!fbxSkinData || !jointPosData || !jointPosData.rest_quats ||
        !retargetedJoints || !retargetedJoints.hips || !meshRestPos ||
        !window._fbxVertMapping) return false;

    const mapping = window._fbxVertMapping;
    const K = mapping.K;
    const nMesh = mapping.nMesh;
    const fbxPos = fbxSkinData.positions;
    const fbxWts = fbxSkinData.weights;
    const nFBX = fbxSkinData.nVerts;

    // Build FBX joint rest positions (with P.hips offset) once
    if (!_fbxJointRest && jointPosData.rest_pose && P.hips) {
      _fbxJointRest = {};
      for (const jn of Object.keys(jointPosData.rest_pose)) {
        const rp = jointPosData.rest_pose[jn];
        _fbxJointRest[jn] = [
          rp[0] + P.hips[0],
          rp[1] + P.hips[1],
          rp[2] + P.hips[2]
        ];
      }
    }
    if (!_fbxJointRest) return false;

    // Step 1: Compute world-space quaternion deltas + rotation matrices
    const jointRMat = {};
    const allJoints = Object.keys(jointPosData.rest_quats);
    for (const jn of allJoints) {
      const curQ = getJointQuaternionAtTime(jn, t);
      const restQ = jointPosData.rest_quats[jn];
      if (!curQ || !restQ) continue;
      let qd = quat_mul(curQ, quat_conjugate(restQ));
      if (qd[3] < 0) qd = [-qd[0], -qd[1], -qd[2], -qd[3]];
      jointRMat[jn] = quat_to_mat3(qd);
    }

    // Step 2: FK chain using FBX rest-pose bone vectors (not cage P vectors).
    // This ensures FK joint positions match FBX skeleton proportions.
    const gc = lastGroundCorrection;
    const fkPos = {};
    fkPos['hips'] = [retargetedJoints.hips[0], retargetedJoints.hips[1] + gc, retargetedJoints.hips[2]];

    const FK_CHILDREN = CageCore.FK_CHILDREN;

    const queue = ['hips'];
    while (queue.length > 0) {
      const parent = queue.shift();
      const children = FK_CHILDREN[parent];
      if (!children) continue;
      const R_p = jointRMat[parent];
      if (!R_p || !_fbxJointRest[parent]) continue;
      for (const child of children) {
        if (!_fbxJointRest[child]) continue;
        // Use FBX rest-pose bone vectors (FBX proportions)
        const dx = _fbxJointRest[child][0] - _fbxJointRest[parent][0];
        const dy = _fbxJointRest[child][1] - _fbxJointRest[parent][1];
        const dz = _fbxJointRest[child][2] - _fbxJointRest[parent][2];
        const rd = mat3_mulVec3(R_p, dx, dy, dz);
        fkPos[child] = [fkPos[parent][0] + rd[0], fkPos[parent][1] + rd[1], fkPos[parent][2] + rd[2]];
        queue.push(child);
      }
    }

    // Step 3: Build per-region transforms using FBX rest positions as pivots
    const QUAT_JOINT = {
      0: 'spine_joint', 1: 'l_hip', 2: 'r_hip',
      3: 'l_knee', 4: 'r_knee', 5: 'l_ankle', 6: 'r_ankle',
      7: 'l_shoulder', 8: 'r_shoulder', 9: 'l_elbow', 10: 'r_elbow',
      11: 'head', 12: 'l_wrist', 13: 'r_wrist', 14: 'hips',
      15: 'spine1_joint', 16: 'spine2_joint', 17: 'spine2_joint',
      18: 'neck', 19: 'l_collar', 20: 'r_collar', 21: 'l_toe', 22: 'r_toe'
    };

    const transforms = {};
    for (let rid = 0; rid <= 22; rid++) {
      const bm = REGION_BONE_MAP[rid];
      if (!bm) continue;
      const qJoint = QUAT_JOINT[rid] || bm[0];
      let R = jointRMat[qJoint];
      let anchorJoint = qJoint;
      if (!R && qJoint !== bm[0]) {
        R = jointRMat[bm[0]];
        anchorJoint = bm[0];
      }
      const jRest = _fbxJointRest[anchorJoint]; // FBX rest position (not cage P)
      const jCur = fkPos[anchorJoint];
      if (R && jRest && jCur) {
        const Rj = mat3_mulVec3(R, jRest[0], jRest[1], jRest[2]);
        transforms[rid] = { R: R, t: [jCur[0]-Rj[0], jCur[1]-Rj[1], jCur[2]-Rj[2]] };
      }
    }

    // Step 4: Deform FBX vertices via standard LBS using FBX weights
    if (!_fbxDeformBuf || _fbxDeformBuf.length !== nFBX * 3) {
      _fbxDeformBuf = new Float32Array(nFBX * 3);
    }

    // Collect unique referenced FBX vertices for efficient deformation
    const refSet = new Set();
    for (let i = 0; i < nMesh; i++) {
      for (let k = 0; k < K; k++) {
        const fi = mapping.fbxIdx[i * K + k];
        if (fi >= 0) refSet.add(fi);
      }
    }

    // Deform only referenced FBX vertices
    for (const fi of refSet) {
      const rx = fbxPos[fi*3], ry = fbxPos[fi*3+1], rz = fbxPos[fi*3+2];
      const entries = fbxWts[fi];
      let px = 0, py = 0, pz = 0, totalW = 0;
      for (let e = 0; e < entries.length; e += 2) {
        const rid = entries[e];
        const w = entries[e + 1];
        const bt = transforms[rid];
        if (!bt) continue;
        const R = bt.R, tr = bt.t;
        px += w * (R[0]*rx + R[1]*ry + R[2]*rz + tr[0]);
        py += w * (R[3]*rx + R[4]*ry + R[5]*rz + tr[1]);
        pz += w * (R[6]*rx + R[7]*ry + R[8]*rz + tr[2]);
        totalW += w;
      }
      if (totalW > 1e-6) {
        _fbxDeformBuf[fi*3]   = px / totalW;
        _fbxDeformBuf[fi*3+1] = py / totalW;
        _fbxDeformBuf[fi*3+2] = pz / totalW;
      } else {
        _fbxDeformBuf[fi*3] = rx; _fbxDeformBuf[fi*3+1] = ry; _fbxDeformBuf[fi*3+2] = rz;
      }
    }

    // Step 5: Transfer displacement from FBX mesh to our mesh
    // ourDeformed = ourRest + sum_k(w_k * (fbxDeformed_k - fbxRest_k))
    for (let i = 0; i < nMesh; i++) {
      let dx = 0, dy = 0, dz = 0;
      for (let k = 0; k < K; k++) {
        const fi = mapping.fbxIdx[i * K + k];
        const w = mapping.interpW[i * K + k];
        if (fi < 0 || w < 1e-6) continue;
        dx += w * (_fbxDeformBuf[fi*3]   - fbxPos[fi*3]);
        dy += w * (_fbxDeformBuf[fi*3+1] - fbxPos[fi*3+1]);
        dz += w * (_fbxDeformBuf[fi*3+2] - fbxPos[fi*3+2]);
      }
      outPos[i*3]   = meshRestPos[i*3]   + dx;
      outPos[i*3+1] = meshRestPos[i*3+1] + dy;
      outPos[i*3+2] = meshRestPos[i*3+2] + dz;
    }

    // One-shot diagnostic
    if (!window._fbxDeformDiagDone) {
      window._fbxDeformDiagDone = true;
      console.log('=== FBX DEFORM TRANSFER DIAGNOSTIC ===');
      console.log('  FBX vertices referenced: ' + refSet.size + ' / ' + nFBX);
      console.log('  Regions with transforms: ' + Object.keys(transforms).length + '/23');
      for (let rid = 0; rid <= 22; rid++) {
        if (!transforms[rid]) console.log('  MISSING transform for region ' + rid);
      }
    }
    return true;
  }

  // Compute bone-skinned reference positions for all mesh verts using retargetedJoints
  let boneRefPos = null; // cached Float32Array
  function computeBoneSkinnedPositions(outPos) {
    if (!meshVertRegions || !retargetedJoints.hips) return false;
    const nMesh = meshRestPos.length / 3;

    // Precompute rigid transforms per region
    const boneTransforms = {};
    for (let rid = 0; rid <= 22; rid++) {
      const bm = REGION_BONE_MAP[rid];
      if (!bm) continue;
      const pRest = P[bm[0]], cRest = P[bm[1]];
      const pCur = retargetedJoints[bm[0]], cCur = retargetedJoints[bm[1]];
      if (!pRest || !cRest || !pCur || !cCur) continue;
      boneTransforms[rid] = computeBoneRigidTransform(pRest, cRest, pCur, cCur);
    }

    for (let i = 0; i < nMesh; i++) {
      const rx = meshRestPos[i*3], ry = meshRestPos[i*3+1], rz = meshRestPos[i*3+2];
      const entries = meshVertRegions[i];
      let px = 0, py = 0, pz = 0;
      let totalW = 0;

      for (let e = 0; e < entries.length; e += 2) {
        const rid = entries[e];
        const w   = entries[e + 1];
        const bt  = boneTransforms[rid];
        if (!bt) continue;
        const R = bt.R, t = bt.t;
        px += w * (R[0]*rx + R[1]*ry + R[2]*rz + t[0]);
        py += w * (R[3]*rx + R[4]*ry + R[5]*rz + t[1]);
        pz += w * (R[6]*rx + R[7]*ry + R[8]*rz + t[2]);
        totalW += w;
      }

      if (totalW > 1e-6) {
        outPos[i*3]   = px / totalW;
        outPos[i*3+1] = py / totalW;
        outPos[i*3+2] = pz / totalW;
      } else {
        outPos[i*3] = rx; outPos[i*3+1] = ry; outPos[i*3+2] = rz;
      }
    }
    return true;
  }

  // Compute FBX ground truth positions using direction-based LBS with FBX bone directions.
  // Same as computeBoneSkinnedPositions but uses FBX animation's actual bone directions
  // (from getJointPositionAtTime) instead of cage retargetedJoints directions.
  // Parent positions are anchored to retargetedJoints so global position matches the cage.
  // The difference isolates: "how much does the cage's bone direction differ from FBX intent?"
  let fbxGTBuf = null; // cached Float32Array for FBX ground truth positions
  function computeFBXGroundTruth(outPos, t) {
    if (!meshVertRegions || !meshRestPos || !jointPosData || !retargetedJoints || !retargetedJoints.hips) return false;
    const nMesh = meshRestPos.length / 3;

    // Use FK-consistent quaternion transforms (same as main mesh when useFBXTransforms is on).
    // This gives a proper ground truth with full bone rotations (including twist).
    const boneTransforms = computeFBXQuatTransforms(t);
    if (!boneTransforms) return false;

    // Standard LBS using meshVertRegions weights
    for (let i = 0; i < nMesh; i++) {
      const rx = meshRestPos[i*3], ry = meshRestPos[i*3+1], rz = meshRestPos[i*3+2];
      const entries = meshVertRegions[i];
      let px = 0, py = 0, pz = 0;
      let totalW = 0;

      for (let e = 0; e < entries.length; e += 2) {
        const rid = entries[e];
        const w   = entries[e + 1];
        const bt  = boneTransforms[rid];
        if (!bt) continue;
        const R = bt.R, tr = bt.t;
        px += w * (R[0]*rx + R[1]*ry + R[2]*rz + tr[0]);
        py += w * (R[3]*rx + R[4]*ry + R[5]*rz + tr[1]);
        pz += w * (R[6]*rx + R[7]*ry + R[8]*rz + tr[2]);
        totalW += w;
      }

      if (totalW > 1e-6) {
        outPos[i*3]   = px / totalW;
        outPos[i*3+1] = py / totalW;
        outPos[i*3+2] = pz / totalW;
      } else {
        outPos[i*3] = rx; outPos[i*3+1] = ry; outPos[i*3+2] = rz;
      }
    }
    return true;
  }

  // Per-bone FBX ground truth: deforms OUR mesh vertices using per-bone LBS
  // with FBX skeleton proportions (_fbxJointRest) + our meshBoneWeights.
  // Compared against our deformation (which uses P proportions + same weights),
  // this isolates exactly the proportion/joint-placement difference.
  // When useFBXJoints=True (P ≈ FBX), this error should be near-zero.
  function computePerBoneFBXGroundTruth(outPos, t) {
    if (!fbxSkinData || !fbxSkinData.boneNames || !meshBoneWeights || !meshRestPos ||
        !jointPosData || !jointPosData.rest_quats || !jointPosData.rest_pose ||
        !P || !P.hips) return false;

    const nMesh = meshRestPos.length / 3;

    // Build FBX joint rest positions (with P.hips offset) — same as computeFBXDeformTransfer
    if (!_fbxJointRest && jointPosData.rest_pose && P.hips) {
      _fbxJointRest = {};
      for (const jn of Object.keys(jointPosData.rest_pose)) {
        const rp = jointPosData.rest_pose[jn];
        _fbxJointRest[jn] = [rp[0] + P.hips[0], rp[1] + P.hips[1], rp[2] + P.hips[2]];
      }
    }
    if (!_fbxJointRest) return false;

    // Use _lastJointRMat (from computeDirectFKJoints) for rotation matrices,
    // then build FK chain using _fbxJointRest bone vectors (FBX proportions).
    // This gives "what the mesh would look like with FBX proportions" for comparison.
    let boneTransforms;
    {
      if (!retargetedJoints || !retargetedJoints.hips) return false;

      // Use live skeleton rotation matrices if available, else compute from extracted keyframes
      const jointRMat = _lastJointRMat || {};
      if (!_lastJointRMat) {
        for (const jn of Object.keys(jointPosData.rest_quats)) {
          const curQ = getJointQuaternionAtTime(jn, t);
          const restQ = jointPosData.rest_quats[jn];
          if (!curQ || !restQ) continue;
          let qd = quat_mul(curQ, quat_conjugate(restQ));
          if (qd[3] < 0) qd = [-qd[0], -qd[1], -qd[2], -qd[3]];
          jointRMat[jn] = quat_to_mat3(qd);
        }
      }

      const gc = lastGroundCorrection;
      const fkPos = {};
      fkPos['hips'] = [retargetedJoints.hips[0], retargetedJoints.hips[1] + gc, retargetedJoints.hips[2]];
      const FK_CHILDREN = CageCore.FK_CHILDREN;
      const queue = ['hips'];
      while (queue.length > 0) {
        const parent = queue.shift();
        const children = FK_CHILDREN[parent];
        if (!children) continue;
        const R_p = jointRMat[parent];
        if (!R_p || !_fbxJointRest[parent]) continue;
        for (const child of children) {
          if (!_fbxJointRest[child]) continue;
          const dx = _fbxJointRest[child][0] - _fbxJointRest[parent][0];
          const dy = _fbxJointRest[child][1] - _fbxJointRest[parent][1];
          const dz = _fbxJointRest[child][2] - _fbxJointRest[parent][2];
          const rd = mat3_mulVec3(R_p, dx, dy, dz);
          fkPos[child] = [fkPos[parent][0] + rd[0], fkPos[parent][1] + rd[1], fkPos[parent][2] + rd[2]];
          queue.push(child);
        }
      }

      if (!_boneNameToIdx) {
        _boneNameToIdx = {};
        for (let bi = 0; bi < fbxSkinData.boneNames.length; bi++) {
          const mapped = matchFBXBoneToRegion(fbxSkinData.boneNames[bi]);
          if (mapped) _boneNameToIdx[bi] = mapped;
        }
      }
      boneTransforms = new Array(fbxSkinData.boneCount);
      for (let bi = 0; bi < fbxSkinData.boneCount; bi++) {
        const jn = _boneNameToIdx[bi];
        if (!jn) continue;
        const R = jointRMat[jn];
        const jRest = _fbxJointRest[jn];
        const jCur = fkPos[jn];
        if (!R || !jRest || !jCur) continue;
        const Rj = mat3_mulVec3(R, jRest[0], jRest[1], jRest[2]);
        boneTransforms[bi] = { R: R, t: [jCur[0]-Rj[0], jCur[1]-Rj[1], jCur[2]-Rj[2]] };
      }
    }

    // Deform OUR mesh vertices using FBX-proportion bone matrices + our meshBoneWeights
    for (let i = 0; i < nMesh; i++) {
      const bw = meshBoneWeights[i];
      const rx = meshRestPos[i*3], ry = meshRestPos[i*3+1], rz = meshRestPos[i*3+2];
      if (!bw) { outPos[i*3] = rx; outPos[i*3+1] = ry; outPos[i*3+2] = rz; continue; }
      let px = 0, py = 0, pz = 0;
      for (let e = 0; e < bw.length; e += 2) {
        const bi = bw[e], w = bw[e+1];
        const tf = boneTransforms[bi];
        if (!tf) { px += w * rx; py += w * ry; pz += w * rz; continue; }
        const R = tf.R, tt = tf.t;
        px += w * (R[0]*rx + R[1]*ry + R[2]*rz + tt[0]);
        py += w * (R[3]*rx + R[4]*ry + R[5]*rz + tt[1]);
        pz += w * (R[6]*rx + R[7]*ry + R[8]*rz + tt[2]);
      }
      outPos[i*3] = px; outPos[i*3+1] = py; outPos[i*3+2] = pz;
    }

    return true;
  }

  // Compute comparison heatmap colors: cage-deformed vs bone-skinned reference
  function computeComparisonColors(deformedPos, refPos, colors) {
    if (!colors) return;
    const nMesh = meshRestPos.length / 3;
    const regionNames = {0:'spine',1:'l_thigh',2:'r_thigh',3:'l_shin',4:'r_shin',
      5:'l_foot',6:'r_foot',7:'l_uarm',8:'r_uarm',9:'l_farm',10:'r_farm',
      11:'head',12:'l_hand',13:'r_hand',14:'hips',15:'spine1',16:'spine2',
      17:'chest',18:'neck',19:'l_collar',20:'r_collar',21:'l_toe',22:'r_toe'};

    // Per-region error stats (for one-shot diagnostic)
    const regionStats = {};

    for (let i = 0; i < nMesh; i++) {
      const dx = deformedPos[i*3] - refPos[i*3];
      const dy = deformedPos[i*3+1] - refPos[i*3+1];
      const dz = deformedPos[i*3+2] - refPos[i*3+2];
      const err = Math.sqrt(dx*dx + dy*dy + dz*dz);

      // Get dominant region
      const entries = meshVertRegions[i];
      let domRid = 0, domW = -1;
      for (let e = 0; e < entries.length; e += 2) {
        if (entries[e+1] > domW) { domRid = entries[e]; domW = entries[e+1]; }
      }
      if (!regionStats[domRid]) regionStats[domRid] = { sum: 0, count: 0, max: 0, maxVert: 0 };
      regionStats[domRid].sum += err;
      regionStats[domRid].count++;
      if (err > regionStats[domRid].max) { regionStats[domRid].max = err; regionStats[domRid].maxVert = i; }

      // Color: <1mm green, 1-5mm green→yellow, 5-15mm yellow→red, >15mm red
      const errMM = err * 1000; // convert to mm (assuming model units = meters)
      let r, g, b;
      if (errMM < 1) {
        r = 0; g = 0.8; b = 0;
      } else if (errMM < 5) {
        const t = (errMM - 1) / 4;
        r = t; g = 0.8; b = 0;
      } else if (errMM < 15) {
        const t = (errMM - 5) / 10;
        r = 1; g = 0.8 * (1 - t); b = 0;
      } else {
        r = 1; g = 0; b = 0;
      }
      colors[i*3] = r; colors[i*3+1] = g; colors[i*3+2] = b;
    }

    // One-shot diagnostic log
    if (!window._boneCompDiagDone) {
      window._boneCompDiagDone = true;
      console.log('=== BONE vs CAGE COMPARISON ===');
      let overallSum = 0, overallCount = 0, worstRegion = '', worstMax = 0;
      const sorted = Object.entries(regionStats).sort((a,b) => b[1].max - a[1].max);
      for (const [rid, s] of sorted) {
        const avg = (s.sum / s.count * 1000).toFixed(1);
        const max = (s.max * 1000).toFixed(1);
        const name = regionNames[rid] || rid;
        console.log('Region ' + rid + ' (' + name + '): avg ' + avg + 'mm, max ' + max + 'mm (vert ' + s.maxVert + ')');
        overallSum += s.sum;
        overallCount += s.count;
        if (s.max > worstMax) { worstMax = s.max; worstRegion = name; }
      }
      const overallAvg = (overallSum / overallCount * 1000).toFixed(1);
      console.log('Overall: avg ' + overallAvg + 'mm | Worst region: ' + worstRegion + ' (' + (worstMax * 1000).toFixed(1) + 'mm max)');
    }
  }

  // ── Diagnostic HUD: real-time per-region error display ──
  let _hudFrameCounter = 0;
  let _hudWorstFrames = {};  // { rid: { rmse, time } }
  const HUD_REGION_NAMES = {0:'spine',1:'l_thigh',2:'r_thigh',3:'l_shin',4:'r_shin',
    5:'l_foot',6:'r_foot',7:'l_uarm',8:'r_uarm',9:'l_farm',10:'r_farm',
    11:'head',12:'l_hand',13:'r_hand',14:'hips',15:'spine1',16:'spine2',
    17:'chest',18:'neck',19:'l_collar',20:'r_collar',21:'l_toe',22:'r_toe'};

  function updateDiagHUD(pos, refPos, nMesh) {
    _hudFrameCounter++;
    if (_hudFrameCounter % 3 !== 0) return; // throttle to every 3rd frame

    // Per-region accumulation
    const regionStats = {};
    let overallSum = 0, overallSumSq = 0, overallCount = 0;
    for (let i = 0; i < nMesh; i++) {
      const dx = pos[i*3] - refPos[i*3];
      const dy = pos[i*3+1] - refPos[i*3+1];
      const dz = pos[i*3+2] - refPos[i*3+2];
      const errMM = Math.sqrt(dx*dx + dy*dy + dz*dz) * 1000;
      const entries = meshVertRegions[i];
      let domRid = 0, domW = -1;
      for (let e = 0; e < entries.length; e += 2) {
        if (entries[e+1] > domW) { domRid = entries[e]; domW = entries[e+1]; }
      }
      if (!regionStats[domRid]) regionStats[domRid] = { sum: 0, sumSq: 0, count: 0, max: 0 };
      regionStats[domRid].sum += errMM;
      regionStats[domRid].sumSq += errMM * errMM;
      regionStats[domRid].count++;
      if (errMM > regionStats[domRid].max) regionStats[domRid].max = errMM;
      overallSum += errMM;
      overallSumSq += errMM * errMM;
      overallCount++;
    }

    // Per-region rotation and translation error decomposition
    const regionDecomp = {};
    for (let rid = 0; rid <= 22; rid++) {
      const bm = REGION_BONE_MAP[rid];
      if (!bm) continue;
      const pRest = P[bm[0]], cRest = P[bm[1]];
      const pCur = retargetedJoints[bm[0]], cCur = retargetedJoints[bm[1]];
      if (!pRest || !cRest || !pCur || !cCur) continue;
      // Cage transform (from Kabsch)
      const cageTf = lastRegionTransforms ? lastRegionTransforms[rid] : null;
      // Bone reference transform
      const boneTf = computeBoneRigidTransform(pRest, cRest, pCur, cCur);
      if (!cageTf || !boneTf) continue;
      // Rotation error decomposed into swing + twist
      const Rc = cageTf.R, Rb = boneTf.R;
      // R_diff = R_cage * R_bone^T (row-major 3x3)
      const Rd = new Float64Array(9);
      for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 3; col++) {
          Rd[row*3+col] = Rc[row*3]*Rb[col*3] + Rc[row*3+1]*Rb[col*3+1] + Rc[row*3+2]*Rb[col*3+2];
        }
      }
      // Total rotation error from trace
      const trR = Math.max(-1, Math.min(3, Rd[0] + Rd[4] + Rd[8]));
      const rotErr = Math.acos(Math.max(-1, Math.min(1, (trR - 1) / 2))) * 180 / Math.PI;
      // Swing-twist decomposition
      let swingErr = rotErr, twistErr = 0;
      const isSelfRef = (bm[0] === bm[1]); // toe regions 21/22
      if (!isSelfRef) {
        const qDiff = mat3_to_quat(Rd);
        const boneAxis = vnorm(vsub(cRest, pRest));
        const twistAngle = swingTwistDecompose(qDiff, boneAxis);
        twistErr = Math.abs(twistAngle) * 180 / Math.PI;
        // Swing = total quaternion with twist removed
        const proj = qDiff[0]*boneAxis[0] + qDiff[1]*boneAxis[1] + qDiff[2]*boneAxis[2];
        let tx = proj*boneAxis[0], ty = proj*boneAxis[1], tz = proj*boneAxis[2];
        const tw = qDiff[3];
        const tlen = Math.hypot(tx, ty, tz, tw);
        if (tlen > 1e-10) {
          tx /= tlen; ty /= tlen; tz /= tlen;
          const twn = tw / tlen;
          // q_swing = q_diff * conj(q_twist)
          const qTwist = [tx, ty, tz, twn];
          const qSwing = quat_mul(qDiff, quat_conjugate(qTwist));
          const swingSinHalf = Math.hypot(qSwing[0], qSwing[1], qSwing[2]);
          swingErr = 2 * Math.atan2(swingSinHalf, Math.abs(qSwing[3])) * 180 / Math.PI;
        }
      }
      // Translation error
      const tdx = cageTf.t[0] - boneTf.t[0];
      const tdy = cageTf.t[1] - boneTf.t[1];
      const tdz = cageTf.t[2] - boneTf.t[2];
      const transErr = Math.sqrt(tdx*tdx + tdy*tdy + tdz*tdz) * 1000;
      regionDecomp[rid] = { rotErr, transErr, swingErr, twistErr };
    }

    // Overall RMSE
    const overallRMSE = overallCount > 0 ? Math.sqrt(overallSumSq / overallCount) : 0;

    // Sort regions by RMSE descending
    const sorted = Object.entries(regionStats).map(([rid, s]) => {
      const rmse = Math.sqrt(s.sumSq / s.count);
      return { rid: +rid, name: HUD_REGION_NAMES[+rid] || ('r' + rid), rmse, max: s.max, count: s.count, decomp: regionDecomp[+rid] };
    }).sort((a, b) => b.rmse - a.rmse);

    // Track worst RMSE per region across all frames
    const curTime = typeof time !== 'undefined' ? time % cycleDuration : 0;
    for (const r of sorted) {
      const prev = _hudWorstFrames[r.rid];
      if (!prev || r.rmse > prev.rmse) {
        _hudWorstFrames[r.rid] = { rmse: r.rmse, time: curTime };
      }
      r.worstTime = _hudWorstFrames[r.rid].time;
      r.worstRmse = _hudWorstFrames[r.rid].rmse;
    }

    // Build HTML
    const frameEl = document.getElementById('hudFrameInfo');
    const overallEl = document.getElementById('hudOverallError');
    const listEl = document.getElementById('hudRegionList');

    const totalFrames = (typeof jointPosData !== 'undefined' && jointPosData && jointPosData.fps) ? Math.round(cycleDuration * jointPosData.fps) : '?';
    const curFrame = (typeof jointPosData !== 'undefined' && jointPosData && jointPosData.fps) ? Math.round(curTime * jointPosData.fps) : '?';
    frameEl.textContent = 'Frame ' + curFrame + '/' + totalFrames + ' t=' + curTime.toFixed(3) + 's';
    // Sync scrubber position (without triggering input event)
    const scrubber = document.getElementById('hudScrubber');
    if (scrubber && cycleDuration > 0) {
      scrubber.value = curTime / cycleDuration;
    }
    const oc = overallRMSE < 1 ? '#4ecdc4' : overallRMSE < 5 ? '#ffe066' : '#ff6b6b';
    overallEl.innerHTML = '<span style="color:' + oc + '">Overall RMSE: ' + overallRMSE.toFixed(2) + 'mm</span>';

    let html = '<table style="border-collapse:collapse;width:100%">';
    html += '<tr style="color:#888"><td>Region</td><td>RMSE</td><td>Max</td><td>Sw/Tw/T</td><td></td></tr>';
    for (const r of sorted) {
      const c = r.rmse < 1 ? '#4ecdc4' : r.rmse < 5 ? '#ffe066' : '#ff6b6b';
      const barW = Math.min(60, r.rmse * 4);
      let decomp = '';
      if (r.decomp) {
        decomp = 'sw:' + r.decomp.swingErr.toFixed(1) + '\u00b0 tw:' + r.decomp.twistErr.toFixed(1) + '\u00b0';
        // Per-bone twist delta for limb regions
        const REGION_TWIST_MAP = {1:'l_thigh',2:'r_thigh',7:'l_uarm',8:'r_uarm',9:'l_farm',10:'r_farm'};
        const twistBone = REGION_TWIST_MAP[r.rid];
        if (twistBone && retargetedTwists[twistBone] !== undefined && fbxFrameTwists[twistBone] !== undefined) {
          const deltaTw = Math.abs(retargetedTwists[twistBone] - fbxFrameTwists[twistBone]) * 180 / Math.PI;
          decomp += ' \u0394tw:' + deltaTw.toFixed(1) + '\u00b0';
        }
        decomp += ' t:' + r.decomp.transErr.toFixed(1) + 'mm';
      }
      const worstTip = r.worstTime !== undefined ? 'Worst: ' + r.worstRmse.toFixed(1) + 'mm @ t=' + r.worstTime.toFixed(3) + 's (click to seek)' : '';
      const wtAttr = r.worstTime !== undefined ? ' data-worst-time="' + r.worstTime.toFixed(4) + '"' : '';
      html += '<tr style="color:' + c + ';cursor:pointer"' + wtAttr + ' title="' + worstTip + '">' +
        '<td style="padding:1px 4px">' + r.name + '</td>' +
        '<td style="padding:1px 4px;text-align:right">' + r.rmse.toFixed(1) + '</td>' +
        '<td style="padding:1px 4px;text-align:right">' + r.max.toFixed(1) + '</td>' +
        '<td style="padding:1px 4px;font-size:9px">' + decomp + '</td>' +
        '<td style="padding:1px 0"><div style="background:' + c + ';height:6px;width:' + barW + 'px;border-radius:3px"></div></td>' +
        '</tr>';
    }
    html += '</table>';
    listEl.innerHTML = html;
  }

  // ── HUD click-to-seek and scrubber handlers ──
  function _hudSeekToTime(t) {
    // Pause playback and seek to specific time
    const playCheck = document.getElementById('play');
    if (playCheck) playCheck.checked = false;
    time = t;
    if ($('useCage').checked) {
      if (typeof driveCageFromMixamo === 'function') driveCageFromMixamo(time);
    } else if (jointPosData && jointPosData.rest_quats) {
      computeDirectFKJoints(time);
    }
    if (typeof deformMesh === 'function') deformMesh();
    if (typeof updateCageMesh === 'function' && cageMesh) updateCageMesh();
  }
  (function() {
    // Click handler: seek to worst frame when clicking a region row
    document.addEventListener('click', function(e) {
      const tr = e.target.closest('#hudRegionList tr[data-worst-time]');
      if (!tr) return;
      const wt = parseFloat(tr.getAttribute('data-worst-time'));
      if (!isNaN(wt)) _hudSeekToTime(wt);
    });
    // Scrubber input handler
    document.addEventListener('input', function(e) {
      if (e.target.id !== 'hudScrubber') return;
      const frac = parseFloat(e.target.value);
      if (isNaN(frac)) return;
      _hudSeekToTime(frac * cycleDuration);
    });
  })();

  // ── Ghost/reference mesh overlay ──
  let ghostMesh = null;
  function ensureGhostMesh() {
    if (ghostMesh) return;
    if (!meshGeo || !meshGeo.index) return;
    const nMesh = meshRestPos.length / 3;
    const ghostGeo = new THREE.BufferGeometry();
    ghostGeo.setIndex(meshGeo.index);
    const ghostPositions = new Float32Array(nMesh * 3);
    ghostGeo.setAttribute('position', new THREE.BufferAttribute(ghostPositions, 3));
    const ghostMat = new THREE.MeshBasicMaterial({
      color: 0x00aaff, wireframe: true, transparent: true, opacity: 0.35
    });
    ghostMesh = new THREE.Mesh(ghostGeo, ghostMat);
    ghostMesh.renderOrder = 998;
    scene.add(ghostMesh);
  }

  function deformMesh(){
    if (!meshVertRegions) return;
    const alpha = +$('alpha').value;
    const pos = meshGeo.attributes.position.array;
    const nMesh = meshRestPos.length / 3;

    // Debug region coloring / strain / bone error visualization
    const debugRegions = $('debugRegions').checked;
    const showStrainCheck = $('showStrain').checked;
    const showBoneError = false/*showBoneError removed*/;
    const showSurfaceHealth = $('showSurfaceHealth').checked;
    const showFBXGT = $('showFBXGT').checked;
    const showRigidity = $('showRigidity').checked;
    const showBendLoc = $('showBendLoc').checked;
    const showCircumference = $('showCircumference').checked;
    const useVertexColors = debugRegions || showStrainCheck || showBoneError || showSurfaceHealth || showFBXGT || showRigidity || showBendLoc;
    const colors = meshGeo.attributes.color ? meshGeo.attributes.color.array : null;
    if (meshObj) {
      meshObj.material.vertexColors = useVertexColors;
      // When debug regions are on, hide the texture so vertex colors show as
      // pure flat colors. Otherwise the texture multiplies with vertex colors,
      // making it impossible to distinguish regions on textured meshes.
      if (useVertexColors && meshObj.material.map) {
        meshObj.material._savedMap = meshObj.material.map;
        meshObj.material.map = null;
      } else if (!useVertexColors && meshObj.material._savedMap) {
        meshObj.material.map = meshObj.material._savedMap;
        delete meshObj.material._savedMap;
      }
      meshObj.material.needsUpdate = true;
    }

    // ── FBX deform transfer: bypass entire weight/transform pipeline ──
    // Deforms FBX mesh using its own skeleton, transfers displacement to our mesh.
    if ($('fbxDeformTransfer').checked && fbxSkinData && jointPosData && jointPosData.rest_quats && window._fbxVertMapping) {
      if (computeFBXDeformTransfer(time, pos)) {
        meshGeo.attributes.position.needsUpdate = true;
        // Still compute transforms for diagnostics
        let transforms;
        if ($('useFBXTransforms').checked && jointPosData && jointPosData.rest_quats) {
          transforms = computeFBXQuatTransforms(time);
        }
        if (!transforms) transforms = computeAllRegionTransforms();
        lastRegionTransforms = transforms;
        return;
      }
    }

    // ── Per-bone LBS: standard skeletal animation with barycentric weight transfer ──
    // Uses live skeleton rotations (when available) + our FK chain positions.
    // computeDirectFKJoints populates retargetedJoints and _lastJointRMat,
    // computePerBoneMatrices combines them into per-bone transforms.
    let boneLBSActive = false;
    let boneTransforms = null;
    if ($('useBoneLBS').checked && meshBoneWeights && fbxSkinData && fbxSkinData.boneWeights) {
      boneTransforms = computePerBoneMatrices(time);
      window._lastBoneTransforms = boneTransforms; // expose for fixed-frame evaluation
      if (boneTransforms) {
        boneLBSActive = true;
        const useBoneDQS = $('useDQS').checked;

        // Pre-convert bone transforms to dual quaternions (once per frame)
        let boneDQs = null;
        if (useBoneDQS) {
          boneDQs = new Array(boneTransforms.length);
          for (let bi = 0; bi < boneTransforms.length; bi++) {
            const tf = boneTransforms[bi];
            if (!tf) continue;
            const q = mat3_to_quat(tf.R);
            boneDQs[bi] = rigid_to_dq(q, tf.t);
          }
        }

        for (let i = 0; i < nMesh; i++) {
          const bw = meshBoneWeights[i];
          const rx = meshRestPos[i*3], ry = meshRestPos[i*3+1], rz = meshRestPos[i*3+2];
          let px = 0, py = 0, pz = 0;
          if (bw) {
            if (useBoneDQS) {
              // ── Per-bone DQS: blend dual quaternions, then transform ──
              let bqr0 = 0, bqr1 = 0, bqr2 = 0, bqr3 = 0;
              let bqd0 = 0, bqd1 = 0, bqd2 = 0, bqd3 = 0;
              let firstQr = null;
              for (let e = 0; e < bw.length; e += 2) {
                const bi = bw[e], w = bw[e+1];
                const dq = boneDQs[bi];
                if (!dq) {
                  // No transform for this bone — contribute rest position as identity DQ
                  bqr3 += w; // identity quaternion [0,0,0,1]
                  continue;
                }
                let qr = dq.qr, qd = dq.qd;
                // Hemisphere correction: flip to same hemisphere as first bone
                if (!firstQr) { firstQr = qr; }
                else if (firstQr[0]*qr[0] + firstQr[1]*qr[1] + firstQr[2]*qr[2] + firstQr[3]*qr[3] < 0) {
                  qr = [-qr[0], -qr[1], -qr[2], -qr[3]];
                  qd = [-qd[0], -qd[1], -qd[2], -qd[3]];
                }
                bqr0 += w * qr[0]; bqr1 += w * qr[1]; bqr2 += w * qr[2]; bqr3 += w * qr[3];
                bqd0 += w * qd[0]; bqd1 += w * qd[1]; bqd2 += w * qd[2]; bqd3 += w * qd[3];
              }
              const len = Math.sqrt(bqr0*bqr0 + bqr1*bqr1 + bqr2*bqr2 + bqr3*bqr3);
              if (len < 1e-8) {
                px = rx; py = ry; pz = rz;
              } else {
                const inv = 1.0 / len;
                const nqr = [bqr0*inv, bqr1*inv, bqr2*inv, bqr3*inv];
                const nqd = [bqd0*inv, bqd1*inv, bqd2*inv, bqd3*inv];
                const p = dq_apply(nqr, nqd, rx, ry, rz);
                px = p[0]; py = p[1]; pz = p[2];
              }
            } else {
              // ── Per-bone LBS: standard linear blend ──
              for (let e = 0; e < bw.length; e += 2) {
                const bi = bw[e], w = bw[e+1];
                const tf = boneTransforms[bi];
                if (!tf) { px += w * rx; py += w * ry; pz += w * rz; continue; }
                const R = tf.R, t = tf.t;
                px += w * (R[0]*rx + R[1]*ry + R[2]*rz + t[0]);
                py += w * (R[3]*rx + R[4]*ry + R[5]*rz + t[1]);
                pz += w * (R[6]*rx + R[7]*ry + R[8]*rz + t[2]);
              }
            }
          } else {
            px = rx; py = ry; pz = rz;
          }
          if (!isFinite(px) || !isFinite(py) || !isFinite(pz)) { px = rx; py = ry; pz = rz; }
          pos[i*3]   = rx + alpha * (px - rx);
          pos[i*3+1] = ry + alpha * (py - ry);
          pos[i*3+2] = rz + alpha * (pz - rz);
          if (debugRegions && colors) {
            const c = bw ? (REGION_COLORS[bw[0] % 23] || [0.5, 0.5, 0.5]) : [0.5, 0.5, 0.5];
            colors[i*3] = c[0]; colors[i*3+1] = c[1]; colors[i*3+2] = c[2];
          }
        }
      }
    }

    // Rigidity / bend localization diagnostics (run after LBS, use same boneTransforms + pos)
    // Both rigid_pos and lbs_pos (in pos[]) are in the same space: boneTransforms includes
    // ground correction (jCurY = jFK[1]+gc in computePerBoneMatrices), and pos[] was written
    // by the LBS loop above using the same boneTransforms.
    if (showRigidity && boneLBSActive && boneTransforms) {
      computeRigidityColors(boneTransforms, pos, colors, alpha);
