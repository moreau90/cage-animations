      // Perpendicular offset (mesh width) is preserved.
      const regionVerts = R[chain.region];
      if (regionVerts) {
        for (const ci of regionVerts) {
          const v = cageRest[ci];
          const offset = vsub(v, parentPos);
          const along = vdot(offset, boneDir);
          const perp = vsub(offset, vscale(boneDir, along));
          const newAlong = along * scale;
          const newPos = vadd(parentPos, vadd(vscale(boneDir, newAlong), perp));
          cageRest[ci] = [newPos[0], newPos[1], newPos[2]];
        }
      }

      // Move child joint to new position
      const newChildPos = vadd(parentPos, vscale(boneDir, targetLen));
      const delta = vsub(newChildPos, childPos);
      P[chain.child] = [newChildPos[0], newChildPos[1], newChildPos[2]];

      // Shift all downstream region vertices by the delta
      for (const regName of chain.downstream) {
        const regVerts = R[regName] || [];
        for (const ci of regVerts) {
          cageRest[ci] = [
            cageRest[ci][0] + delta[0],
            cageRest[ci][1] + delta[1],
            cageRest[ci][2] + delta[2]
          ];
        }
      }

      // Shift downstream joints by the delta
      for (const jn of chain.downJoints) {
        if (P[jn]) {
          P[jn] = [P[jn][0] + delta[0], P[jn][1] + delta[1], P[jn][2] + delta[2]];
        }
      }

      console.log('  ' + chain.parent + ' → ' + chain.child + ': ' +
        (curLen * 1000).toFixed(0) + 'mm → ' + (targetLen * 1000).toFixed(0) +
        'mm (x' + scale.toFixed(3) + ') delta=[' +
        (delta[0]*1000).toFixed(0) + ',' + (delta[1]*1000).toFixed(0) + ',' +
        (delta[2]*1000).toFixed(0) + ']mm');
    }

    // Update cagePos from rescaled cageRest
    for (let i = 0; i < cageRest.length; i++) {
      cagePos[i * 3] = cageRest[i][0];
      cagePos[i * 3 + 1] = cageRest[i][1];
      cagePos[i * 3 + 2] = cageRest[i][2];
    }

    // Update region-split slider thresholds to match rescaled bone lengths.
    // Use PROJECTIONS along hip→ankle / shoulder→wrist axes (not bone lengths)
    // because bone lengths sum to more than the axis length due to knee/elbow bend,
    // which would push the shin boundary past the ankle into the foot region.
    if (P.l_hip && P.l_knee && P.l_ankle) {
      const legDir = vnorm(vsub(P.l_ankle, P.l_hip));
      const kneeProj = vdot(vsub(P.l_knee, P.l_hip), legDir);
      const ankleProj = vdot(vsub(P.l_ankle, P.l_hip), legDir);
      $('thighLen').value = Math.min(0.35, kneeProj);
      $('shinLen').value = Math.min(0.35, ankleProj - kneeProj);
      console.log('[RESCALE] Leg split thresholds: thighL=' + kneeProj.toFixed(4) +
        ' shinL=' + (ankleProj - kneeProj).toFixed(4) + ' total=' + ankleProj.toFixed(4));
    }
    if (P.l_shoulder && P.l_elbow && P.l_wrist) {
      const armDir = vnorm(vsub(P.l_wrist, P.l_shoulder));
      const elbowProj = vdot(vsub(P.l_elbow, P.l_shoulder), armDir);
      const wristProj = vdot(vsub(P.l_wrist, P.l_shoulder), armDir);
      $('upperArmLen').value = Math.min(0.40, elbowProj);
      $('forearmLen').value = Math.min(0.20, wristProj - elbowProj);
    }

    // Save toe positions — rebuildFromSkeleton calls autoDetectToeFromMesh which
    // uses meshRestPos (not rescaled) with the shifted ankle, corrupting the angle
    const savedLToe = P.l_toe ? P.l_toe.slice() : null;
    const savedRToe = P.r_toe ? P.r_toe.slice() : null;

    // Rebuild region assignments (Y-based splits use updated vertex positions)
    rebuildFromSkeleton();

    // Restore toe positions (autoDetectToeFromMesh corrupts them because
    // meshRestPos wasn't rescaled but P.l_ankle was shifted)
    if (savedLToe) P.l_toe = savedLToe;
    if (savedRToe) P.r_toe = savedRToe;

    _cageRescaled = true;

    // Log new bone lengths
    const logLen = (a, b) => P[a] && P[b] ? (vlen(vsub(P[b], P[a])) * 1000).toFixed(0) + 'mm' : 'N/A';
    console.log('  New cage bone lengths:');
    console.log('    l_thigh=' + logLen('l_hip','l_knee') + ' r_thigh=' + logLen('r_hip','r_knee'));
    console.log('    l_shin=' + logLen('l_knee','l_ankle') + ' r_shin=' + logLen('r_knee','r_ankle'));
    console.log('    l_uarm=' + logLen('l_shoulder','l_elbow') + ' r_uarm=' + logLen('r_shoulder','r_elbow'));
    console.log('    l_farm=' + logLen('l_elbow','l_wrist') + ' r_farm=' + logLen('r_elbow','r_wrist'));
    console.log('=== RESCALE COMPLETE ===');
  }

  // Load joints from placed_joints.json file (if it exists alongside index.html).
  // If 'primary' field exists, loads only primary placements and re-derives
  // secondary joints (hips, head, etc.) with current improved algorithms.
  async function loadJointsFromFile() {
    try {
      const resp = await fetch('placed_joints.json');
      if (!resp.ok) return false;
      const data = await resp.json();
      if (!data.P && !data.primary) return false;

      // If file has primary placements, use those and re-derive secondary joints
      if (data.primary && Object.keys(data.primary).length > 4) {
        for (const k of Object.keys(data.primary)) {
          P[k] = data.primary[k];
        }
        console.log('Loaded primary placements from placed_joints.json (' +
          Object.keys(data.primary).length + ' joints), re-deriving secondary...');
        rederiveSecondaryJoints();
      } else if (data.P) {
        // Legacy format: load all P directly — trust stored positions as-is.
        // Do NOT call rederiveSecondaryJoints() here: the file has correct
        // joint positions that were computed at placement time. Re-deriving
        // would override them with potentially different values.
        for (const k of Object.keys(data.P)) {
          P[k] = data.P[k];
        }
        console.log('Loaded joints from placed_joints.json (' + Object.keys(data.P).length + ' joints, legacy format — using stored positions)');
      }

      // Sanity check final bone lengths
      const meshH = bounds ? bounds.height : 1.0;
      const minBone = meshH * 0.05, maxBone = meshH * 0.55;
      const checks = [
        ['l_hip','l_knee','l_thigh'], ['l_knee','l_ankle','l_shin'],
        ['l_shoulder','l_elbow','l_uarm'], ['l_elbow','l_wrist','l_farm']
      ];
      for (const [a, b, name] of checks) {
        if (P[a] && P[b]) {
          const len = vlen(vsub(P[b], P[a]));
          if (len < minBone || len > maxBone) {
            console.warn('placed_joints.json: ' + name + '=' + (len*1000).toFixed(1) + 'mm (range: ' +
              (minBone*1000).toFixed(0) + '-' + (maxBone*1000).toFixed(0) + 'mm)');
          }
        }
      }
      return true;
    } catch (e) {
      return false; // file doesn't exist, that's fine
    }
  }

statusEl.textContent = "Loading cage/bind/regions/motion…";

          (diff > 0 ? ' (diff=' + diff + ') ' + status : ' ' + status));

        // Auto-fix: mirror from larger side to smaller side
        if (diff > 0) {
          const srcIdx = lIdx.length >= rIdx.length ? lIdx : rIdx;
          const dstIdx = lIdx.length >= rIdx.length ? rIdx : rIdx.length >= lIdx.length ? lIdx : rIdx;
          const srcRid = lIdx.length >= rIdx.length ? lRid : rRid;
          const dstRid = lIdx.length >= rIdx.length ? rRid : lRid;
          const isLtoR = lIdx.length > rIdx.length; // mirroring L→R

          // Sort source verts by projection along arm/leg axis for consistent pairing
          const srcSorted = srcIdx.slice().sort((a, b) => {
            const ay = cageRest[a][1], by = cageRest[b][1];
            return ay - by; // sort by Y (height)
          });

          if (srcSorted.length > dstIdx.length) {
            // Add mirrored cage verts for the extras
            const existing = dstIdx.length;
            for (let i = existing; i < srcSorted.length; i++) {
              const si = srcSorted[i];
              const sv = cageRest[si];
              // Mirror across X=0
              const mirrored = [-sv[0], sv[1], sv[2]];
              const newIdx = cageRest.length;
              cageRest.push(mirrored);
              regionId.push(dstRid);
              totalFixed++;
            }
          }
        }
      }

      if (totalFixed > 0) {
        console.log('  Fixed: added ' + totalFixed + ' mirrored cage verts for symmetry');
        // Rebuild cagePos flat array with new verts
        cagePos = new Float32Array(cageRest.length * 3);
        for (let i = 0; i < cageRest.length; i++) {
          cagePos[i*3]   = cageRest[i][0];
          cagePos[i*3+1] = cageRest[i][1];
          cagePos[i*3+2] = cageRest[i][2];
        }
      }
      console.log('=== END CAGE SYMMETRY ===');
    }

    // TEMP TEST: ignore bind.json and build a clean bind (region constrained)
    const built = buildBindKNNRegion(meshRestPos, cageRest, regionId, regions.meta, 8);
    K = built.K;
    bindIdx = built.idx;
    bindW = built.w;
    regionId = built.regionId;

    // SAFE max calc (no spread)
    let maxBindIdx = -1;
    for (let i = 0; i < bindIdx.length; i++) {
      if (bindIdx[i] > maxBindIdx) maxBindIdx = bindIdx[i];
    }
    if (maxBindIdx >= cageRest.length) {
      console.warn("bindIdx range exceeds cageRest length:", maxBindIdx, cageRest.length);
    }

    // Count mesh verts per region (from nearest-cage-vert classification)
    const meshRegionCounts = {};
    const nMeshVerts = meshRestPos.length / 3;
    for (let vi = 0; vi < nMeshVerts; vi++) {
      // Find the dominant region for this mesh vert from its bindings
      const rw = new Map();
      for (let j = 0; j < K; j++) {
        const ci = bindIdx[vi*K+j];
        const w = bindW[vi*K+j];
        const rid = regionId[ci];
        rw.set(rid, (rw.get(rid)||0) + w);
      }
      let bestR = 0, bestW = -1;
      for (const [rid, w] of rw) { if (w > bestW) { bestR = rid; bestW = w; } }
      meshRegionCounts[bestR] = (meshRegionCounts[bestR]||0) + 1;
    }
    const names = {0:'torso',1:'l_thigh',2:'r_thigh',3:'l_shin',4:'r_shin',
                   5:'l_foot',6:'r_foot',7:'l_uarm',8:'r_uarm',9:'l_farm',10:'r_farm',11:'head'};
    console.log("Mesh vert region counts (dominant):");
    for (const rid of Object.keys(meshRegionCounts).sort((a,b)=>a-b)) {
      console.log(`  ${names[rid]||rid}: ${meshRegionCounts[rid]}`);
    }

    console.log("Built bind:", {
      K,
      cageVerts: cageRest.length,
      meshVerts: meshRestPos.length / 3,
      maxBindIdx
    });


    // anchors + bounds — MUST be set before resplitArmRegions() so that P is
    // available for thigh geometry detection and hip smoothstep in buildBindKNNRegion
    // and precomputeMeshRegionWeights. Previously these were set AFTER resplitArmRegions,
    // meaning all thigh detection and hip weight blending was silently skipped on load.
    anchors = anchorData.anchors;
    bounds = anchorData.mesh_bounds;

    // Pivots from anchors (CRITICAL — must be before mesh weight computation)
    P.l_hip   = (anchors.l_hip && anchors.l_hip.pos) ? anchors.l_hip.pos : [-0.08, bounds.min[1] + bounds.height*0.38, 0];
    P.r_hip   = (anchors.r_hip && anchors.r_hip.pos) ? anchors.r_hip.pos : [ 0.08, bounds.min[1] + bounds.height*0.38, 0];
    P.l_knee  = (anchors.l_knee && anchors.l_knee.pos) ? anchors.l_knee.pos : [-0.08, bounds.min[1] + bounds.height*0.22, 0.02];
    P.r_knee  = (anchors.r_knee && anchors.r_knee.pos) ? anchors.r_knee.pos : [ 0.08, bounds.min[1] + bounds.height*0.22, 0.02];
    P.l_ankle = (anchors.l_ankle && anchors.l_ankle.pos) ? anchors.l_ankle.pos : [-0.08, bounds.min[1] + bounds.height*0.06, 0.02];
    P.r_ankle = (anchors.r_ankle && anchors.r_ankle.pos) ? anchors.r_ankle.pos : [ 0.08, bounds.min[1] + bounds.height*0.06, 0.02];
    P.hips  = (anchors.hips && anchors.hips.pos) ? anchors.hips.pos : [bounds.center_x, bounds.min[1] + bounds.height*0.45, 0];
    // Derive shoulder/elbow/wrist proportional to mesh size
    {
      const meshH = bounds.height;
      const shoulderY = bounds.min[1] + meshH * 0.72;
      const shoulderX = meshH * 0.15;
      P.l_shoulder = [-shoulderX, shoulderY, -0.03];
      P.r_shoulder = [ shoulderX, shoulderY, -0.03];
      // Scale arm lengths to mesh height (defaults assume ~1.0 unit mesh)
      const ua = meshH * 0.19;
      const fa = meshH * 0.12;
      $('upperArmLen').value = ua.toFixed(2);
      $('upperArmLenVal').textContent = ua.toFixed(2);
      $('forearmLen').value = fa.toFixed(2);
      $('forearmLenVal').textContent = fa.toFixed(2);
      P.l_elbow = [P.l_shoulder[0] - ua, P.l_shoulder[1], P.l_shoulder[2]];
      P.r_elbow = [P.r_shoulder[0] + ua, P.r_shoulder[1], P.r_shoulder[2]];
      P.l_wrist = [P.l_elbow[0] - fa, P.l_elbow[1], P.l_elbow[2]];
      P.r_wrist = [P.r_elbow[0] + fa, P.r_elbow[1], P.r_elbow[2]];
      P.l_mid_knuckle = [P.l_wrist[0] - 0.04, P.l_wrist[1], P.l_wrist[2]];
      P.r_mid_knuckle = [P.r_wrist[0] + 0.04, P.r_wrist[1], P.r_wrist[2]];
      console.log('[ARM DEFAULTS] meshH=' + meshH.toFixed(3) + ' shoulderX=' + shoulderX.toFixed(3) + ' shoulderY=' + shoulderY.toFixed(3) + ' ua=' + ua.toFixed(3) + ' fa=' + fa.toFixed(3));
    }
    P.neck = (anchors.neck && anchors.neck.pos) ? anchors.neck.pos : [0, bounds.min[1] + bounds.height*0.78, 0];
    P.head = (anchors.head && anchors.head.pos) ? anchors.head.pos : [0, bounds.min[1] + bounds.height*0.90, 0];
    // Derive chest position (midpoint between pelvis and neck, slightly above)
    P.chest = (anchors.chest && anchors.chest.pos) ? anchors.chest.pos
      : [P.hips[0], (P.hips[1] + P.neck[1]) * 0.5 + 0.03, P.hips[2]];
    // NOTE: Spine sub-joints, collars, and fingers are derived AFTER placed_joints.json
    // loads, by deriveMissingJoints(). This ensures they use user's placed P values.
    // Derive toe positions (at floor level, slightly forward of ankle)
    {
      const floorY = bounds.min[1];
      P.l_toe = [P.l_ankle[0], floorY, P.l_ankle[2] + 0.04];
      P.r_toe = [P.r_ankle[0], floorY, P.r_ankle[2] + 0.04];
    }

    // Override P from saved joints. Priority: placed_joints.json > localStorage > discovered_anchors
    // placed_joints.json is a file next to index.html (persists across browser clears, version-controllable)
    // localStorage is per-browser (persists across page reloads but not browser clears)
    console.log('[WRIST TRACE] after defaults: P.l_wrist=' + (P.l_wrist ? '['+P.l_wrist.map(v=>v.toFixed(4)).join(',')+']' : 'null'));
    let jointsLoaded = await loadJointsFromFile();
    if (!jointsLoaded) jointsLoaded = loadJointsFromStorage();
    console.log('[WRIST TRACE] after placed_joints load (loaded=' + !!jointsLoaded + '): P.l_wrist=' + (P.l_wrist ? '['+P.l_wrist.map(v=>v.toFixed(4)).join(',')+']' : 'null'));
    if (jointsLoaded) {
      console.log('Using saved joint positions' + (jointsLoaded ? '' : ' (localStorage)'));
      // Update sliders from restored joints
      if (P.l_hip && P.l_knee) {
        const tLen = vlen(vsub(P.l_knee, P.l_hip));
        $('thighLen').value = tLen.toFixed(3);
        $('thighLenVal').textContent = tLen.toFixed(3);
      }
      if (P.l_knee && P.l_ankle) {
        const sLen = vlen(vsub(P.l_ankle, P.l_knee));
        $('shinLen').value = sLen.toFixed(3);
        $('shinLenVal').textContent = sLen.toFixed(3);
      }
      if (P.l_shoulder && P.l_elbow) {
        const uLen = vlen(vsub(P.l_elbow, P.l_shoulder));
        $('upperArmLen').value = uLen.toFixed(3);
        $('upperArmLenVal').textContent = uLen.toFixed(3);
      }
      if (P.l_elbow && P.l_wrist) {
        const fLen = vlen(vsub(P.l_wrist, P.l_elbow));
        $('forearmLen').value = fLen.toFixed(3);
        $('forearmLenVal').textContent = fLen.toFixed(3);
      }
    }

    // Derive ALL missing joints from mesh geometry (spine, collars, fingers).
    // Uses user's placed P values — NO FBX data.
    deriveMissingJoints();          // Detect joints on original mesh

    // Diagnostic: log all P joints and bone lengths
    {
      console.log('=== JOINT POSITIONS (P) ===');
      for (const k of Object.keys(P)) {
        if (P[k] && Array.isArray(P[k])) console.log('  P.' + k + ' = [' + P[k].map(v => v.toFixed(4)).join(', ') + ']');
        else if (P[k]) console.log('  P.' + k + ' = NON-ARRAY: ' + typeof P[k] + ' = ' + JSON.stringify(P[k]));
      }
      const boneLens = [];
      if (P.l_hip && P.l_knee) boneLens.push('l_thigh=' + vlen(vsub(P.l_knee, P.l_hip)).toFixed(4));
      if (P.l_knee && P.l_ankle) boneLens.push('l_shin=' + vlen(vsub(P.l_ankle, P.l_knee)).toFixed(4));
      if (P.l_shoulder && P.l_elbow) boneLens.push('l_uarm=' + vlen(vsub(P.l_elbow, P.l_shoulder)).toFixed(4));
      if (P.l_elbow && P.l_wrist) boneLens.push('l_farm=' + vlen(vsub(P.l_wrist, P.l_elbow)).toFixed(4));
      console.log('  Bone lengths: ' + boneLens.join(', '));
    }
    // Initialize retargetedJoints from rest-pose P (so skeleton overlay works before animation)
    for (const k of Object.keys(P)) {
      if (P[k] && Array.isArray(P[k])) retargetedJoints[k] = P[k].slice();
    }

    // ── SPINE SUB-REGION SPLIT ──
    // Split torso (region 0) into spine sub-regions using Y-band boundaries
    // derived from FBX spine bone positions. If FBX spine joints not available,
    // fall back to simple pelvis-only split.
    {
      let spineCount = 0, spine1Count = 0, spine2Count = 0, chestCount = 0, pelvisCount = 0;
      if (P.spine_joint && P.spine1_joint && P.spine2_joint && P.neck) {
        // Y midpoints between adjacent spine joints define region boundaries
        const spineY  = (P.hips[1] + P.spine_joint[1]) / 2;
        const spine1Y = (P.spine_joint[1] + P.spine1_joint[1]) / 2;
        const spine2Y = (P.spine1_joint[1] + P.spine2_joint[1]) / 2;
        const chestY  = (P.spine2_joint[1] + P.neck[1]) / 2;

        for (let i = 0; i < regionId.length; i++) {
          if (regionId[i] !== 0) continue;
          const y = cageRest[i][1];
          if (y < spineY)        { regionId[i] = 14; pelvisCount++; }
          else if (y < spine1Y)  { regionId[i] = 0;  spineCount++; }   // stays as region 0 (spine)
          else if (y < spine2Y)  { regionId[i] = 15; spine1Count++; }
          else if (y < chestY)   { regionId[i] = 16; spine2Count++; }
          else                    { regionId[i] = 17; chestCount++; }
        }
        console.log('[SPINE SPLIT] pelvis=' + pelvisCount + ' spine=' + spineCount +
          ' spine1=' + spine1Count + ' spine2=' + spine2Count + ' chest=' + chestCount);
      } else {
        // Fallback: simple pelvis split only (no FBX spine data)
        const pelvisThreshY = P.hips[1] + 0.07;
        for (let i = 0; i < regionId.length; i++) {
          if (regionId[i] === 0 && cageRest[i][1] < pelvisThreshY) {
            regionId[i] = 14;
            pelvisCount++;
          }
        }
        console.log('[PELVIS SPLIT] Reassigned ' + pelvisCount + ' torso cage verts to pelvis region 14 (Y < ' + pelvisThreshY.toFixed(4) + ')');
      }

      // Phase 2 splits: collar, toe, neck (if FBX data available)
      let lCollarCount = 0, rCollarCount = 0, lToeCount = 0, rToeCount = 0, neckCount = 0;

      // Neck split: lower head verts → neck region 18
      if (P.neck && P.head) {
        const neckHeadMidY = (P.neck[1] + P.head[1]) / 2;
        for (let i = 0; i < regionId.length; i++) {
          if (regionId[i] !== 11) continue;
          if (cageRest[i][1] < neckHeadMidY) {
            regionId[i] = 18;
            neckCount++;
          }
        }
      }

      // Collar split: upper chest verts near collar axis → regions 19/20
      if (P.spine2_joint && P.l_shoulder && P.r_shoulder) {
        for (let i = 0; i < regionId.length; i++) {
          if (regionId[i] !== 17) continue;
          const pos = cageRest[i];
          if (pos[1] < P.spine2_joint[1]) continue;
          const isLeft = pos[0] < P.spine2_joint[0];
          const shoulder = isLeft ? P.l_shoulder : P.r_shoulder;
          const collarDir = vnorm(vsub(shoulder, P.spine2_joint));
          const toVert = vsub(pos, P.spine2_joint);
          const proj = vdot(toVert, collarDir);
          const collarLen = vlen(vsub(shoulder, P.spine2_joint));
          if (proj < 0 || proj > collarLen * 0.8) continue;
          const perpVec = vsub(toVert, vscale(collarDir, proj));
          const perpDist = vlen(perpVec);
          if (perpDist > 0.05) continue;
          regionId[i] = isLeft ? 19 : 20;
          if (isLeft) lCollarCount++; else rCollarCount++;
        }
      }

      // Toe split: far foot verts → regions 21/22
      if (P.l_toe && P.l_ankle && P.r_toe && P.r_ankle) {
        for (let i = 0; i < regionId.length; i++) {
          const r = regionId[i];
          if (r !== 5 && r !== 6) continue;
          const pos = cageRest[i];
          const isLeft = (r === 5);
          const toeJoint = isLeft ? P.l_toe : P.r_toe;
          const ankleJoint = isLeft ? P.l_ankle : P.r_ankle;
          const footDir = vnorm(vsub(toeJoint, ankleJoint));
          const projVal = vdot(vsub(pos, ankleJoint), footDir);
          const toeProj = vdot(vsub(toeJoint, ankleJoint), footDir);
          if (projVal > toeProj * 0.8) {
            regionId[i] = isLeft ? 21 : 22;
            if (isLeft) lToeCount++; else rToeCount++;
          }
        }
      }

      if (neckCount || lCollarCount || rCollarCount || lToeCount || rToeCount) {
        console.log('[REGION SPLIT] Collar: ' + lCollarCount + '/' + rCollarCount +
          ' verts, Toe: ' + lToeCount + '/' + rToeCount + ' verts, Neck: ' + neckCount + ' verts');
      }
    }

    R.torso = indicesByRegion(0);     // now "spine" region
    R.hips = indicesByRegion(14);
    R.spine1 = indicesByRegion(15);
    R.spine2 = indicesByRegion(16);
    R.chest = indicesByRegion(17);
    R.neck_reg = indicesByRegion(18);
    R.l_collar = indicesByRegion(19);
    R.r_collar = indicesByRegion(20);
    R.l_thigh = indicesByRegion(1);
    R.r_thigh = indicesByRegion(2);
    R.l_shin  = indicesByRegion(3);
    R.r_shin  = indicesByRegion(4);
    R.l_foot  = indicesByRegion(5);
    R.r_foot  = indicesByRegion(6);
    R.l_toe_reg = indicesByRegion(21);
    R.r_toe_reg = indicesByRegion(22);
    R.l_upperarm = indicesByRegion(7);
    R.r_upperarm = indicesByRegion(8);
    R.l_forearm  = indicesByRegion(9);
    R.r_forearm  = indicesByRegion(10);
    R.head       = indicesByRegion(11);

    // Save combined arm cage vert pools (before re-split)
    allLeftArmCage  = [].concat(R.l_upperarm, R.l_forearm, indicesByRegion(12));
    allRightArmCage = [].concat(R.r_upperarm, R.r_forearm, indicesByRegion(13));

    // Save combined leg cage vert pools (before re-split)
    allLeftLegCage  = [].concat(R.l_thigh, R.l_shin, R.l_foot, R.l_toe_reg);
    allRightLegCage = [].concat(R.r_thigh, R.r_shin, R.r_foot, R.r_toe_reg);
    // Pelvis pool: original pelvis verts + low spine verts near hip area
    allPelvisCage = R.hips.slice();
    const hipY = Math.max(P.l_hip[1], P.r_hip[1]);
    let lowTorsoCount = 0;
    for (const ci of R.torso) {
      if (cageRest[ci][1] <= hipY + 0.12) {
        allPelvisCage.push(ci);
        lowTorsoCount++;
      }
    }
    console.log('Leg pools: L_leg=' + allLeftLegCage.length + ' R_leg=' + allRightLegCage.length +
      ' pelvis+lowTorso=' + allPelvisCage.length + ' (lowTorso=' + lowTorsoCount + ')');

    // Rescale cage proportions to match FBX skeleton (if FBX data is available at init)
    if (jointPosData && jointPosData.rest_pose) {
      rescaleCageToFBX(jointPosData.rest_pose);
    }

    // Auto-compute leg slider defaults from cage geometry
    {
      const tLen = vlen(vsub(P.l_knee, P.l_hip));
      const sLen = vlen(vsub(P.l_ankle, P.l_knee));
      $('thighLen').value = tLen.toFixed(3);
      $('thighLenVal').textContent = tLen.toFixed(3);
      $('shinLen').value = sLen.toFixed(3);
      $('shinLenVal').textContent = sLen.toFixed(3);
      console.log('Leg slider defaults: thigh=' + tLen.toFixed(4) + ' shin=' + sLen.toFixed(4));
    }

    console.log("Baked cage arm sizes: l_uarm=" + R.l_upperarm.length +
      " l_farm=" + R.l_forearm.length + " r_uarm=" + R.r_upperarm.length +
      " r_farm=" + R.r_forearm.length);
    console.log("Pelvis region: " + R.hips.length + " verts, torso(spine) remaining: " + R.torso.length +
      " spine1: " + R.spine1.length + " spine2: " + R.spine2.length + " chest: " + R.chest.length);

    // Build regionIndices lookup for Kabsch transforms (non-arm/non-analytical regions)
    regionIndices[0]  = R.torso;
    if (R.hips.length >= 4) regionIndices[14] = R.hips;
    if (R.spine1.length >= 4) regionIndices[15] = R.spine1;
    if (R.spine2.length >= 4) regionIndices[16] = R.spine2;
    if (R.chest.length >= 4) regionIndices[17] = R.chest;
    if (R.neck_reg.length >= 4) regionIndices[18] = R.neck_reg;
    if (R.l_collar.length >= 4) regionIndices[19] = R.l_collar;
    if (R.r_collar.length >= 4) regionIndices[20] = R.r_collar;
    if (R.l_toe_reg.length >= 4) regionIndices[21] = R.l_toe_reg;
    if (R.r_toe_reg.length >= 4) regionIndices[22] = R.r_toe_reg;
    regionIndices[1]  = R.l_thigh;
    regionIndices[2]  = R.r_thigh;
    regionIndices[3]  = R.l_shin;
    regionIndices[4]  = R.r_shin;
    regionIndices[5]  = R.l_foot;
    regionIndices[6]  = R.r_foot;
    if (R.head.length) regionIndices[11] = R.head;

    // Re-split arm cage verts by distance from shoulder (matching reference)
    // This also rebuilds mesh bindings and region weights
    resplitArmRegions();

    // Re-split leg cage verts using skeleton joint positions.
    // CRITICAL: must be called here on initial load — not just on slider input.
    // Without this, leg regions use the original cage file assignments instead of
    // skeleton-aware projection-based splits, AND the thigh geometry clamp in
    // buildBindKNNRegion gets correct leg region distribution.
    resplitLegRegions();
    autoDetectToeFromMesh(); // Override synthetic floor-level toe with actual mesh toe tip

    // Build PBD stretch constraints for crotch edges (after weights + pivots ready)
    buildStretchConstraints();
    buildCrossBoundaryEdges();

    // Build mesh adjacency (edges + neighbor lists) for strain diagnostic + Delta Mush
    buildMeshAdjacency();
    computeRestVertexNormals();

    // Hook up slider to re-split when adjusted
    $('upperArmLen').addEventListener('input', resplitArmRegions);
    $('forearmLen').addEventListener('input', resplitArmRegions);
    $('shoulderX').addEventListener('input', resplitArmRegions);
    $('pelvisHeight').addEventListener('input', resplitLegRegions);
    $('thighLen').addEventListener('input', resplitLegRegions);
    $('shinLen').addEventListener('input', resplitLegRegions);

    // Weight mode checkbox handlers: recompute weights when toggled
    function recomputeWeights() {
      if (!meshRestPos) return;
      if ($('useFBXWeights').checked && fbxSkinData) {
        meshVertRegions = computeFBXTransferredWeights(meshRestPos);
        console.log('[WEIGHTS] Switched to FBX transferred weights');
      } else if (false/*boneEnvWeights removed*/) {
        meshVertRegions = computeBoneEnvelopeWeights(meshRestPos);
        console.log('[WEIGHTS] Switched to bone-envelope weights');
      } else if (bindIdx && bindW && K && regionId) {
        meshVertRegions = precomputeMeshRegionWeights(meshRestPos, bindIdx, bindW, K, regionId);
        console.log('[WEIGHTS] Switched to cage KNN weights');
      }
      // Also recompute per-bone weights if per-bone LBS is active
      if ($('useBoneLBS').checked && fbxSkinData && fbxSkinData.boneWeights) {
        meshBoneWeights = computeBarycentricWeightTransfer(meshRestPos);
        saveBoneWeightsRaw();
      } else {
        meshBoneWeights = null; meshBoneWeightsRaw = null;
        meshTriMapTri = null; meshTriMapBary = null;
      }
      meshVertEmaAlpha = buildPerVertexEmaAlpha(meshVertRegions);
      window._innerThighDiagDone = false;
      // Immediately update the visible mesh so checkbox changes are visible without
      // needing to toggle play/pause.
      if (typeof deformMesh === 'function') deformMesh();
    }
    // boneEnvWeights removed — always false
    $('useFBXWeights').addEventListener('change', recomputeWeights);
    // FBX deform transfer needs the K-neighbor mapping; trigger weight computation to build it
    $('fbxDeformTransfer').addEventListener('change', function() {
      if (this.checked && fbxSkinData && meshRestPos && !window._fbxVertMapping) {
        computeFBXTransferredWeights(meshRestPos); // builds the mapping as a side effect
      }
      window._fbxDeformDiagDone = false; // reset diagnostic
    });
    // Per-bone LBS: compute barycentric weight transfer when enabled
    $('useBoneLBS').addEventListener('change', function() {
      if (this.checked && fbxSkinData && fbxSkinData.boneWeights && meshRestPos) {
        if (!meshBoneWeights) {
          console.log('[BONE LBS] Computing barycentric weight transfer...');
          meshBoneWeights = computeBarycentricWeightTransfer(meshRestPos);
          if (meshBoneWeights) {
            console.log('[BONE LBS] Weight transfer complete: ' +
              meshBoneWeights.filter(w => w !== null).length + '/' + meshBoneWeights.length + ' verts with weights');
            saveBoneWeightsRaw();
          }
        }
      }
      if (typeof deformMesh === 'function') deformMesh();
    });
    // Weight sharpening sliders: restore raw weights, re-sharpen, re-deform
    function _onSharpenChange() {
      const sU = parseFloat($('sharpenUpperSlider').value);
      const sL = parseFloat($('sharpenLowerSlider').value);
      $('sharpenUpperVal').textContent = sU.toFixed(2);
      $('sharpenLowerVal').textContent = sL.toFixed(2);
      if (!meshBoneWeightsRaw || !meshBoneWeights) return;
      // Restore from raw (deep copy)
      for (let i = 0; i < meshBoneWeightsRaw.length; i++) {
        if (meshBoneWeightsRaw[i]) {
          if (!meshBoneWeights[i]) meshBoneWeights[i] = meshBoneWeightsRaw[i].slice();
          else {
            meshBoneWeights[i].length = meshBoneWeightsRaw[i].length;
            for (let j = 0; j < meshBoneWeightsRaw[i].length; j++) {
              meshBoneWeights[i][j] = meshBoneWeightsRaw[i][j];
            }
          }
        }
      }
      sharpenMidSegmentWeights(meshBoneWeights, sU, sL);
      window._rigidityTransformDebugDone = false;
      if (typeof deformMesh === 'function') deformMesh();
    }
    $('sharpenUpperSlider').addEventListener('input', _onSharpenChange);
    $('sharpenLowerSlider').addEventListener('input', _onSharpenChange);

    // DQS / FBX transforms: re-deform mesh immediately on toggle so changes are
    // visible without needing to restart animation.
    for (const cbId of ['useDQS', 'useFBXTransforms', 'fbxDeformTransfer', 'showRigidity', 'showBendLoc']) {
      $(cbId).addEventListener('change', function() {
        if (typeof deformMesh === 'function') deformMesh();
      });
    }
    // useFBXJoints removed — always uses our derived joint positions
    // When cage is turned off, ensure FK prerequisites are enabled
    $('useCage').addEventListener('change', function() {
      if (!this.checked) {
        if (!$('useFBXTransforms').checked) { $('useFBXTransforms').checked = true; $('useFBXTransforms').dispatchEvent(new Event('change')); }
      }
    });

    // motion JSON
    motionData = legMotion.keyframes;
    // Only use leg duration if joint_positions.json didn't already set it
    if (!jointPosData) cycleDuration = legMotion.duration || 1.0;
    armMotionData = armMotion.keyframes || null;
    spineMotionData = spineMotion.keyframes || null;

    // Smooth spine and leg Euler rotation data (same as arm smoothing below).
    // These drive body lean, hip twist, and leg angles — noise here propagates everywhere.
    if (spineMotionData) {
      for (const boneName of Object.keys(spineMotionData)) {
        const bone = spineMotionData[boneName];
        if (!bone || typeof bone !== 'object') continue;
        for (const axis of ['x_rot', 'y_rot', 'z_rot']) {
          if (bone[axis] && Array.isArray(bone[axis]) && bone[axis].length > 3) {
            bone[axis] = smoothArray(bone[axis], 8);
          }
        }
      }
    }
    if (motionData) {
      for (const boneName of Object.keys(motionData)) {
        const bone = motionData[boneName];
        if (!bone || typeof bone !== 'object') continue;
        for (const axis of ['x_rot', 'y_rot', 'z_rot']) {
          if (bone[axis] && Array.isArray(bone[axis]) && bone[axis].length > 3) {
            bone[axis] = smoothArray(bone[axis], 8);
          }
        }
      }
    }

    // Post-process arm keyframe data for smooth animation.
    if (armMotionData) {
      // Smooth elbow/wrist data (8 passes removes micro-oscillations while
      // preserving the bend shape; elbows have more complex motion than shoulders).
      for (const boneName of Object.keys(armMotionData)) {
        if (boneName.includes('shoulder')) continue; // shoulders handled below
        const bone = armMotionData[boneName];
        for (const axis of ['x_rot', 'y_rot', 'z_rot']) {
          if (bone[axis] && bone[axis].length > 3) {
            bone[axis] = smoothArray(bone[axis], 8);
          }
        }
      }

      // Replace shoulder x_rot with sinusoidal fit for perfectly smooth pendulum.
      // Walking arm swing IS fundamentally a pendulum — the Mixamo data has a
      // 10-frame plateau/wobble region from Euler decomposition artifacts that
      // causes visible jerkiness. Fitting a cosine preserves timing and amplitude
      // while eliminating all micro-reversals.
      for (const boneName of ['l_shoulder', 'r_shoulder']) {
        const bone = armMotionData[boneName];
        if (!bone || !bone.x_rot || bone.x_rot.length < 4) continue;
        const arr = bone.x_rot;
        const n = arr.length;
        const meanVal = arr.reduce((a,b) => a+b, 0) / n;
        const maxV = Math.max(...arr);
        const minV = Math.min(...arr);
        const amplitude = (maxV - minV) / 2;
        const peakIdx = arr.indexOf(maxV);
        // Replace with cosine: peaks at peakIdx, troughs half a cycle away
        for (let i = 0; i < n; i++) {
          arr[i] = meanVal + amplitude * Math.cos(2 * Math.PI * (i - peakIdx) / n);
        }
      }
    }

    // Compute arm baselines for delta computation.
    // Shoulder: MEAN-based baseline → symmetric forward/backward swing.
    // Elbow/Wrist: MIN-bend baseline → deltas are always >= 0, no hyperextension.
    //   Left z_rot is positive (more = more bend), so baseline = min(z_rot).
    //   Right z_rot is negative (more negative = more bend), so baseline = max(z_rot).
    if (armMotionData) {
      const deg = Math.PI / 180;
      const mean = (bone, axis) => {
        const d = armMotionData[bone];
        if (!d || !d[axis] || !d[axis].length) return 0;
        const arr = d[axis];
        return (arr.reduce((a,b) => a+b, 0) / arr.length) * deg;
      };
      const first = (bone, axis) => {
        const d = armMotionData[bone];
        return d && d[axis] && d[axis].length ? d[axis][0] * deg : 0;
      };
      const minVal = (bone, axis) => {
        const d = armMotionData[bone];
        return d && d[axis] && d[axis].length ? Math.min(...d[axis]) * deg : 0;
      };
      const maxVal = (bone, axis) => {
        const d = armMotionData[bone];
        return d && d[axis] && d[axis].length ? Math.max(...d[axis]) * deg : 0;
      };
      armBaseline = {
        // Shoulder: mean for symmetric swing
        l_shoulder: { x: mean('l_shoulder','x_rot'), y: mean('l_shoulder','y_rot'), z: mean('l_shoulder','z_rot') },
        r_shoulder: { x: mean('r_shoulder','x_rot'), y: mean('r_shoulder','y_rot'), z: mean('r_shoulder','z_rot') },
        // Elbow: min-bend baseline (left=min z_rot, right=max z_rot i.e. closest to 0)
        l_elbow:    { x: first('l_elbow','x_rot'), y: first('l_elbow','y_rot'), z: minVal('l_elbow','z_rot') },
        r_elbow:    { x: first('r_elbow','x_rot'), y: first('r_elbow','y_rot'), z: maxVal('r_elbow','z_rot') },
        // Wrist: same min-bend approach
        l_wrist:    { x: first('l_wrist','x_rot'), y: first('l_wrist','y_rot'), z: minVal('l_wrist','z_rot') },
        r_wrist:    { x: first('r_wrist','x_rot'), y: first('r_wrist','y_rot'), z: maxVal('r_wrist','z_rot') },
      };
    }

    // cage mesh wireframe
    const cgeom = new THREE.BufferGeometry();
    const carr = new Float32Array(cageRest.length*3);
    for(let i=0;i<cageRest.length;i++){
      carr[i*3]=cageRest[i][0];
      carr[i*3+1]=cageRest[i][1];
      carr[i*3+2]=cageRest[i][2];
    }
    cgeom.setAttribute('position', new THREE.BufferAttribute(carr,3));
    const cidx = new Uint32Array(cageFaces.length*3);
    for(let i=0;i<cageFaces.length;i++){
      cidx[i*3]=cageFaces[i][0];
      cidx[i*3+1]=cageFaces[i][1];
      cidx[i*3+2]=cageFaces[i][2];
    }
    cgeom.setIndex(new THREE.BufferAttribute(cidx,1));
    cageMesh = new THREE.Mesh(
      cgeom,
      new THREE.MeshBasicMaterial({color:0x4ecdc4, wireframe:true, transparent:true, opacity:0.5})
    );
    scene.add(cageMesh);

    // Expose key data for external tools (Selenium scan, pipeline bridge, etc.)
    window._meshRestPos = meshRestPos;
    window._meshObj = meshObj;
    window._meshGeo = meshGeo;
    window._meshAdjacency = meshAdjacency;
    window._meshBoneWeights = meshBoneWeights;
    window._P = P;
    window._cageRest = cageRest;
    window._camera = camera;
    window._controls = controls;
    window._initDone = true;

    statusEl.textContent = "Ready.";
  })().catch(err=>{
    console.error(err);
    statusEl.textContent = "Load failed. Make sure you're using a local server (not file://).";
  });

  // ---------------- Animate (real dt from performance.now) ----------------
  let time = 0;
  let lastNow = performance.now();
  let detLogTimer = 0;
  let wasPlaying = false; // track play state transitions for rest-pose reset

  function tick(){
    requestAnimationFrame(tick);

    const now = performance.now();
    const rawDt = (now - lastNow) / 1000;
    lastNow = now;
    const dt = Math.min(rawDt, 0.05); // clamp to 50ms max

    const isPlaying = $('play').checked && cageRest && (motionData || jointPosData);

    // Reset to rest pose when animation stops (or in placement mode)
    if ((!isPlaying && wasPlaying) || (placementMode && wasPlaying)) {
      if (meshGeo && meshRestPos) {
        const pos = meshGeo.attributes.position.array;
        for (let i = 0; i < meshRestPos.length; i++) pos[i] = meshRestPos[i];
        meshGeo.attributes.position.needsUpdate = true;
        meshGeo.computeVertexNormals();
        // Reset vertex colors
        if (meshObj) {
          meshObj.material.vertexColors = false;
          if (meshObj.material._savedMap) { meshObj.material.map = meshObj.material._savedMap; delete meshObj.material._savedMap; }
          meshObj.material.needsUpdate = true;
        }
      }
      if (cageRest && cagePos) {
        for (let i = 0; i < cageRest.length; i++) {
          cagePos[i*3] = cageRest[i][0]; cagePos[i*3+1] = cageRest[i][1]; cagePos[i*3+2] = cageRest[i][2];
        }
        updateCageMesh();
      }
      // Clear retargetedJoints so FBX joint spheres show rest-pose P positions
      retargetedJoints = {};
    }
    wasPlaying = isPlaying && !placementMode;

    if(isPlaying && !placementMode){
      time += dt * (+$('speed').value);
      if ($('useCage').checked) {
        driveCageFromMixamo(time);
      } else if (jointPosData && jointPosData.rest_quats) {
        computeDirectFKJoints(time);
      }
      deformMesh();
      if(cageMesh){
        cageMesh.visible = false/*showCage removed*/;
        updateCageMesh();
      }
      // FBX live skinned mesh: tick the mixer in sync with cage animation
      if (fbxLiveMixer && fbxLiveGroup) {
        const showFBXLive = $('showFBXGhost').checked;
        fbxLiveGroup.visible = showFBXLive;
        if (showFBXLive) {
          // Sync FBX mixer to same time as cage (using setTime for frame-accurate sync)
          fbxLiveMixer.setTime(time % cycleDuration);
          // Apply ground correction so ghost mesh feet/hands don't go through floor
          if (window._ghostBaseY !== undefined) {
            fbxLiveGroup.position.y = window._ghostBaseY + lastGroundCorrection;
          }
        }
      }

      // ── Multi-frame diagnostic accumulator ──
      if (_mfDiag && !_mfDiag.done && meshGeo && meshAdjacency && meshRestPos) {
        const pos = meshGeo.attributes.position.array;
        const nMesh = meshRestPos.length / 3;
        const { edgeA, edgeB, edgeRestLen, nEdges } = meshAdjacency;
        _mfDiag.frameCount++;
        if (_mfDiag.frameCount === 1) console.log('[MULTI-FRAME] Accumulator started');
        if (_mfDiag.frameCount % 60 === 0) console.log('[MULTI-FRAME] Frame ' + _mfDiag.frameCount + '/' + _mfDiag.targetFrames);

        // (a) Track worst edge stretch per frame
        let frameWorstStretch = 0, frameWorstEdge = -1;
        let frameTotalDev = 0;
        for (let e = 0; e < nEdges; e++) {
          const a = edgeA[e], b = edgeB[e];
          const dx = pos[b*3]-pos[a*3], dy = pos[b*3+1]-pos[a*3+1], dz = pos[b*3+2]-pos[a*3+2];
          const curLen = Math.sqrt(dx*dx+dy*dy+dz*dz);
          const rest = edgeRestLen[e];
          if (rest < 1e-8) continue;
          const ratio = curLen / rest;
          const dev = Math.abs(ratio - 1.0);
          frameTotalDev += dev;
          if (ratio > frameWorstStretch) { frameWorstStretch = ratio; frameWorstEdge = e; }
        }
        const frameAvgDev = frameTotalDev / nEdges;
        if (frameWorstStretch > _mfDiag.worstStretch) {
          _mfDiag.worstStretch = frameWorstStretch;
          _mfDiag.worstStretchFrame = _mfDiag.frameCount;
          _mfDiag.worstStretchEdge = frameWorstEdge;
        }
        _mfDiag.totalAvgDev += frameAvgDev;
        if (frameAvgDev > _mfDiag.worstAvgDev) _mfDiag.worstAvgDev = frameAvgDev;

        // (b) Track vertex jitter (acceleration = velocity change between frames)
        // True jitter is rapid direction changes, not smooth fast movement
        if (_mfDiag.prevPos) {
          // Compute current velocities
          if (!_mfDiag.curVel) _mfDiag.curVel = new Float32Array(nMesh * 3);
          for (let i = 0; i < nMesh * 3; i++) {
            _mfDiag.curVel[i] = pos[i] - _mfDiag.prevPos[i];
          }
          if (_mfDiag.prevVel) {
            // Acceleration = velocity change
            let maxAccel = 0, accelVert = -1, totalAccel = 0;
            for (let i = 0; i < nMesh; i++) {
              const ax = _mfDiag.curVel[i*3] - _mfDiag.prevVel[i*3];
              const ay = _mfDiag.curVel[i*3+1] - _mfDiag.prevVel[i*3+1];
              const az = _mfDiag.curVel[i*3+2] - _mfDiag.prevVel[i*3+2];
              const accel = Math.sqrt(ax*ax+ay*ay+az*az);
              totalAccel += accel;
              if (accel > maxAccel) { maxAccel = accel; accelVert = i; }
            }
            const avgAccel = totalAccel / nMesh;
            if (maxAccel > _mfDiag.worstJitter) {
              _mfDiag.worstJitter = maxAccel;
              _mfDiag.worstJitterVert = accelVert;
              _mfDiag.worstJitterFrame = _mfDiag.frameCount;
            }
            _mfDiag.totalAvgJitter += avgAccel;
          }
          // Store current velocity as previous for next frame
          if (!_mfDiag.prevVel) _mfDiag.prevVel = new Float32Array(nMesh * 3);
          _mfDiag.prevVel.set(_mfDiag.curVel);
        }
        _mfDiag.prevPos = pos.slice();

        // (c) Track foot ground contact
        if (meshVertRegions) {
          for (const footRid of [5, 6]) { // l_foot=5, r_foot=6
            let minY = Infinity, maxY = -Infinity;
            for (let i = 0; i < nMesh; i++) {
              const entries = meshVertRegions[i];
              if (!entries) continue;
              let footW = 0;
              for (let k = 0; k < entries.length; k += 2) {
                if (entries[k] === footRid) { footW = entries[k+1]; break; }
              }
              if (footW < 0.5) continue; // only dominant foot verts
              const y = pos[i*3+1];
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
            if (minY < Infinity) {
              const key = footRid === 5 ? 'lFoot' : 'rFoot';
              if (minY < _mfDiag[key + 'MinY']) _mfDiag[key + 'MinY'] = minY;
              if (minY > _mfDiag[key + 'MaxMinY']) _mfDiag[key + 'MaxMinY'] = minY; // highest per-frame floor
              _mfDiag[key + 'TotalMinY'] += minY;
            }
          }
        }

        // (d) Track bone direction errors + angular velocity frame-by-frame
        if (retargetedDirs && fbxFrameDirs) {
          if (!_mfDiag.boneDirData) {
            const bones = ['l_thigh','r_thigh','l_shin','r_shin','l_foot','r_foot',
                           'l_uarm','r_uarm','l_farm','r_farm','torso','head',
                           'spine','spine1','spine2','chest','l_collar','r_collar'];
            _mfDiag.boneDirData = {};
            for (const b of bones) {
              _mfDiag.boneDirData[b] = {
                maxAngErr: 0, totalAngErr: 0, worstFrame: 0, count: 0,
                maxAngVel: 0, totalAngVel: 0, maxAngAccel: 0, totalAngAccel: 0,
                prevDir: null, prevAngVel: 0, velCount: 0, accelCount: 0,
                // Per-frame tracking for timeline dump
                frameErrors: [], frameAngVels: []
              };
            }
          }
          const bd = _mfDiag.boneDirData;
          for (const bone of Object.keys(bd)) {
            const ours = retargetedDirs[bone];
            const fbx = fbxFrameDirs[bone];
            if (ours && fbx) {
              // Angular error between our direction and FBX direction (degrees)
              const angErr = Math.acos(Math.max(-1, Math.min(1, vdot(ours, fbx)))) * 180 / Math.PI;
              bd[bone].totalAngErr += angErr;
              bd[bone].count++;
              bd[bone].frameErrors.push(angErr);
              if (angErr > bd[bone].maxAngErr) {
                bd[bone].maxAngErr = angErr;
                bd[bone].worstFrame = _mfDiag.frameCount;
              }
              // Angular velocity: how fast our direction changes frame-to-frame (deg/frame)
              if (bd[bone].prevDir) {
                const angVel = Math.acos(Math.max(-1, Math.min(1, vdot(ours, bd[bone].prevDir)))) * 180 / Math.PI;
                bd[bone].totalAngVel += angVel;
                bd[bone].velCount++;
                bd[bone].frameAngVels.push(angVel);
                if (angVel > bd[bone].maxAngVel) bd[bone].maxAngVel = angVel;
                // Angular acceleration: change in angular velocity (deg/frame^2)
                const angAccel = Math.abs(angVel - bd[bone].prevAngVel);
                bd[bone].totalAngAccel += angAccel;
                bd[bone].accelCount++;
                if (angAccel > bd[bone].maxAngAccel) bd[bone].maxAngAccel = angAccel;
                bd[bone].prevAngVel = angVel;
              }
              bd[bone].prevDir = ours.slice();
            }
          }
        }

        // (e) Track joint angle errors per frame (coordinate-agnostic)
        if (retargetedAngles && fbxFrameAngles) {
          if (!_mfDiag.jointAngleData) {
            const joints = ['l_knee','r_knee','l_ankle','r_ankle','l_elbow','r_elbow',
                           'l_hip','r_hip','l_shoulder','r_shoulder',
                           'spine_joint','spine1_joint','spine2_joint','neck'];
            _mfDiag.jointAngleData = {};
            for (const j of joints) {
              _mfDiag.jointAngleData[j] = {
                maxErr: 0, totalErr: 0, count: 0, worstFrame: 0,
                maxVelDiff: 0, totalVelDiff: 0, velCount: 0,
                prevOurs: null, prevFbx: null, frameErrors: [],
                // Motion fidelity: subtract rest-pose offset to measure tracking quality
                restOffset: null, maxMotionErr: 0, totalMotionErr: 0, motionCount: 0,
                worstMotionFrame: 0
              };
            }
          }
          const jad = _mfDiag.jointAngleData;
          for (const joint of Object.keys(jad)) {
            const ours = retargetedAngles[joint];
            const fbx = fbxFrameAngles[joint];
            if (ours !== null && fbx !== null) {
              const err = Math.abs(ours - fbx);
              jad[joint].totalErr += err;
              jad[joint].count++;
              jad[joint].frameErrors.push(err);
              if (err > jad[joint].maxErr) {
                jad[joint].maxErr = err;
                jad[joint].worstFrame = _mfDiag.frameCount;
              }
              // Motion fidelity: subtract first-frame offset to isolate tracking error
              if (jad[joint].restOffset === null) {
                jad[joint].restOffset = ours - fbx; // constant rest-pose angle difference
              }
              const motionErr = Math.abs((ours - jad[joint].restOffset) - fbx);
              jad[joint].totalMotionErr += motionErr;
              jad[joint].motionCount++;
              if (motionErr > jad[joint].maxMotionErr) {
                jad[joint].maxMotionErr = motionErr;
                jad[joint].worstMotionFrame = _mfDiag.frameCount;
              }
              if (jad[joint].prevOurs !== null) {
                const oursVel = Math.abs(ours - jad[joint].prevOurs);
                const fbxVel = Math.abs(fbx - jad[joint].prevFbx);
                const velDiff = Math.abs(oursVel - fbxVel);
                jad[joint].totalVelDiff += velDiff;
                jad[joint].velCount++;
                if (velDiff > jad[joint].maxVelDiff) jad[joint].maxVelDiff = velDiff;
              }
              jad[joint].prevOurs = ours;
              jad[joint].prevFbx = fbx;
            }
          }
        }

        // (f) Track bone length ratios per frame
        if (retargetedBoneLens && fbxFrameBoneLens) {
          if (!_mfDiag.boneLenData) {
            const bones = ['l_thigh','r_thigh','l_shin','r_shin','l_foot','r_foot',
                          'l_uarm','r_uarm','l_farm','r_farm',
                          'spine','spine1','spine2','chest','l_collar','r_collar'];
            _mfDiag.boneLenData = {};
            for (const b of bones) {
              _mfDiag.boneLenData[b] = {
                totalRatio: 0, minRatio: Infinity, maxRatio: 0, count: 0,
                totalOurs: 0, totalFbx: 0
              };
            }
          }
          const bld = _mfDiag.boneLenData;
          for (const bone of Object.keys(bld)) {
            const ours = retargetedBoneLens[bone];
            const fbx = fbxFrameBoneLens[bone];
            if (ours !== null && fbx !== null && fbx > 0.1) {
              const ratio = ours / fbx;
              bld[bone].totalRatio += ratio;
              bld[bone].totalOurs += ours;
              bld[bone].totalFbx += fbx;
              bld[bone].count++;
              if (ratio < bld[bone].minRatio) bld[bone].minRatio = ratio;
              if (ratio > bld[bone].maxRatio) bld[bone].maxRatio = ratio;
            }
          }
        }

        // (g) Track relative position errors per frame (pelvis-relative, height-normalized)
        if (retargetedRelPos && fbxFrameRelPos) {
          if (!_mfDiag.relPosData) {
            const joints = ['l_knee','r_knee','l_ankle','r_ankle','l_toe','r_toe',
                           'l_elbow','r_elbow','l_wrist','r_wrist','l_shoulder','r_shoulder','head',
                           'spine_joint','spine1_joint','spine2_joint','l_collar','r_collar','neck'];
            _mfDiag.relPosData = {};
            for (const j of joints) {
              _mfDiag.relPosData[j] = { maxErr: 0, totalErr: 0, count: 0, worstFrame: 0 };
            }
          }
          const rpd = _mfDiag.relPosData;
          for (const joint of Object.keys(rpd)) {
            const ours = retargetedRelPos[joint];
            const fbx = fbxFrameRelPos[joint];
            if (ours && fbx) {
              const err = vlen(vsub(ours, fbx));
              rpd[joint].totalErr += err;
              rpd[joint].count++;
              if (err > rpd[joint].maxErr) {
                rpd[joint].maxErr = err;
                rpd[joint].worstFrame = _mfDiag.frameCount;
              }
            }
          }
        }

        // (g1.5) Shape fidelity: joint angle + chain plane error (proportion-invariant)
        if (retargetedJoints && fbxFrameJointPos && Object.keys(fbxFrameJointPos).length > 0) {
          const SHAPE_SEGMENTS = {
            l_thigh: ['hips', 'l_hip', 'l_knee'],
            r_thigh: ['hips', 'r_hip', 'r_knee'],
            l_shin:  ['l_hip', 'l_knee', 'l_ankle'],
            r_shin:  ['r_hip', 'r_knee', 'r_ankle'],
            l_foot:  ['l_knee', 'l_ankle', 'l_toe'],
            r_foot:  ['r_knee', 'r_ankle', 'r_toe'],
            l_uarm:  ['spine2_joint', 'l_shoulder', 'l_elbow'],
            r_uarm:  ['spine2_joint', 'r_shoulder', 'r_elbow'],
            l_farm:  ['l_shoulder', 'l_elbow', 'l_wrist'],
            r_farm:  ['r_shoulder', 'r_elbow', 'r_wrist'],
            torso:   ['l_hip', 'hips', 'spine2_joint']
          };
          if (!_mfDiag.shapeFidelity) {
            _mfDiag.shapeFidelity = {};
            for (const seg of Object.keys(SHAPE_SEGMENTS)) {
              _mfDiag.shapeFidelity[seg] = {
                bendTotalErr: 0, bendMaxErr: 0, planeTotalErr: 0, planeMaxErr: 0,
                combinedTotalErr: 0, combinedMaxErr: 0,
                count: 0, worstFrame: 0
              };
            }
          }
          const sf = _mfDiag.shapeFidelity;
          const rj = retargetedJoints;
          const fp = fbxFrameJointPos;
          for (const seg of Object.keys(SHAPE_SEGMENTS)) {
            const [aName, bName, cName] = SHAPE_SEGMENTS[seg];
            const Ac = rj[aName], Bc = rj[bName], Cc = rj[cName];
            const Af = fp[aName], Bf = fp[bName], Cf = fp[cName];
            if (!Ac || !Bc || !Cc || !Af || !Bf || !Cf) continue;

            // Bend angle error at middle joint B
            const cageBend = Math.acos(Math.max(-1, Math.min(1,
              vdot(vnorm(vsub(Ac, Bc)), vnorm(vsub(Cc, Bc)))))) * 180 / Math.PI;
            const fbxBend = Math.acos(Math.max(-1, Math.min(1,
              vdot(vnorm(vsub(Af, Bf)), vnorm(vsub(Cf, Bf)))))) * 180 / Math.PI;
            const bendErr = Math.abs(cageBend - fbxBend);

            // Chain plane error: compare plane normals from reference triangle
            const cageCross = vcross(vsub(Bc, Ac), vsub(Cc, Ac));
            const fbxCross = vcross(vsub(Bf, Af), vsub(Cf, Af));
            let planeErr = 0;
            if (vlen(cageCross) > 1e-6 && vlen(fbxCross) > 1e-6) {
              const cn = vnorm(cageCross);
              const fn = vnorm(fbxCross);
              // abs(dot) because normals can be flipped (same plane, opposite facing)
              planeErr = Math.acos(Math.max(-1, Math.min(1, Math.abs(vdot(cn, fn))))) * 180 / Math.PI;
            }

            const combinedErr = Math.sqrt(bendErr * bendErr + planeErr * planeErr);
            sf[seg].bendTotalErr += bendErr;
            if (bendErr > sf[seg].bendMaxErr) sf[seg].bendMaxErr = bendErr;
            sf[seg].planeTotalErr += planeErr;
            if (planeErr > sf[seg].planeMaxErr) sf[seg].planeMaxErr = planeErr;
            sf[seg].combinedTotalErr += combinedErr;
            sf[seg].count++;
            if (combinedErr > sf[seg].combinedMaxErr) {
              sf[seg].combinedMaxErr = combinedErr;
              sf[seg].worstFrame = _mfDiag.frameCount;
            }
          }
        }

        // (g1.6) Contact drift: track joint displacement when foot/hand is locked
        {
          if (!_mfDiag.contactDrift) {
            _mfDiag.contactDrift = {
              l_foot: { maxDrift: 0, totalDrift: 0, lockedFrames: 0, lockJointPos: null, wasLocked: false },
              r_foot: { maxDrift: 0, totalDrift: 0, lockedFrames: 0, lockJointPos: null, wasLocked: false },
              l_hand: { maxDrift: 0, totalDrift: 0, lockedFrames: 0, lockJointPos: null, wasLocked: false },
              r_hand: { maxDrift: 0, totalDrift: 0, lockedFrames: 0, lockJointPos: null, wasLocked: false },
            };
          }
          const cd = _mfDiag.contactDrift;
          // Left foot
          if (lockL) {
            if (!cd.l_foot.wasLocked && retargetedJoints.l_ankle) {
              cd.l_foot.lockJointPos = retargetedJoints.l_ankle.slice();
              cd.l_foot.wasLocked = true;
            }
            if (cd.l_foot.lockJointPos && retargetedJoints.l_ankle) {
              const drift = vlen(vsub(retargetedJoints.l_ankle, cd.l_foot.lockJointPos)) * 1000;
              cd.l_foot.totalDrift += drift;
              cd.l_foot.lockedFrames++;
              if (drift > cd.l_foot.maxDrift) cd.l_foot.maxDrift = drift;
            }
          } else { cd.l_foot.wasLocked = false; }
          // Right foot
          if (lockR) {
            if (!cd.r_foot.wasLocked && retargetedJoints.r_ankle) {
              cd.r_foot.lockJointPos = retargetedJoints.r_ankle.slice();
              cd.r_foot.wasLocked = true;
            }
            if (cd.r_foot.lockJointPos && retargetedJoints.r_ankle) {
              const drift = vlen(vsub(retargetedJoints.r_ankle, cd.r_foot.lockJointPos)) * 1000;
              cd.r_foot.totalDrift += drift;
              cd.r_foot.lockedFrames++;
              if (drift > cd.r_foot.maxDrift) cd.r_foot.maxDrift = drift;
            }
          } else { cd.r_foot.wasLocked = false; }
          // Left hand
          if (handLockL) {
            if (!cd.l_hand.wasLocked && retargetedJoints.l_wrist) {
              cd.l_hand.lockJointPos = retargetedJoints.l_wrist.slice();
              cd.l_hand.wasLocked = true;
            }
            if (cd.l_hand.lockJointPos && retargetedJoints.l_wrist) {
              const drift = vlen(vsub(retargetedJoints.l_wrist, cd.l_hand.lockJointPos)) * 1000;
              cd.l_hand.totalDrift += drift;
              cd.l_hand.lockedFrames++;
              if (drift > cd.l_hand.maxDrift) cd.l_hand.maxDrift = drift;
            }
          } else { cd.l_hand.wasLocked = false; }
          // Right hand
          if (handLockR) {
            if (!cd.r_hand.wasLocked && retargetedJoints.r_wrist) {
              cd.r_hand.lockJointPos = retargetedJoints.r_wrist.slice();
              cd.r_hand.wasLocked = true;
            }
            if (cd.r_hand.lockJointPos && retargetedJoints.r_wrist) {
              const drift = vlen(vsub(retargetedJoints.r_wrist, cd.r_hand.lockJointPos)) * 1000;
              cd.r_hand.totalDrift += drift;
              cd.r_hand.lockedFrames++;
              if (drift > cd.r_hand.maxDrift) cd.r_hand.maxDrift = drift;
            }
          } else { cd.r_hand.wasLocked = false; }
        }

        // (g2) Per-bone twist tracking (cage-applied vs FBX-expected)
        if (retargetedTwists && fbxFrameTwists) {
          if (!_mfDiag.twistData) {
            const twistBones = ['l_uarm','r_uarm','l_farm','r_farm','l_thigh','r_thigh'];
            _mfDiag.twistData = {};
            for (const b of twistBones) {
              _mfDiag.twistData[b] = { maxTwistErr: 0, totalTwistErr: 0, count: 0, worstFrame: 0,
                frameTwistOurs: [], frameTwistFbx: [] };
            }
          }
          for (const bone of Object.keys(_mfDiag.twistData)) {
            const ours = retargetedTwists[bone];
            const fbx = fbxFrameTwists[bone];
            if (ours !== undefined && fbx !== undefined) {
              const err = Math.abs(ours - fbx);
              const td = _mfDiag.twistData[bone];
              td.totalTwistErr += err;
              td.count++;
              td.frameTwistOurs.push(ours);
              td.frameTwistFbx.push(fbx);
              if (err > td.maxTwistErr) {
                td.maxTwistErr = err;
                td.worstFrame = _mfDiag.frameCount;
              }
            }
          }
        }

        // (h) Per-frame reference-based deviation tracking
        // Measures: how far are actual vertex positions from bone-skinned reference, per region, per frame
        {
          if (!_mfDiag.perFrame) _mfDiag.perFrame = [];
          const RNAMES_PF = ['torso','l_thigh','r_thigh','l_shin','r_shin','l_foot','r_foot',
            'l_uarm','r_uarm','l_farm','r_farm','head','l_hand','r_hand','hips',
            'spine1','spine2','chest','neck','l_collar','r_collar','l_toe','r_toe'];
          // Compute bone-skinned reference for this frame
          if (!_mfDiag._refBuf) _mfDiag._refBuf = new Float32Array(nMesh * 3);
          const refOk = computeBoneSkinnedPositions(_mfDiag._refBuf);
          const frameData = { f: _mfDiag.frameCount };

          if (refOk) {
            // Per-region average and max deviation from reference
            const regionDev = {};
            for (let i = 0; i < nMesh; i++) {
              const dx = pos[i*3] - _mfDiag._refBuf[i*3];
              const dy = pos[i*3+1] - _mfDiag._refBuf[i*3+1];
              const dz = pos[i*3+2] - _mfDiag._refBuf[i*3+2];
              const err = Math.sqrt(dx*dx + dy*dy + dz*dz) * 1000; // mm
              const entries = meshVertRegions[i];
              let domRid = 0, domW = -1;
              for (let e = 0; e < entries.length; e += 2) {
                if (entries[e+1] > domW) { domRid = entries[e]; domW = entries[e+1]; }
              }
              if (!regionDev[domRid]) regionDev[domRid] = { sum: 0, count: 0, max: 0 };
              regionDev[domRid].sum += err;
              regionDev[domRid].count++;
              if (err > regionDev[domRid].max) regionDev[domRid].max = err;
            }
            // Store all regions in frameData
            for (const rid of Object.keys(regionDev).map(Number)) {
              const d = regionDev[rid];
              if (d) {
                const rn = RNAMES_PF[rid] || ('r' + rid);
                frameData[rn + '_avg'] = (d.sum / d.count);
                frameData[rn + '_max'] = d.max;
              }
            }
          }

          // Store joint angles this frame
          if (retargetedAngles && fbxFrameAngles) {
            for (const jn of ['l_ankle','r_ankle','l_knee','r_knee','l_hip','r_hip',
                               'spine_joint','spine1_joint','spine2_joint','neck']) {
              if (retargetedAngles[jn] !== null && fbxFrameAngles[jn] !== null) {
                frameData[jn + '_ours'] = retargetedAngles[jn];
                frameData[jn + '_fbx'] = fbxFrameAngles[jn];
                frameData[jn + '_err'] = Math.abs(retargetedAngles[jn] - fbxFrameAngles[jn]);
              }
            }
          }

          // Store bone directions this frame
          if (retargetedDirs && fbxFrameDirs) {
            for (const bn of ['l_shin','r_shin','l_foot','r_foot']) {
              const ours = retargetedDirs[bn], fbx = fbxFrameDirs[bn];
              if (ours && fbx) {
                frameData[bn + '_dir_err'] = Math.acos(Math.max(-1, Math.min(1, vdot(ours, fbx)))) * 180 / Math.PI;
              }
            }
          }

          // Store per-region jitter (acceleration) for foot regions this frame
          if (_mfDiag.prevPos && _mfDiag.curVel && _mfDiag.prevVel) {
            for (const footRid of [5, 6]) {
              let maxAccel = 0, sumAccel = 0, cnt = 0;
              for (let i = 0; i < nMesh; i++) {
                const entries = meshVertRegions[i];
                let domRid = 0, domW = -1;
                for (let e = 0; e < entries.length; e += 2) {
                  if (entries[e+1] > domW) { domRid = entries[e]; domW = entries[e+1]; }
                }
                if (domRid !== footRid) continue;
                const i3 = i * 3;
                const ax = _mfDiag.curVel[i3] - _mfDiag.prevVel[i3];
                const ay = _mfDiag.curVel[i3+1] - _mfDiag.prevVel[i3+1];
                const az = _mfDiag.curVel[i3+2] - _mfDiag.prevVel[i3+2];
                const a = Math.sqrt(ax*ax + ay*ay + az*az) * 1000;
                sumAccel += a; cnt++;
                if (a > maxAccel) maxAccel = a;
              }
              const rn = RNAMES_PF[footRid];
              if (cnt > 0) {
                frameData[rn + '_jitter_avg'] = sumAccel / cnt;
                frameData[rn + '_jitter_max'] = maxAccel;
              }
            }
          }

          // Store per-bone twist values for CSV
          if (retargetedTwists && fbxFrameTwists) {
            for (const bone of ['l_uarm','r_uarm','l_farm','r_farm','l_thigh','r_thigh']) {
              if (retargetedTwists[bone] !== undefined) frameData[bone + '_twist_ours'] = retargetedTwists[bone] * 180 / Math.PI;
              if (fbxFrameTwists[bone] !== undefined) frameData[bone + '_twist_fbx'] = fbxFrameTwists[bone] * 180 / Math.PI;
            }
          }

          // Store per-joint positions in mm (pelvis-relative, raw) for frame-by-frame comparison
          if (retargetedJoints && retargetedJoints.hips && jointPosData) {
            const rj2 = retargetedJoints;
            // Pelvis world position (cage)
            frameData['hips_x'] = rj2.hips[0] * 1000;
            frameData['hips_y'] = rj2.hips[1] * 1000;
            frameData['hips_z'] = rj2.hips[2] * 1000;
            // Per-joint pelvis-relative positions in mm (cage and FBX)
            for (const jn of ['l_knee','r_knee','l_ankle','r_ankle','l_wrist','r_wrist','head']) {
              if (rj2[jn] && rj2.hips) {
                const d = vsub(rj2[jn], rj2.hips);
                frameData[jn + '_cage_x'] = d[0] * 1000;
                frameData[jn + '_cage_y'] = d[1] * 1000;
                frameData[jn + '_cage_z'] = d[2] * 1000;
              }
              if (fbxFrameRelPosMM[jn]) {
                frameData[jn + '_fbx_x'] = fbxFrameRelPosMM[jn][0];
                frameData[jn + '_fbx_y'] = fbxFrameRelPosMM[jn][1];
                frameData[jn + '_fbx_z'] = fbxFrameRelPosMM[jn][2];
              }
            }
          }
          // (i) FBX ground truth vertex comparison
          if (jointPosData && jointPosData.rest_quats && retargetedJoints && retargetedJoints.hips) {
            if (!_mfDiag.fbxGTBuf) _mfDiag.fbxGTBuf = new Float32Array(nMesh * 3);
            let mfGtOk = false;
            if ($('useBoneLBS').checked && meshBoneWeights) {
              mfGtOk = computePerBoneFBXGroundTruth(_mfDiag.fbxGTBuf, time);
            }
            if (!mfGtOk) mfGtOk = computeFBXGroundTruth(_mfDiag.fbxGTBuf, time);
            if (mfGtOk) {
              // Lazy-init accumulator
              if (!_mfDiag.fbxGTData) {
                _mfDiag.fbxGTData = {};
                for (let r = 0; r <= 22; r++) _mfDiag.fbxGTData[r] = { sum: 0, count: 0, max: 0, maxVert: -1, worstFrame: 0 };
                _mfDiag.fbxGTOverall = { sum: 0, count: 0 };
                // FBX ref mesh stretch tracking
                _mfDiag.fbxRefStretch = { worstStretch: 0, totalAvgDev: 0 };
              }

              const gtBuf = _mfDiag.fbxGTBuf;
              const frame = _mfDiag.frameCount;

              // Per-vertex error grouped by dominant region
              for (let i = 0; i < nMesh; i++) {
                const dx = pos[i*3] - gtBuf[i*3];
                const dy = pos[i*3+1] - gtBuf[i*3+1];
                const dz = pos[i*3+2] - gtBuf[i*3+2];
                const err = Math.sqrt(dx*dx + dy*dy + dz*dz);

                // Dominant region
                const entries = meshVertRegions[i];
                let domRid = 0, domW = -1;
                for (let e = 0; e < entries.length; e += 2) {
                  if (entries[e+1] > domW) { domRid = entries[e]; domW = entries[e+1]; }
                }

                const rd = _mfDiag.fbxGTData[domRid];
                if (rd) {
                  rd.sum += err;
                  rd.count++;
                  if (err > rd.max) { rd.max = err; rd.maxVert = i; rd.worstFrame = frame; }
                }
                _mfDiag.fbxGTOverall.sum += err;
                _mfDiag.fbxGTOverall.count++;
              }

              // FBX ref mesh edge stretch (how much stretch is inherent to LBS)
              let fbxFrameWorstStretch = 0;
              let fbxFrameTotalDev = 0;
              for (let e = 0; e < nEdges; e++) {
                const a = edgeA[e], b = edgeB[e];
                const dx = gtBuf[b*3]-gtBuf[a*3], dy = gtBuf[b*3+1]-gtBuf[a*3+1], dz = gtBuf[b*3+2]-gtBuf[a*3+2];
                const curLen = Math.sqrt(dx*dx+dy*dy+dz*dz);
                const rest = edgeRestLen[e];
                if (rest < 1e-8) continue;
                const ratio = curLen / rest;
                fbxFrameTotalDev += Math.abs(ratio - 1.0);
                if (ratio > fbxFrameWorstStretch) fbxFrameWorstStretch = ratio;
              }
              if (fbxFrameWorstStretch > _mfDiag.fbxRefStretch.worstStretch) {
                _mfDiag.fbxRefStretch.worstStretch = fbxFrameWorstStretch;
              }
              _mfDiag.fbxRefStretch.totalAvgDev += fbxFrameTotalDev / nEdges;
            }
          }

          _mfDiag.perFrame.push(frameData);
        }

        // Dump summary after target frame count
        if (_mfDiag.frameCount >= _mfDiag.targetFrames) {
          _mfDiag.done = true;
          const m = _mfDiag;
          const RNAMES = ['torso','l_thigh','r_thigh','l_shin','r_shin','l_foot','r_foot',
            'l_uarm','r_uarm','l_farm','r_farm','head','l_hand','r_hand','hips',
            'spine1','spine2','chest','neck','l_collar','r_collar','l_toe','r_toe'];
          function vertRegionName(vi) {
            if (!meshVertRegions || !meshVertRegions[vi]) return '?';
            const e = meshVertRegions[vi]; let maxW = 0, rid = -1;
            for (let k = 0; k < e.length; k += 2) { if (e[k+1] > maxW) { maxW = e[k+1]; rid = e[k]; } }
            return RNAMES[rid] || ('r' + rid);
          }
          console.log('-- ARM ADAPTIVE FEEDBACK --');
          console.log('  L arm twist scale: ' + _armTwistScale.l.toFixed(3) + '  R arm twist scale: ' + _armTwistScale.r.toFixed(3));
          console.log('  L shoulder fade: ' + _armTorsoFade[0].toFixed(3) + '  R shoulder fade: ' + _armTorsoFade[1].toFixed(3));
          console.log('=== MULTI-FRAME DIAGNOSTIC SUMMARY (' + m.frameCount + ' frames) ===');
          const wseA = m.worstStretchEdge >= 0 ? edgeA[m.worstStretchEdge] : -1;
          const wseB = m.worstStretchEdge >= 0 ? edgeB[m.worstStretchEdge] : -1;
          let posInfo = '';
          if (m.worstStretchEdge >= 0) {
            const pa = [pos[wseA*3].toFixed(3), pos[wseA*3+1].toFixed(3), pos[wseA*3+2].toFixed(3)];
            const pb = [pos[wseB*3].toFixed(3), pos[wseB*3+1].toFixed(3), pos[wseB*3+2].toFixed(3)];
            const ra = [meshRestPos[wseA*3].toFixed(3), meshRestPos[wseA*3+1].toFixed(3), meshRestPos[wseA*3+2].toFixed(3)];
            const rb = [meshRestPos[wseB*3].toFixed(3), meshRestPos[wseB*3+1].toFixed(3), meshRestPos[wseB*3+2].toFixed(3)];
            posInfo = ' rest=[' + ra + ']vs[' + rb + '] cur=[' + pa + ']vs[' + pb + ']';
          }
          console.log('  Worst edge stretch: ' + m.worstStretch.toFixed(1) + 'x at frame ' + m.worstStretchFrame +
            (m.worstStretchEdge >= 0 ? ' (v' + wseA + '[' + vertRegionName(wseA) + '] <-> v' + wseB + '[' + vertRegionName(wseB) + '])' : '') + posInfo);
          console.log('  Avg strain per frame: ' + (m.totalAvgDev / m.frameCount * 100).toFixed(1) +
            '% | Worst frame avg: ' + (m.worstAvgDev * 100).toFixed(1) + '%');
          const jv = m.worstJitterVert;
          console.log('  Worst vertex jitter (accel): ' + (m.worstJitter * 1000).toFixed(1) + 'mm/f^2 at v' +
            jv + '[' + vertRegionName(jv) + '] frame ' + m.worstJitterFrame);
          console.log('  Avg vertex jitter (accel): ' + (m.totalAvgJitter / Math.max(1, m.frameCount - 2) * 1000).toFixed(2) + 'mm/f^2');
          const floorRef = bounds ? bounds.min[1] : 0; // rest-pose floor Y
          console.log('  L foot min Y: ' + m.lFootMinY.toFixed(4) + ' avg min Y: ' + (m.lFootTotalMinY / m.frameCount).toFixed(4));
          console.log('  R foot min Y: ' + m.rFootMinY.toFixed(4) + ' avg min Y: ' + (m.rFootTotalMinY / m.frameCount).toFixed(4));
          console.log('  Floor Y (rest): ' + floorRef.toFixed(4));
          const lPen = floorRef - m.lFootMinY, rPen = floorRef - m.rFootMinY;
          console.log('  Floor penetration: L=' + (lPen > 0.001 ? (lPen * 1000).toFixed(1) + 'mm' : 'none') +
            ' R=' + (rPen > 0.001 ? (rPen * 1000).toFixed(1) + 'mm' : 'none'));
          const lGap = m.lFootMaxMinY - floorRef, rGap = m.rFootMaxMinY - floorRef;
          console.log('  Floor gap (float): L=' + (lGap > 0.001 ? (lGap * 1000).toFixed(1) + 'mm' : 'none') +
            ' R=' + (rGap > 0.001 ? (rGap * 1000).toFixed(1) + 'mm' : 'none'));

          // (d) Bone direction comparison: ours vs FBX
          if (m.boneDirData) {
            console.log('=== BONE DIRECTION COMPARISON (ours vs FBX) ===');
            const bones = ['l_thigh','r_thigh','l_shin','r_shin','l_foot','r_foot',
                           'l_uarm','r_uarm','l_farm','r_farm','torso','head',
                           'spine','spine1','spine2','chest','l_collar','r_collar'];
            let worstBone = '', worstErr = 0;
            for (const bone of bones) {
              const d = m.boneDirData[bone];
              if (d.count === 0) continue;
              const avgErr = d.totalAngErr / d.count;
              const avgVel = d.velCount > 0 ? d.totalAngVel / d.velCount : 0;
              const avgAccel = d.accelCount > 0 ? d.totalAngAccel / d.accelCount : 0;
              const errStatus = d.maxAngErr > 15 ? 'BAD' : d.maxAngErr > 5 ? 'WARN' : 'OK';
              const velStatus = d.maxAngVel > 20 ? 'FAST' : 'OK';
              const accelStatus = d.maxAngAccel > 10 ? 'JITTERY' : d.maxAngAccel > 5 ? 'WARN' : 'SMOOTH';
              console.log('  ' + (bone + '            ').slice(0, 14) +
                'dir err: avg=' + avgErr.toFixed(1) + '° max=' + d.maxAngErr.toFixed(1) + '° (f' + d.worstFrame + ')  ' + errStatus +
                '  |  ang vel: avg=' + avgVel.toFixed(1) + ' max=' + d.maxAngVel.toFixed(1) + '°/f  ' + velStatus +
                '  |  ang accel: avg=' + avgAccel.toFixed(2) + ' max=' + d.maxAngAccel.toFixed(1) + '°/f²  ' + accelStatus);
              if (d.maxAngErr > worstErr) { worstErr = d.maxAngErr; worstBone = bone; }
            }
            console.log('  Worst direction error: ' + worstBone + ' (' + worstErr.toFixed(1) + '° max)');

            // Frame-by-frame timeline for worst bones (first 3 with errors > 5°)
            const flaggedBones = bones.filter(b => m.boneDirData[b].maxAngErr > 5).slice(0, 3);
            for (const bone of flaggedBones) {
              const d = m.boneDirData[bone];
              // Show error every 10 frames
              const timeline = [];
              for (let f = 0; f < d.frameErrors.length; f += 10) {
                timeline.push('f' + (f+1) + ':' + d.frameErrors[f].toFixed(1) + '°');
              }
              console.log('  [timeline ' + bone + '] ' + timeline.join(' '));
