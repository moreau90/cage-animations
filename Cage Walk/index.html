        const nkHdDY = headY - P.neck[1];
        const nkHdDZ = headZ - P.neck[2];
        const nkHdLen = Math.sqrt(nkHdDY * nkHdDY + nkHdDZ * nkHdDZ);
        if (nkHdLen > 0.001) {
          const dY = nkHdDY / nkHdLen;
          const dZ = nkHdDZ / nkHdLen;
          // Start far above head along neck→head direction (0.5m past head)
          const farOrigin = new THREE.Vector3(
            P.neck[0],
            headY + dY * 0.5,
            headZ + dZ * 0.5
          );
          // Ray points back toward head (reverse direction)
          const rayDir = new THREE.Vector3(0, -dY, -dZ).normalize();
          const rc = new THREE.Raycaster();
          rc.set(farOrigin, rayDir);
          const hits = rc.intersectObject(meshObj);
          if (hits.length > 0) {
            // First hit from above = crown surface
            headTopY = hits[0].point.y;
            topZ = hits[0].point.z;
            console.log('[HEAD_TOP RAYCAST] hit at Y=' + (hits[0].point.y*1000).toFixed(1) +
              'mm, Z=' + (hits[0].point.z*1000).toFixed(1) + 'mm (total hits: ' + hits.length + ')');
          }
        }
      }
      P.head_top = [P.neck[0], headTopY, topZ];

      console.log('[HEAD DERIVE] neckY=' + (P.neck[1]*1000).toFixed(1) +
        'mm, headY=' + (headY*1000).toFixed(1) +
        'mm (1.15x bareNeck), headZ=' + (headZ*1000).toFixed(1) +
        'mm (35% from back), head_topY=' + (headTopY*1000).toFixed(1) +
        'mm, head_topZ=' + (topZ*1000).toFixed(1) + 'mm');
    }

    // Derive toes
    if (P.l_ankle) {
      const floorY = bounds ? bounds.min[1] : 0;
      P.l_toe = [P.l_ankle[0], floorY, P.l_ankle[2] + 0.04];
    }
    if (P.r_ankle) {
      const floorY = bounds ? bounds.min[1] : 0;
      P.r_toe = [P.r_ankle[0], floorY, P.r_ankle[2] + 0.04];
    }

    // Knuckles: rough fallback (mesh-measured override happens in deriveMissingJoints)
    for (const s of ['l','r']) {
      const w = P[s+'_wrist'], e = P[s+'_elbow'];
      if (w && e && !P[s+'_mid_knuckle']) {
        P[s+'_mid_knuckle'] = vadd(w, vscale(vnorm(vsub(w, e)), 0.04));
      }
    }

    // Derive collars (deleted above, need fresh derivation)
    // Call deriveMissingJoints to fill in collars + any other missing joints
    deriveMissingJoints();
  }

  // Derive ALL missing joints from placed primaries + mesh geometry.
  // Called after placed_joints.json loads so P has user's placed values.
  // No FBX data used — everything comes from our mesh.
  function deriveMissingJoints(overrides) {
    const overrideSeeds = overrides && overrides.seeds;
    const overrideTraceR = overrides && overrides.traceR;
    const overrideValleys = overrides && overrides.valleys;
    const derived = [];

    // --- Spine sub-joints: straight-line lerp between pelvis and neck ---
    if (P.hips && P.neck) {
      const l3s = (a,b,t) => [a[0]+t*(b[0]-a[0]), a[1]+t*(b[1]-a[1]), a[2]+t*(b[2]-a[2])];
      if (!P.spine_joint)  { P.spine_joint  = l3s(P.hips, P.neck, 0.25); derived.push('spine_joint'); }
      if (!P.spine1_joint) { P.spine1_joint = l3s(P.hips, P.neck, 0.50); derived.push('spine1_joint'); }
      if (!P.spine2_joint) { P.spine2_joint = l3s(P.hips, P.neck, 0.75); derived.push('spine2_joint'); }
    }

    // --- Collar joints from mesh geometry ---
    // Collar Y: midpoint of the steepest width-drop step between shoulders
    //   and bare neck (the inflection point of the shoulder→neck transition).
    // Collar X: ±(bare neck width / 3) from midline (edge of neck column).
    // Collar Z: center of neck column at collar Y level.
    for (const s of ['l','r']) {
      const k = s + '_collar';
      if (!P[k] && P[s+'_shoulder']) {
        const nck = P.neck;
        const bnW = P._bareNeckW;
        const bnY = P._bareNeckY;
        const shY = P[s+'_shoulder'] ? P[s+'_shoulder'][1] : null;
        if (nck && bnW && bnY && shY != null && meshRestPos) {
          const nM = meshRestPos.length / 3;
          const meshH2 = bounds ? bounds.height : 1.0;
          const band = meshH2 * 0.008;
          const midX = (P.l_shoulder && P.r_shoulder)
            ? (P.l_shoulder[0] + P.r_shoulder[0]) / 2 : 0;

          // Scan width profile from shoulder Y to bare neck Y
          const scanStep = meshH2 * 0.005; // fine steps (~5mm)
          const collarWidths = [];
          for (let y = shY; y < bnY; y += scanStep) {
            let minX = Infinity, maxX = -Infinity, cnt = 0;
            for (let i = 0; i < nM; i++) {
              if (Math.abs(meshRestPos[i*3+1] - y) < band) {
                const vx = meshRestPos[i*3];
                if (vx < minX) minX = vx;
                if (vx > maxX) maxX = vx;
                cnt++;
              }
            }
            if (cnt > 5) collarWidths.push({ y, w: maxX - minX });
          }

          // Find steepest width drop step
          let collarY = (shY + bnY) / 2; // fallback: midpoint
          if (collarWidths.length > 2) {
            let maxDrop = 0, dropLowY = shY, dropHighY = bnY;
            for (let i = 0; i < collarWidths.length - 1; i++) {
              const drop = collarWidths[i].w - collarWidths[i + 1].w;
              if (drop > maxDrop) {
                maxDrop = drop;
                dropLowY = collarWidths[i].y;
                dropHighY = collarWidths[i + 1].y;
              }
            }
            collarY = (dropLowY + dropHighY) / 2; // midpoint of steepest drop
          }

          // Collar X: ±(bare neck width / 3) from midline
          const collarXOffset = bnW / 3;
          const sign = (s === 'l') ? -1 : 1;
          const collarX = midX + sign * collarXOffset;

          // Collar Z: center of neck column at collar Y
          let collarZ = nck[2];
          {
            const neckXRadius = bnW * 0.75;
            let mnZ = Infinity, mxZ = -Infinity, cnt = 0;
            for (let i = 0; i < nM; i++) {
              const vy = meshRestPos[i*3+1], vx = meshRestPos[i*3], vz = meshRestPos[i*3+2];
              if (Math.abs(vy - collarY) < band && Math.abs(vx - midX) < neckXRadius) {
                if (vz < mnZ) mnZ = vz;
                if (vz > mxZ) mxZ = vz;
                cnt++;
              }
            }
            if (cnt > 3) collarZ = (mnZ + mxZ) / 2;
          }

          P[k] = [collarX, collarY, collarZ];
          derived.push(k);
          console.log('[COLLAR ' + s + '] Y=' + (collarY*1000).toFixed(1) +
            'mm (midpoint of steepest width drop), X=' + (collarX*1000).toFixed(1) +
            'mm (bareNeckW/3=' + (collarXOffset*1000).toFixed(1) +
            'mm), Z=' + (collarZ*1000).toFixed(1) + 'mm');
        }
      }
    }

    // --- Finger joints from mesh geometry ---
    // Always re-derive fingers from mesh (don't use stale saved positions)
    for (const s of ['l','r']) {
      const pr = s + '_';
      const wrist = P[pr+'wrist'], elbow = P[pr+'elbow'];
      if (!wrist || !elbow) continue;

      const armDir = vnorm(vsub(wrist, elbow));
      const armLen = vlen(vsub(wrist, elbow));
      const nM = meshRestPos ? meshRestPos.length / 3 : 0;

      // --- Step 1: Measure knuckle ridge from mesh (widest cross-section past wrist) ---
      // Build spread reference: cross(armDir, [0,-1,0]) gives consistent
      // anterior-pointing spread for T-pose arms (index toward +Z, pinky toward -Z).
      let spread = vcross(armDir, [0, -1, 0]);
      if (vlen(spread) < 0.1) spread = vcross(armDir, [0, 0, 1]);
      spread = vnorm(spread);
      // palmN = dorsal direction (back of hand, upward for palm-down T-pose)
      // cross(armDir, spread) gives consistent upward/dorsal for both hands
      let palmN = vnorm(vcross(armDir, spread));

      // --- Step 1: Scan along arm axis from wrist to find hand metrics ---
      // Strategy: measure total hand extent from mesh, then find widest cross-section
      // in the [30%-65%] range. That's the MCP (knuckle) ridge.
      let knuckleAlong = armLen * 0.55; // fallback
      let maxWidth = 0, fingerTipAlong = armLen * 0.9;
      let handWidth = armLen * 0.15;

      if (nM > 0) {
        // First pass: measure total hand length from wrist (farthest mesh vert along armDir)
        let maxAlong = 0;
        for (let i = 0; i < nM; i++) {
          const dx = meshRestPos[i*3]-wrist[0], dy = meshRestPos[i*3+1]-wrist[1], dz = meshRestPos[i*3+2]-wrist[2];
          const al = dx*armDir[0]+dy*armDir[1]+dz*armDir[2];
          if (al < 0) continue; // behind wrist
          const perpSq = dx*dx+dy*dy+dz*dz - al*al;
          if (perpSq > armLen*armLen*0.25) continue; // too far from arm axis
          if (al > maxAlong) maxAlong = al;
        }
        const totalHandLen = maxAlong;
        fingerTipAlong = totalHandLen;

        // Second pass: scan cross-sections, find widest in [30%, 65%] of hand → MCP ridge
        const nSteps = 40;
        const bandHalf = totalHandLen * 0.025;
        let bestWidth = 0, bestAlong = totalHandLen * 0.5;

        for (let si = 0; si < nSteps; si++) {
          const along = totalHandLen * si / (nSteps - 1);
          const cx = wrist[0]+armDir[0]*along, cy = wrist[1]+armDir[1]*along, cz = wrist[2]+armDir[2]*along;

          let minLat = Infinity, maxLat = -Infinity, count = 0;
          for (let i = 0; i < nM; i++) {
            const dx = meshRestPos[i*3]-cx, dy = meshRestPos[i*3+1]-cy, dz = meshRestPos[i*3+2]-cz;
            const a = dx*armDir[0]+dy*armDir[1]+dz*armDir[2];
            if (Math.abs(a) > bandHalf) continue;
            const perpSq = dx*dx+dy*dy+dz*dz - a*a;
            if (perpSq > totalHandLen*totalHandLen*0.16) continue;
            const lat = dx*spread[0]+dy*spread[1]+dz*spread[2];
            if (lat < minLat) minLat = lat;
            if (lat > maxLat) maxLat = lat;
            count++;
          }
          if (count > 5) {
            const w = maxLat - minLat;
            if (w > maxWidth) maxWidth = w;
            // Find widest in [40%, 60%] of hand length (MCP knuckle ridge)
            const frac = along / totalHandLen;
            if (frac >= 0.40 && frac <= 0.60 && w > bestWidth) {
              bestWidth = w;
              bestAlong = along;
            }
          }
        }
        knuckleAlong = bestAlong;
        handWidth = maxWidth;

        console.log('[KNUCKLE ' + s + '] totalHand=' + (totalHandLen*1000).toFixed(1) +
          'mm, MCP at ' + (knuckleAlong*1000).toFixed(1) +
          'mm (' + (knuckleAlong/totalHandLen*100).toFixed(0) + '%), tipAt=' +
          (fingerTipAlong*1000).toFixed(1) + 'mm, handW=' + (maxWidth*1000).toFixed(1) + 'mm');
      }

      // --- Step 2: Place knuckle and compute hand metrics ---
      const knuckle = vadd(wrist, vscale(armDir, knuckleAlong));
      P[pr+'mid_knuckle'] = knuckle; // override rough fallback
      const handDir = armDir;
      const handLen = knuckleAlong;
      const fingerLen = Math.max(fingerTipAlong - knuckleAlong, handLen * 0.15);

      // --- RAW MESH FINGERTIP DIAGNOSTIC (no seeds, no detection) ---
      // Max-distance profile: for each Z bin, find max distance from wrist.
      // Peaks in this profile = finger center Z positions.
      if (nM > 0) {
        // Z range of the hand (excluding thumb): find min/max Z of hand verts
        let handZMin = Infinity, handZMax = -Infinity;
        for (let i = 0; i < nM; i++) {
          const vx = meshRestPos[i*3], vy = meshRestPos[i*3+1], vz = meshRestPos[i*3+2];
          const dx = vx-wrist[0], dy = vy-wrist[1], dz = vz-wrist[2];
          const al = dx*armDir[0]+dy*armDir[1]+dz*armDir[2];
          if (al < knuckleAlong * 0.3) continue;
          const perpSq = dx*dx+dy*dy+dz*dz - al*al;
          if (perpSq > armLen*armLen*0.2) continue;
          if (vz < handZMin) handZMin = vz;
          if (vz > handZMax) handZMax = vz;
        }
        // Create Z bins (2mm each) and find max armDir distance in each
        const binW = 0.002; // 2mm bins
        const nBins = Math.ceil((handZMax - handZMin) / binW) + 1;
        const binMaxDist = new Float32Array(nBins); // max distance per bin
        const binCount = new Int32Array(nBins);
        for (let i = 0; i < nM; i++) {
          const vx = meshRestPos[i*3], vy = meshRestPos[i*3+1], vz = meshRestPos[i*3+2];
          const dx = vx-wrist[0], dy = vy-wrist[1], dz = vz-wrist[2];
          const al = dx*armDir[0]+dy*armDir[1]+dz*armDir[2];
          if (al < knuckleAlong * 0.3) continue;
          const perpSq = dx*dx+dy*dy+dz*dz - al*al;
          if (perpSq > armLen*armLen*0.2) continue;
          const bi = Math.min(nBins-1, Math.floor((vz - handZMin) / binW));
          if (al > binMaxDist[bi]) binMaxDist[bi] = al;
          binCount[bi]++;
        }
        // Log the profile (only bins with count > 0, every other bin to keep output manageable)
        let profile = '';
        for (let bi = 0; bi < nBins; bi++) {
          if (binCount[bi] < 2) continue;
          const z = handZMin + (bi + 0.5) * binW;
          profile += (z*1000).toFixed(0) + ':' + (binMaxDist[bi]*1000).toFixed(0) + ' ';
        }
        console.log('[RAW ZPROFILE ' + s + '] Z(mm):maxDist(mm) = ' + profile.trim());

        // Find peaks: bins where maxDist is a local max (higher than neighbors by >2mm)
        const peaks = [];
        for (let bi = 2; bi < nBins - 2; bi++) {
          if (binCount[bi] < 2) continue;
          const d = binMaxDist[bi];
          // Check it's higher than neighbors within ±4 bins
          let isPeak = true;
          for (let k = -2; k <= 2; k++) {
            if (k === 0) continue;
            const ni = bi + k;
            if (ni >= 0 && ni < nBins && binMaxDist[ni] > d) { isPeak = false; break; }
          }
          if (isPeak && d > knuckleAlong) {
            const z = handZMin + (bi + 0.5) * binW;
            peaks.push({ z: z, dist: d, bin: bi });
          }
        }
        // Merge peaks within 5mm
        const merged = [];
        for (const p of peaks) {
          if (merged.length > 0 && Math.abs(p.z - merged[merged.length-1].z) < 0.005) {
            if (p.dist > merged[merged.length-1].dist) merged[merged.length-1] = p;
          } else {
            merged.push(p);
          }
        }
        console.log('[RAW PEAKS ' + s + '] ' + merged.length + ' finger peaks: ' +
          merged.map(p => 'Z=' + (p.z*1000).toFixed(1) + 'mm dist=' + (p.dist*1000).toFixed(1) + 'mm').join(', '));
      }

      // --- Step 3: Detect thumb side ---
      // Thumb is ALWAYS on the anterior side (+Z). Spread direction is deterministic:
      // left hand: spread ≈ +Z, right hand: spread ≈ -Z.
      // So: if spread points +Z, thumb is toward +spread (ts=+1).
      //     if spread points -Z, thumb is toward -spread (ts=-1).
      const thumbSpreadSign = spread[2] > 0 ? 1 : -1;
      console.log('[THUMB DETECT ' + s + '] thumbSign=' + thumbSpreadSign +
        ' (from spread Z=' + spread[2].toFixed(3) + ') spread=[' +
        spread.map(v=>v.toFixed(3)).join(',') + ']');

      // --- Step 4: Detect finger positions from Z-profile peaks, then trace each ---
      const ts = thumbSpreadSign;
      const fingerR = handWidth / 10;
      const fsp = handWidth / 5;

      const handSign = Math.sign(armDir[0]); // -1 left hand (-X), +1 right hand (+X)
      const knuckleX = knuckle[0];
      const knuckleY = knuckle[1];
      const knuckleZ = knuckle[2];

      const fingerNames = ['index', 'middle', 'ring', 'pinky'];
      const fingerLens = [];

      // --- Z-profile peak detection: find finger centers from max-distance profile ---
      // For each Z bin, find how far the mesh reaches from wrist (max armDir dist).
      // Peaks = finger centers. Valleys between peaks = inter-finger boundaries.
      const profileBinW = 0.002; // 2mm bins
      let profileZMin = Infinity, profileZMax = -Infinity;
      // First pass: find Z range of hand verts past knuckle
      for (let i = 0; i < nM; i++) {
        const vx = meshRestPos[i*3], vy = meshRestPos[i*3+1], vz = meshRestPos[i*3+2];
        const dx = vx-wrist[0], dy = vy-wrist[1], dz = vz-wrist[2];
        const al = dx*armDir[0]+dy*armDir[1]+dz*armDir[2];
        if (al < knuckleAlong * 0.3) continue;
        const perpSq = dx*dx+dy*dy+dz*dz - al*al;
        if (perpSq > armLen*armLen*0.2) continue;
        if (vz < profileZMin) profileZMin = vz;
        if (vz > profileZMax) profileZMax = vz;
      }
      const profileNBins = Math.ceil((profileZMax - profileZMin) / profileBinW) + 1;
      const profileMaxDist = new Float32Array(profileNBins);
      const profileBinCnt = new Int32Array(profileNBins);
      for (let i = 0; i < nM; i++) {
        const vx = meshRestPos[i*3], vy = meshRestPos[i*3+1], vz = meshRestPos[i*3+2];
        const dx = vx-wrist[0], dy = vy-wrist[1], dz = vz-wrist[2];
        const al = dx*armDir[0]+dy*armDir[1]+dz*armDir[2];
        if (al < knuckleAlong * 0.3) continue;
        const perpSq = dx*dx+dy*dy+dz*dz - al*al;
        if (perpSq > armLen*armLen*0.2) continue;
        const bi = Math.min(profileNBins-1, Math.floor((vz - profileZMin) / profileBinW));
        if (al > profileMaxDist[bi]) profileMaxDist[bi] = al;
        profileBinCnt[bi]++;
      }

      // Smooth the profile (5-bin moving average) to reduce noise
      const profileSmooth = new Float32Array(profileNBins);
      for (let bi = 0; bi < profileNBins; bi++) {
        let sum = 0, cnt = 0;
        for (let k = -2; k <= 2; k++) {
          const ni = bi + k;
          if (ni >= 0 && ni < profileNBins && profileBinCnt[ni] >= 2) {
            sum += profileMaxDist[ni]; cnt++;
          }
        }
        profileSmooth[bi] = cnt > 0 ? sum / cnt : 0;
      }

      // Find peaks from RAW (unsmoothed) profile — smoothing kills the weak pinky peak.
      // A peak = bin whose raw maxDist > both neighbors within ±3 bins.
      const rawPeaks = [];
      for (let bi = 3; bi < profileNBins - 3; bi++) {
        if (profileBinCnt[bi] < 2) continue;
        const d = profileMaxDist[bi];
        if (d <= knuckleAlong) continue;
        let isPeak = true;
        for (let k = -3; k <= 3; k++) {
          if (k === 0) continue;
          const ni = bi + k;
          if (ni >= 0 && ni < profileNBins && profileMaxDist[ni] > d) { isPeak = false; break; }
        }
        if (isPeak) {
          rawPeaks.push({ z: profileZMin + (bi + 0.5) * profileBinW, dist: d, bin: bi });
        }
      }
      // Merge peaks within 10mm
      const fingerPeaks = [];
      for (const p of rawPeaks) {
        if (fingerPeaks.length > 0 && Math.abs(p.z - fingerPeaks[fingerPeaks.length-1].z) < 0.010) {
          if (p.dist > fingerPeaks[fingerPeaks.length-1].dist) fingerPeaks[fingerPeaks.length-1] = p;
        } else {
          fingerPeaks.push(p);
        }
      }

      // Separate thumb from fingers by pure T-pose ordering.
      // In T-pose, digits are always spatially ordered: thumb at one end,
      // pinky at the other. The thumb direction in world Z is ts * spread[2],
      // which accounts for the spread vector flipping between L/R hands.
      fingerPeaks.sort((a, b) => b.z - a.z); // most positive Z first
      // ts * spread[2] gives the actual world-Z direction toward thumb.
      // Positive → thumb at most positive Z (index 0).
      // Negative → thumb at most negative Z (last index).
      const thumbWorldZDir = ts * spread[2];
      const thumbIdx = thumbWorldZDir > 0 ? 0 : fingerPeaks.length - 1;
      const nonThumbPeaks = fingerPeaks.filter((_, i) => i !== thumbIdx);
      // Sort remaining by Z: index (most positive) to pinky (most negative)
      nonThumbPeaks.sort((a, b) => b.z - a.z);

      // Take exactly 4 peaks for the 4 fingers
      let seedWorldZ;
      if (overrideSeeds && overrideSeeds[s]) {
        // Use pre-computed seeds (e.g., first-pass seeds + splay offsets)
        seedWorldZ = overrideSeeds[s];
        console.log('[ZPROFILE SEEDS ' + s + '] USING OVERRIDE seeds=[' +
          seedWorldZ.map(z => (z*1000).toFixed(1)).join(',') + ']mm');
      } else if (nonThumbPeaks.length >= 4) {
        seedWorldZ = nonThumbPeaks.slice(0, 4).map(p => p.z);
      } else if (nonThumbPeaks.length === 3) {
        // Missing one peak (likely pinky merged with ring). Extrapolate.
        const gap01 = nonThumbPeaks[0].z - nonThumbPeaks[1].z;
        const gap12 = nonThumbPeaks[1].z - nonThumbPeaks[2].z;
        const avgGap = (gap01 + gap12) / 2;
        seedWorldZ = [nonThumbPeaks[0].z, nonThumbPeaks[1].z, nonThumbPeaks[2].z,
                       nonThumbPeaks[2].z - avgGap];
      } else {
        // Fallback: even spacing
        const mid = (profileZMin + profileZMax) / 2;
        const sp = handWidth / 5;
        seedWorldZ = [mid + 1.5*sp, mid + 0.5*sp, mid - 0.5*sp, mid - 1.5*sp];
      }

      console.log('[ZPROFILE SEEDS ' + s + '] allPeaks=' + fingerPeaks.length +
        ':[' + fingerPeaks.map(p=>(p.z*1000).toFixed(1)+'@'+(p.dist*1000).toFixed(0)).join(',') +
        '] nonThumb=' + nonThumbPeaks.length +
        ' fingerZ=[' + seedWorldZ.map(z=>(z*1000).toFixed(1)).join(',') + ']mm');

      console.log('[FINGER SEEDS ' + s + '] tipZ=[' + seedWorldZ.map(z=>(z*1000).toFixed(1)).join(',') + ']mm');

      // --- Valley boundaries: find minima between adjacent finger peaks ---
      const valleyZ = []; // 3 boundaries: index-middle, middle-ring, ring-pinky
      for (let vi = 0; vi < 3; vi++) {
        const z0 = seedWorldZ[vi], z1 = seedWorldZ[vi+1];
        const bi0 = Math.floor((Math.min(z0,z1) - profileZMin) / profileBinW);
        const bi1 = Math.ceil((Math.max(z0,z1) - profileZMin) / profileBinW);
        let minDist = Infinity, minZ = (z0+z1)/2;
        for (let bi = bi0; bi <= bi1 && bi < profileNBins; bi++) {
          if (bi < 0) continue;
          if (profileSmooth[bi] < minDist) {
            minDist = profileSmooth[bi];
            minZ = profileZMin + (bi + 0.5) * profileBinW;
          }
        }
        valleyZ.push(minZ);
      }

      // Compute traceR from finger spacing (or use override from first pass)
      let traceR;
      if (overrideTraceR && overrideTraceR[s] !== undefined) {
        traceR = overrideTraceR[s];
      } else {
        let minGapBetween = Infinity;
        for (let i = 1; i < seedWorldZ.length; i++) {
          const g = Math.abs(seedWorldZ[i] - seedWorldZ[i-1]);
          if (g < minGapBetween) minGapBetween = g;
        }
        traceR = Math.max(minGapBetween * 0.3, 0.004);
      }

      // Override valleys if provided (first-pass valleys + splay offsets)
      if (overrideValleys && overrideValleys[s]) {
        valleyZ.length = 0;
        overrideValleys[s].forEach(v => valleyZ.push(v));
      }

      // Save valley data for splayFingers() — 3 inter-finger valleys + 4 seed centers
      P['_' + s + '_valleyZ'] = valleyZ.slice();
      P['_' + s + '_seedWorldZ'] = seedWorldZ.slice();
      P['_' + s + '_traceR'] = traceR;

      console.log('[FINGERS ' + s + '] seedZ=[' + seedWorldZ.map(z=>(z*1000).toFixed(1)).join(',') +
        ']mm valleyZ=[' + valleyZ.map(z=>(z*1000).toFixed(1)).join(',') +
        ']mm traceR=' + (traceR*1000).toFixed(1) + 'mm');

      // --- Knuckle Z: trace gaps between fingers from tip toward knuckle ---
      // For each inter-finger pair, scan X slabs from tip toward hand.
      // At each level, find the gap in Z between the two finger clusters.
      // Track the gap Z as it moves. When the gap closes (fingers merge
      // into palm), record the last-known gap Z = boundary at the crotch.
      // Then each finger center = midpoint between its two crotch boundaries.

      // Pre-collect all hand verts (filtered by Y and thumb exclusion)
      const handVerts = []; // [{x, y, z}]
      for (let i = 0; i < nM; i++) {
        const vx = meshRestPos[i*3], vy = meshRestPos[i*3+1], vz = meshRestPos[i*3+2];
        if (Math.abs(vy - knuckleY) > 0.025) continue;
        const lat = (vx-wrist[0])*spread[0]+(vy-wrist[1])*spread[1]+(vz-wrist[2])*spread[2];
        if (ts * lat > handWidth * 0.30) continue;
        if (ts * lat < -handWidth * 0.55) continue;
        handVerts.push({x: vx, y: vy, z: vz});
      }

      // Scan for each of the 3 inter-finger gaps
      const crotchZ = []; // 3 boundary Z values at the crotch level
      const crotchX = []; // X position where each gap closed
      for (let pi = 0; pi < 3; pi++) {
        const zA = seedWorldZ[pi], zB = seedWorldZ[pi+1];
        const zMid = (zA + zB) / 2;
        const zRange = Math.abs(zB - zA);
        const zLo = Math.min(zA, zB) - zRange * 0.2;
        const zHi = Math.max(zA, zB) + zRange * 0.2;

        let lastGapZ = zMid; // fallback: midpoint of seeds
        let lastGapX = knuckleX + fingerLen * 0.80 * handSign;
        let gapEverFound = false;
        let closedRun = 0; // consecutive steps with no gap
        const slabHalf = 0.008; // ±8mm X slab

        // Scan from 80% of fingerLen toward 0% (knuckle)
        for (let pct = 0.80; pct >= 0.02; pct -= 0.004 / fingerLen) {
          const scanX = knuckleX + pct * fingerLen * handSign;

          // Build Z histogram (1mm bins for finer resolution)
          const binW = 0.001;
          const nBins = Math.ceil((zHi - zLo) / binW) + 1;
          const bins = new Int32Array(nBins);
          let slabCount = 0;
          for (const v of handVerts) {
            if (Math.abs(v.x - scanX) > slabHalf) continue;
            if (v.z < zLo || v.z > zHi) continue;
            const bi = Math.floor((v.z - zLo) / binW);
            if (bi >= 0 && bi < nBins) bins[bi]++;
            slabCount++;
          }
          if (slabCount < 3) continue;

          // Search between the two seed Z for empty bins
          const sBi0 = Math.max(0, Math.floor((Math.min(zA,zB) - zLo) / binW));
          const sBi1 = Math.min(nBins - 1, Math.ceil((Math.max(zA,zB) - zLo) / binW));

          // Find longest empty run between the seeds
          let bestRunStart = -1, bestRunLen = 0;
          let curRunStart = -1, curRunLen = 0;
          for (let bi = sBi0; bi <= sBi1; bi++) {
            if (bins[bi] === 0) {
              if (curRunStart < 0) curRunStart = bi;
              curRunLen++;
              if (curRunLen > bestRunLen) { bestRunLen = curRunLen; bestRunStart = curRunStart; }
            } else {
              curRunStart = -1; curRunLen = 0;
            }
          }

          if (bestRunLen >= 2) {
            // Clear gap: ≥2 consecutive empty 1mm bins (≥2mm physical gap)
            lastGapZ = zLo + (bestRunStart + bestRunLen / 2) * binW;
            lastGapX = scanX;
            gapEverFound = true;
            closedRun = 0;

          } else {
            closedRun++;
            // Require 3 consecutive "no gap" steps to confirm closure
            if (gapEverFound && closedRun >= 3) break;
          }
        }
        crotchZ.push(lastGapZ);
        crotchX.push(lastGapX);
      }

      // Get hand Z edges for outer finger boundaries
      // When using override seeds (second pass with splay), scan at 50% where splay is active.
      // Otherwise scan at 15% near knuckle level.
      let knZMin = Infinity, knZMax = -Infinity;
      const edgePct = (overrideSeeds && overrideSeeds[s]) ? 0.50 : 0.15;
      const edgeX = knuckleX + fingerLen * edgePct * handSign;
      for (const v of handVerts) {
        if (Math.abs(v.x - edgeX) > 0.015) continue;
        if (v.z < knZMin) knZMin = v.z;
        if (v.z > knZMax) knZMax = v.z;
      }

      // Each finger's knuckle Z = center between its two crotch boundaries.
      const knuckleFingerZ = [];
      for (let fi = 0; fi < 4; fi++) {
        let loEdge, hiEdge;
        if (fi === 0) {
          hiEdge = knZMax;         // hand outer edge (index side)
          loEdge = crotchZ[0];     // index-middle crotch
        } else if (fi === 3) {
          hiEdge = crotchZ[2];     // ring-pinky crotch
          loEdge = knZMin;         // hand outer edge (pinky side)
        } else {
          hiEdge = crotchZ[fi-1];  // gap on the index side
          loEdge = crotchZ[fi];    // gap on the pinky side
        }
        knuckleFingerZ.push((loEdge + hiEdge) / 2);
      }

      // Save crotch data for splayFingers()
      P['_' + s + '_crotchZ'] = crotchZ.slice();
      P['_' + s + '_crotchX'] = crotchX.slice();
      P['_' + s + '_knZMin'] = knZMin;
      P['_' + s + '_knZMax'] = knZMax;

      console.log('[KNUCKLE GAPS ' + s + '] crotchZ=[' +
        crotchZ.map(z=>(z*1000).toFixed(1)).join(',') +
        ']mm crotchDist=[' +
        crotchX.map(cx => ((Math.abs(cx - knuckleX) / fingerLen) * 100).toFixed(0) + '%').join(',') +
        '] edges=[' + (knZMax*1000).toFixed(1) + ',' + (knZMin*1000).toFixed(1) +
        ']mm knuckleZ=[' + knuckleFingerZ.map(z=>(z*1000).toFixed(1)).join(',') +
        ']mm seedZ=[' + seedWorldZ.map(z=>(z*1000).toFixed(1)).join(',') + ']mm');

      // Equal-territory model: at the knuckle level, finger positions are
      // more evenly distributed across the palm than at the tip (where they
      // splay outward). Divide the hand width into 4 equal territories.
      const handSpan = knZMax - knZMin;
      const equalTerritoryZ = [];
      for (let fi = 0; fi < 4; fi++) {
        // fi=0 = index (near knZMax), fi=3 = pinky (near knZMin)
        equalTerritoryZ.push(knZMax - (fi + 0.5) * handSpan / 4);
      }

      // Blend weight per finger: how much to trust equalTerritoryZ vs march.
      // Based on average crotch depth of the finger's two boundaries.
      // Deep crotch = short isolated tube = less reliable march Z data
      // = more reliance on the equal-territory model.
      const crotchBlendWeight = [];
      for (let fi = 0; fi < 4; fi++) {
        let depthA, depthB; // crotch depth as fraction of fingerLen (0=knuckle, 1=tip)
        if (fi === 0) {
          depthA = 0; // hand edge is always defined at knuckle level
          depthB = Math.abs(crotchX[0] - knuckleX) / fingerLen;
        } else if (fi === 3) {
          depthA = Math.abs(crotchX[2] - knuckleX) / fingerLen;
          depthB = 0;
        } else {
          depthA = Math.abs(crotchX[fi-1] - knuckleX) / fingerLen;
          depthB = Math.abs(crotchX[fi] - knuckleX) / fingerLen;
        }
        crotchBlendWeight.push(Math.min(1.0, (depthA + depthB) / 2));
      }

      console.log('[KNUCKLE BLEND ' + s + '] equalZ=[' +
        equalTerritoryZ.map(z=>(z*1000).toFixed(1)).join(',') +
        ']mm blendW=[' + crotchBlendWeight.map(w=>w.toFixed(2)).join(',') + ']');

      // Anatomy-based expected finger lengths (ratio of middle finger)
      const fingerRatios = [0.85, 1.0, 0.92, 0.72]; // index, middle, ring, pinky

      // Save original peak-detected seeds before correction (used for palm-region Z lock)
      const originalSeedZ = seedWorldZ.slice();

      // === Correct seed Z: iterative mean-shift to find true finger center ===
      // Z-profile peaks land at the finger's OUTER EDGE, not center. Use a narrow
      // fixed-width window (±fingerHalfWidth) and scan at 55-85% of each finger's
      // length where fingers are isolated tubes. Two-pass refinement shifts the
      // window toward the actual center even if the seed starts at the edge.
      // No dependency on crotch Z boundaries → symmetric between hands.
      for (let fi = 0; fi < 4; fi++) {
        const fExpLen = fingerLen * fingerRatios[fi];
        const halfW = traceR * 1.5; // ~7mm half-width ≈ finger diameter
        let curZ = seedWorldZ[fi];

        // Clamp Z window by crotch boundaries to prevent neighbor contamination.
        // Without this, the iterative mean-shift drifts toward neighbors
        // (especially pinky → ring where the scan is below the crotch level).
        // For outer fingers (index/pinky) with override seeds: don't clamp by hand edge
        // because splay may have shifted the tube past the measured edge.
        const hasOverride = overrideSeeds && overrideSeeds[s];
        const zClampLo = fi === 3 ? (hasOverride ? curZ - halfW * 2 : knZMin) : crotchZ[fi];
        const zClampHi = fi === 0 ? (hasOverride ? curZ + halfW * 2 : knZMax) : crotchZ[fi - 1];

        for (let pass = 0; pass < 2; pass++) {
          let sumCenter = 0, nLevels = 0;
          for (let pct = 0.55; pct <= 0.85; pct += 0.015) {
            const scanX = knuckleX + pct * fExpLen * handSign;
            const wLo = Math.max(curZ - halfW, zClampLo);
            const wHi = Math.min(curZ + halfW, zClampHi);
            let fZMin = Infinity, fZMax = -Infinity, nv = 0;
            for (const v of handVerts) {
              if (Math.abs(v.x - scanX) > 0.010) continue;
              if (v.z < wLo || v.z > wHi) continue;
              if (v.z < fZMin) fZMin = v.z;
              if (v.z > fZMax) fZMax = v.z;
              nv++;
            }
            if (nv >= 3) {
              sumCenter += (fZMin + fZMax) / 2;
              nLevels++;
            }
          }
          if (nLevels >= 2) curZ = sumCenter / nLevels;
        }

        if (Math.abs(curZ - seedWorldZ[fi]) > 0.0005) {
          console.log('[SEED CORRECT ' + s + ' ' + fingerNames[fi] + '] old=' +
            (seedWorldZ[fi]*1000).toFixed(1) + ' new=' + (curZ*1000).toFixed(1) +
            ' delta=' + ((curZ - seedWorldZ[fi])*1000).toFixed(1) + 'mm');
          seedWorldZ[fi] = curZ;
        }
      }

      // Re-save corrected seeds (correction step above may have shifted them)
      P['_' + s + '_seedWorldZ'] = seedWorldZ.slice();

      // === Build per-finger vert sets (isolated finger tubes) ===
      // Past each crotch X, the fingers are physically separated tubes.
      // Assign mesh verts to individual fingers using crotch boundaries.
      // This prevents any cross-finger contamination in tip detection.
      const fingerVerts = [[], [], [], []]; // index [fi] = [{x,y,z,idx}]
      for (let fi = 0; fi < 4; fi++) {
        // Z boundaries: seed midpoint with adjacent fingers (or hand edges)
        const zLo = fi < 3 ? (seedWorldZ[fi] + seedWorldZ[fi + 1]) / 2 : knZMin;
        const zHi = fi > 0 ? (seedWorldZ[fi] + seedWorldZ[fi - 1]) / 2 : knZMax;
        // X boundary: past the deepest crotch of the two adjacent boundaries
        let minCrotchDist = 0;
        if (fi > 0) minCrotchDist = Math.max(minCrotchDist,
          Math.abs(crotchX[fi - 1] - knuckleX));
        if (fi < 3) minCrotchDist = Math.max(minCrotchDist,
          Math.abs(crotchX[fi] - knuckleX));
        for (let i = 0; i < nM; i++) {
          const vx = meshRestPos[i * 3], vy = meshRestPos[i * 3 + 1],
                vz = meshRestPos[i * 3 + 2];
          if (vz < zLo || vz > zHi) continue;
          if (Math.abs(vy - knuckleY) > 0.025) continue;
          const dx = (vx - knuckleX) * handSign;
          if (dx < minCrotchDist) continue; // must be past crotch
          fingerVerts[fi].push({x: vx, y: vy, z: vz, idx: i});
        }
      }
      console.log('[FINGER VERTS ' + s + '] ' +
        fingerNames.map((n, fi) => n + '=' + fingerVerts[fi].length).join(' '));

      // Cross-section helper (from cage-core)
      const sliceMeshAtX = CageCore.sliceMeshAtX;

      // Pre-filter triangles in hand region for sliceMeshAtX
      const handTris = [];
      if (meshGeo && meshGeo.index) {
        const triIdx = meshGeo.index.array;
        const nTri = triIdx.length / 3;
        const handSpanZ = knZMax - knZMin;
        const handZLo = knZMin - handSpanZ * 0.15;
        const handZHi = knZMax + handSpanZ * 0.15;
        for (let t = 0; t < nTri; t++) {
          const ai = triIdx[t*3], bi = triIdx[t*3+1], ci = triIdx[t*3+2];
          const a3 = ai*3, b3 = bi*3, c3 = ci*3;
          const ax = meshRestPos[a3], bx = meshRestPos[b3], cx = meshRestPos[c3];
          const ay = meshRestPos[a3+1], by = meshRestPos[b3+1], cy = meshRestPos[c3+1];
          const az = meshRestPos[a3+2], bz = meshRestPos[b3+2], cz = meshRestPos[c3+2];
          // At least one vert past knuckleX in finger direction
          const dxa = (ax - knuckleX) * handSign;
          const dxb = (bx - knuckleX) * handSign;
          const dxc = (cx - knuckleX) * handSign;
          if (dxa < -0.005 && dxb < -0.005 && dxc < -0.005) continue;
          // At least one vert within Y range of hand
          if (Math.abs(ay - knuckleY) > 0.040 &&
              Math.abs(by - knuckleY) > 0.040 &&
              Math.abs(cy - knuckleY) > 0.040) continue;
          // At least one vert within Z range of hand
          const zMin3 = Math.min(az, bz, cz), zMax3 = Math.max(az, bz, cz);
          if (zMax3 < handZLo || zMin3 > handZHi) continue;
          handTris.push({a3, b3, c3});
        }
      }
      console.log('[HAND TRIS ' + s + '] ' + handTris.length + ' triangles in hand region');

      // === Detect finger separation via cross-section gap scan ===
      // For each inter-finger boundary, scan X outward from knuckleX in 2mm
      // steps. At each X, take an exact cross-section and count intersection
      // points within ±3mm Z of the boundary (using crotchZ for accurate
      // boundary positions). Separation X = first X where count drops to 0.
      // Falls back to crotchX if cross-section scan doesn't find the gap.
      const gapSepDist = [0, 0, 0]; // 3 inter-finger boundaries
      for (let bi = 0; bi < 3; bi++) {
        const boundaryZ = crotchZ[bi]; // use crotchZ for accurate boundary
        const scanStep = 0.002; // 2mm
        const maxScan = fingerLen * 0.6;
        let found = false;
        for (let d = 0; d <= maxScan; d += scanStep) {
          const xPos = knuckleX + d * handSign;
          const pts = sliceMeshAtX(xPos, handTris, meshRestPos);
          let nearCount = 0;
          for (let pi = 0; pi < pts.length; pi++) {
            if (Math.abs(pts[pi].z - boundaryZ) <= 0.003 &&
                Math.abs(pts[pi].y - knuckleY) <= 0.035) nearCount++;
          }
          if (nearCount === 0 && d > scanStep * 2) {
            gapSepDist[bi] = d;
            found = true;
            break;
          }
        }
        // Fallback: use already-computed crotchX distance
        if (!found) {
          gapSepDist[bi] = Math.abs(crotchX[bi] - knuckleX);
        }
      }
      console.log('[GAP SCAN ' + s + '] idx-mid=' + (gapSepDist[0]*1000).toFixed(1) +
        'mm mid-ring=' + (gapSepDist[1]*1000).toFixed(1) +
        'mm ring-pinky=' + (gapSepDist[2]*1000).toFixed(1) + 'mm');

      // Per-finger start distance from knuckleX.
      // Cap at 25% of each finger's expected length — gap detection for
      // closely spaced fingers (ring-pinky) returns unreasonably deep values
      // because the Z gap never fully opens, not because of actual webbing.
      const fingerStartDist = [];
      for (let fi = 0; fi < 4; fi++) {
        const maxStart = fingerLen * fingerRatios[fi] * 0.25;
        let raw;
        if (fi === 0) raw = gapSepDist[0];
        else if (fi === 1) raw = Math.max(gapSepDist[0], gapSepDist[1]);
        else if (fi === 2) raw = Math.max(gapSepDist[1], gapSepDist[2]);
        else raw = gapSepDist[2];
        fingerStartDist.push(Math.min(raw, maxStart));
      }
      console.log('[FINGER START ' + s + '] ' +
        fingerNames.map((n, fi) => n + '=' + (fingerStartDist[fi]*1000).toFixed(1) + 'mm').join(' '));

      // --- Measure dorsal Y profile across Z to find finger widths ---
      // These valleys are the PRIMARY inter-finger Z boundaries used for centering.
      let dorsalFingerZLo = [], dorsalFingerZHi = [], dorsalFingerCenterZ = [];
      let dorsalValleysOK = false;
      {
        const expectedMidLen = fingerLen * fingerRatios[1];
        const measX = knuckleX + expectedMidLen * 0.5 * handSign;
        // Bin dorsal verts by Z (2mm bins), record max Y per bin
        const binSize = 0.002; // 2mm
        const zRange = 0.10; // ±100mm from hand center should cover all fingers
        const handCenterZ = (knZMin + knZMax) / 2;
        const bins = {};
        for (let i = 0; i < nM; i++) {
          const vx = meshRestPos[i * 3];
          if (Math.abs(vx - measX) > 0.008) continue;
          const vy = meshRestPos[i * 3 + 1];
          if (Math.abs(vy - knuckleY) > 0.04) continue;
          const vz = meshRestPos[i * 3 + 2];
          if (Math.abs(vz - handCenterZ) > zRange) continue;
          const bi = Math.round(vz / binSize);
          if (!bins[bi] || vy > bins[bi].maxY) {
            bins[bi] = { maxY: vy, z: bi * binSize };
          }
        }
        // Convert to sorted array
        const profile = Object.values(bins).sort((a, b) => a.z - b.z);
        // Smooth with 5-point moving average to eliminate vertex noise
        const smooth = [];
        for (let k = 0; k < profile.length; k++) {
          let sy = 0, sn = 0;
          for (let j = Math.max(0, k-2); j <= Math.min(profile.length-1, k+2); j++) {
            sy += profile[j].maxY; sn++;
          }
          smooth.push({ z: profile[k].z, y: sy / sn });
        }
        // Log smoothed Y profile
        const profileStr = smooth.map(p =>
          (p.z * 1000).toFixed(0) + ':' + (p.y * 1000).toFixed(1)).join(', ');
        console.log('[DORSAL YPROFILE ' + s + '] X=' + (expectedMidLen*0.5*1000).toFixed(0) +
          'mm Z(mm):smoothY(mm) = ' + profileStr);
        // Find valleys (local Y minima in smoothed data)
        const valleys = [];
        for (let k = 1; k < smooth.length - 1; k++) {
          if (smooth[k].y < smooth[k-1].y && smooth[k].y < smooth[k+1].y) {
            valleys.push({ z: smooth[k].z, y: smooth[k].y });
          }
        }
        console.log('[DORSAL VALLEYS ' + s + '] ' +
          valleys.map(v => 'Z=' + (v.z*1000).toFixed(0) + ' Y=' + (v.y*1000).toFixed(1)).join(', '));
        // Find the 3 inter-finger valleys: near expected boundaries from valleyZ
        // valleyZ has 3 values from the zprofile detection
        const interValleys = [];
        for (let vi = 0; vi < valleyZ.length; vi++) {
          const expectedZ = valleyZ[vi];
          let best = null, bestDist = Infinity;
          for (const v of valleys) {
            const d = Math.abs(v.z - expectedZ);
            if (d < bestDist && d < 0.015) { bestDist = d; best = v; }
          }
          if (best) interValleys.push(best);
        }
        interValleys.sort((a, b) => a.z - b.z);
        if (interValleys.length === 3) {
          const outerLo = smooth[0].z;  // hand edge (pinky side)
          const outerHi = smooth[smooth.length - 1].z; // hand edge (index side)
          const zoneEdges = [outerLo, ...interValleys.map(v => v.z), outerHi];
          const fNames = ['pinky','ring','middle','index'];
          const widths = [];
          for (let f = 0; f < 4; f++) {
            const lo = zoneEdges[f], hi = zoneEdges[f + 1];
            const w = hi - lo;
            const ctr = (lo + hi) / 2;
            widths.push(fNames[f] + '=' + (w*1000).toFixed(1) + 'mm(ctr=' + (ctr*1000).toFixed(1) + ')');
          }
          console.log('[DORSAL FINGER WIDTH ' + s + '] ' + widths.join(' ') +
            ' valleys=[' + interValleys.map(v => (v.z*1000).toFixed(1) + '@Y=' +
            (v.y*1000).toFixed(1)).join(', ') + ']');
          // Store finger Z boundaries from dorsal valleys for use in march
          const vz = interValleys.map(v => v.z).sort((a, b) => a - b);
          // vz sorted low→high: [pinky-ring, ring-middle, middle-index]
          // Edge fingers (index, pinky) use knuckle-detected hand edges, not
          // full dorsal profile extent, to avoid including non-finger hand surface.
          dorsalFingerZLo = [vz[2], vz[1], vz[0], knZMin]; // idx, mid, ring, pink
          dorsalFingerZHi = [knZMax, vz[2], vz[1], vz[0]];
          dorsalFingerCenterZ = dorsalFingerZLo.map((lo, i) => (lo + dorsalFingerZHi[i]) / 2);
          dorsalValleysOK = true;
          console.log('[DORSAL CENTERS ' + s + '] ' +
            fingerNames.map((n, i) => n + '=' + (dorsalFingerCenterZ[i]*1000).toFixed(1) + 'mm').join(' ') +
            ' boundaries=[' + vz.map(v => (v*1000).toFixed(1)).join(', ') + ']');
        } else {
          console.log('[DORSAL FINGER WIDTH ' + s + '] only found ' +
            interValleys.length + '/3 inter-finger valleys');
        }
      }

      // --- Gap boundary extrapolation ---
      // Phase 1: Scan outward, find inter-finger gaps on dorsal surface where
      //   fingers are clearly separated. Track gap Z positions vs X distance.
      // Phase 2: Fit lines to each boundary (Z = slope*d + intercept).
      // Phase 3: Extrapolate boundaries to ALL X positions. Z center at any X
      //   = midpoint of the two boundary lines for that finger. Y center comes
      //   from cross-section points within the boundary-defined Z territory.

      const scanStep = 0.002; // 2mm
      const maxScanDist = fingerLen * 1.15;
      const scanStartDist = 0.005; // 5mm past knuckle
      const binW = 0.001; // 1mm Z bins

      // Phase 1: Collect gap boundary data from separated cross-sections.
      // 5 boundaries define 4 finger corridors:
      //   bnd[0] = outer low-Z edge (pinky side)
      //   bnd[1] = gap between lowest and 2nd-lowest Z finger
      //   bnd[2] = gap between 2nd and 3rd Z finger
      //   bnd[3] = gap between 3rd and highest Z finger
      //   bnd[4] = outer high-Z edge (index side)
      const bndPts = [[], [], [], [], []]; // [{d, z}]
      let fiByZ = null; // finger order by Z (low→high), set on first 4-region slice

      // Cache all cross-section data for Phase 3
      const sliceCache = []; // [{d, xPos, rawPts}]

      for (let d = scanStartDist; d <= maxScanDist; d += scanStep) {
        const xPos = knuckleX + d * handSign;
        const pts = sliceMeshAtX(xPos, handTris, meshRestPos);

        // Collect hand-level points
        const rawPts = [];
        for (let pi = 0; pi < pts.length; pi++) {
          if (Math.abs(pts[pi].y - knuckleY) <= 0.035) rawPts.push(pts[pi]);
        }
        if (rawPts.length < 4) continue;
        sliceCache.push({d, xPos, rawPts});

        // Filter to DORSAL points only (Y > median)
        rawPts.sort((a, b) => a.y - b.y);
        const medianY = rawPts[Math.floor(rawPts.length / 2)].y;
        const dorsalPts = [];
        for (let pi = 0; pi < rawPts.length; pi++) {
          if (rawPts[pi].y >= medianY) dorsalPts.push(rawPts[pi]);
        }
        if (dorsalPts.length < 2) continue;

        // Bin dorsal points by Z
        let zMin = Infinity, zMax = -Infinity;
        for (let pi = 0; pi < dorsalPts.length; pi++) {
          if (dorsalPts[pi].z < zMin) zMin = dorsalPts[pi].z;
          if (dorsalPts[pi].z > zMax) zMax = dorsalPts[pi].z;
        }
        const nBins = Math.ceil((zMax - zMin) / binW) + 1;
        if (nBins < 2 || nBins > 500) continue;
        const occupied = new Uint8Array(nBins);
        for (let pi = 0; pi < dorsalPts.length; pi++) {
          const bi = Math.min(nBins - 1, Math.floor((dorsalPts[pi].z - zMin) / binW));
          occupied[bi] = 1;
        }

        // Find contiguous filled regions (sorted low→high Z by construction)
        const regions = [];
        let regStart = -1;
        for (let bi = 0; bi <= nBins; bi++) {
          if (bi < nBins && occupied[bi]) {
            if (regStart < 0) regStart = bi;
          } else {
            if (regStart >= 0) {
              regions.push({
                zLo: zMin + regStart * binW,
                zHi: zMin + bi * binW
              });
              regStart = -1;
            }
          }
        }
        if (regions.length < 4) continue;

        // Match regions to fingers by nearest seed Z
        const fingerRI = [-1, -1, -1, -1];
        const fingerRD = [Infinity, Infinity, Infinity, Infinity];
        for (let ri = 0; ri < regions.length; ri++) {
          const rc = (regions[ri].zLo + regions[ri].zHi) / 2;
          let bestFi = 0, bestD = Math.abs(rc - seedWorldZ[0]);
          for (let fi = 1; fi < 4; fi++) {
            const dd = Math.abs(rc - seedWorldZ[fi]);
            if (dd < bestD) { bestD = dd; bestFi = fi; }
          }
          if (bestD < fingerRD[bestFi]) {
            fingerRD[bestFi] = bestD;
            fingerRI[bestFi] = ri;
          }
        }
        if (fingerRI[0] < 0 || fingerRI[1] < 0 || fingerRI[2] < 0 || fingerRI[3] < 0) continue;

        // Establish Z ordering of fingers (set once, keep consistent)
        const curOrder = [0, 1, 2, 3].sort((a, b) =>
          (regions[fingerRI[a]].zLo + regions[fingerRI[a]].zHi) -
          (regions[fingerRI[b]].zLo + regions[fingerRI[b]].zHi));
        if (!fiByZ) fiByZ = curOrder.slice();

        // Record boundary data points
        bndPts[0].push({d, z: regions[fingerRI[fiByZ[0]]].zLo}); // outer low
        bndPts[4].push({d, z: regions[fingerRI[fiByZ[3]]].zHi}); // outer high
        for (let gi = 0; gi < 3; gi++) {
          const gapZ = (regions[fingerRI[fiByZ[gi]]].zHi +
                        regions[fingerRI[fiByZ[gi + 1]]].zLo) / 2;
          bndPts[gi + 1].push({d, z: gapZ});
        }
      }

      // Line fitting (from cage-core)
      const fitLineZD = CageCore.fitLineZD;
      const bndLines = bndPts.map(fitLineZD);
      const bndOK = fiByZ && bndLines.every(function(l) { return l !== null; });

      // Map each finger to its lo/hi boundary indices
      const fingerBndLo = [0, 0, 0, 0], fingerBndHi = [0, 0, 0, 0];
      if (fiByZ) {
        for (let k = 0; k < 4; k++) {
          fingerBndLo[fiByZ[k]] = k;
          fingerBndHi[fiByZ[k]] = k + 1;
        }
      }

      // Evaluate boundary line at distance d
      function evalBnd(bi, d) {
        return bndLines[bi].slope * d + bndLines[bi].intercept;
      }

      // Log boundary extrapolation results
      if (bndOK) {
        const extrapLog = [];
        for (let fi = 0; fi < 4; fi++) {
          const lo0 = evalBnd(fingerBndLo[fi], 0);
          const hi0 = evalBnd(fingerBndHi[fi], 0);
          extrapLog.push(fingerNames[fi] + ':Z=' + ((lo0 + hi0) / 2 * 1000).toFixed(1) +
            'mm(w=' + ((hi0 - lo0) * 1000).toFixed(1) + ')');
        }
        console.log('[EXTRAP ' + s + '] knuckle centers: ' + extrapLog.join(' ') +
          ' pts=' + bndPts[1].length);
      } else {
        console.log('[EXTRAP ' + s + '] FAILED — only ' +
          (bndPts[1] ? bndPts[1].length : 0) + ' separated slices');
      }

      // Phase 3: Build fingerScan using extrapolated boundaries for Z
      const fingerScan = [[], [], [], []];

      if (bndOK) {
        for (let ci = 0; ci < sliceCache.length; ci++) {
          const sc = sliceCache[ci];
          for (let fi = 0; fi < 4; fi++) {
            const zLo = evalBnd(fingerBndLo[fi], sc.d);
            const zHi = evalBnd(fingerBndHi[fi], sc.d);
            const zCenter = (zLo + zHi) / 2;
            if (zHi <= zLo) continue; // boundaries crossed

            // Collect all cross-section points within this Z territory
            const margin = (zHi - zLo) * 0.15;
            let fyMin = Infinity, fyMax = -Infinity;
            let fzMin = Infinity, fzMax = -Infinity;
            let fCount = 0;
            for (let pi = 0; pi < sc.rawPts.length; pi++) {
              const pz = sc.rawPts[pi].z;
              if (pz >= zLo - margin && pz <= zHi + margin) {
                if (sc.rawPts[pi].y < fyMin) fyMin = sc.rawPts[pi].y;
                if (sc.rawPts[pi].y > fyMax) fyMax = sc.rawPts[pi].y;
                if (pz < fzMin) fzMin = pz;
                if (pz > fzMax) fzMax = pz;
                fCount++;
              }
            }
            if (fCount < 2) continue;
            fingerScan[fi].push({
              x: sc.xPos, d: sc.d,
              yCenter: (fyMin + fyMax) / 2,
              zCenter: zCenter, // from extrapolated boundaries
              zWidth: zHi - zLo, // boundary corridor width
              meshZWidth: fzMax - fzMin, // actual mesh extent (for tip detection)
              yWidth: fyMax - fyMin,
              count: fCount
            });
          }
        }
      }

      for (let fi = 0; fi < 4; fi++) {
        const name = fingerNames[fi];
        const isMiddle = (name === 'middle');
        const expectedLen = fingerLen * fingerRatios[fi];
        const scanEntries = fingerScan[fi];

        // Determine reference width from actual mesh extent at 40-60% of expected length
        let refWidth = 0, refN = 0;
        const refLo = expectedLen * 0.4;
        const refHi = expectedLen * 0.6;
        for (let si = 0; si < scanEntries.length; si++) {
          if (scanEntries[si].d >= refLo && scanEntries[si].d <= refHi) {
            refWidth += scanEntries[si].meshZWidth;
            refN++;
          }
        }
        refWidth = refN > 0 ? refWidth / refN : 0.012; // fallback 12mm

        // Tip X: last step where actual mesh extent >= refWidth * 0.45 AND count >= 2
        let tipIdx = scanEntries.length - 1;
        for (let si = scanEntries.length - 1; si >= 0; si--) {
          if (scanEntries[si].meshZWidth >= refWidth * 0.45 && scanEntries[si].count >= 2) {
            tipIdx = si;
            break;
          }
        }

        console.log('[TUBE SCAN ' + s + ' ' + name + '] steps=' + scanEntries.length +
          ' tip=' + (scanEntries.length > 0 ? (scanEntries[tipIdx].d*1000).toFixed(1) : '?') + 'mm' +
          ' refWidth=' + (refWidth*1000).toFixed(1) + 'mm');

        // === Place joints from scan data ===
        let j0, j1, j2, j3;
        let fLen = expectedLen;
        let tipMethod;

        if (scanEntries.length >= 4 && tipIdx >= 3) {
          // Tip inset: pull tip joint inward by refWidth * 0.25
          const tipInset = refWidth * 0.25;
          const tipD = scanEntries[tipIdx].d - tipInset;

          // Find scan entry closest to tipD
          let tipEntry = scanEntries[tipIdx];
          for (let si = tipIdx; si >= 0; si--) {
            if (scanEntries[si].d <= tipD) { tipEntry = scanEntries[si]; break; }
          }

          // j0 = first scan entry
          const startEntry = scanEntries[0];
          const startD = startEntry.d, endD = tipEntry.d;
          const d1 = startD + (endD - startD) * 0.38;
          const d2 = startD + (endD - startD) * 0.61;

          // Find closest scan entries to d1 and d2
          let entry1 = startEntry, entry2 = tipEntry;
          let best1 = Infinity, best2 = Infinity;
          for (let si = 0; si < scanEntries.length; si++) {
            const dd1 = Math.abs(scanEntries[si].d - d1);
            const dd2 = Math.abs(scanEntries[si].d - d2);
            if (dd1 < best1) { best1 = dd1; entry1 = scanEntries[si]; }
            if (dd2 < best2) { best2 = dd2; entry2 = scanEntries[si]; }
          }

          j0 = [startEntry.x, startEntry.yCenter, startEntry.zCenter];
          j1 = [entry1.x, entry1.yCenter, entry1.zCenter];
          j2 = [entry2.x, entry2.yCenter, entry2.zCenter];
          j3 = [tipEntry.x, tipEntry.yCenter, tipEntry.zCenter];

          fLen = vlen(vsub(j3, j0));
          tipMethod = 'start-end-line';

          console.log('[FINGER LINE ' + s + ' ' + name + '] start=[' +
            j0.map(v => (v * 1000).toFixed(1)).join(',') + '] end=[' +
            j3.map(v => (v * 1000).toFixed(1)).join(',') + '] len=' +
            (fLen * 1000).toFixed(1) + 'mm refW=' + (refWidth * 1000).toFixed(1) + 'mm');
        } else {
          // Fallback: straight line using seed Z and knuckle Y
          const fbEndD = Math.min(maxScanDist, expectedLen * 0.95);
          const fbStartX = knuckleX + scanStartDist * handSign;
          const fbEndX = knuckleX + fbEndD * handSign;
          j0 = [fbStartX, knuckleY, originalSeedZ[fi]];
          j3 = [fbEndX, knuckleY, originalSeedZ[fi]];
          j1 = vadd(j0, vscale(vsub(j3, j0), 0.38));
          j2 = vadd(j0, vscale(vsub(j3, j0), 0.61));
          fLen = vlen(vsub(j3, j0));
          tipMethod = 'fallback(steps=' + scanEntries.length + ',tipIdx=' + tipIdx + ')';
          console.log('[FINGER LINE ' + s + ' ' + name + '] FALLBACK steps=' +
            scanEntries.length + ' tipIdx=' + tipIdx);
        }

        // === CENTER verification via independent exact cross-sections ===
        // Uses boundary-extrapolated Z territories for point selection.
        {
          const joints = [j0, j1, j2, j3];
          const jNames = ['j0', 'j1', 'j2', 'j3'];
          const centerCheck = [];
          for (let ji = 0; ji < 4; ji++) {
            const jx = joints[ji][0], jy = joints[ji][1], jz = joints[ji][2];
            // Compute distance d from knuckle for this joint
            const jd = Math.abs(jx - knuckleX);
            // Take independent cross-section at this joint's X
            const pts = sliceMeshAtX(jx, handTris, meshRestPos);
            const nearby = [];
            for (let pi = 0; pi < pts.length; pi++) {
              if (Math.abs(pts[pi].y - knuckleY) <= 0.035) nearby.push(pts[pi]);
            }
            if (nearby.length < 2) {
              centerCheck.push(jNames[ji] + ':noPts(' + nearby.length + ')');
              continue;
            }
            // Use boundary-defined Z territory for this finger at this d
            const sel = [];
            if (bndOK) {
              const zLo = evalBnd(fingerBndLo[fi], jd);
              const zHi = evalBnd(fingerBndHi[fi], jd);
              const margin = (zHi - zLo) * 0.15;
              for (let pi = 0; pi < nearby.length; pi++) {
                if (nearby[pi].z >= zLo - margin && nearby[pi].z <= zHi + margin)
                  sel.push(nearby[pi]);
              }
            } else {
              // Fallback: nearest-seed assignment
              for (let pi = 0; pi < nearby.length; pi++) {
                const pz = nearby[pi].z;
                let bestFi = fi, bestDist = Math.abs(pz - jz);
                for (let other = 0; other < 4; other++) {
                  if (other === fi) continue;
                  const dd = Math.abs(pz - seedWorldZ[other]);
                  if (dd < bestDist) { bestFi = other; bestDist = dd; }
                }
                if (bestFi === fi) sel.push(nearby[pi]);
              }
            }
            if (sel.length < 2) {
              centerCheck.push(jNames[ji] + ':noSel(' + sel.length + ')');
              continue;
            }
            let czMin = Infinity, czMax = -Infinity;
            let tyMin = Infinity, tyMax = -Infinity;
            for (let pi = 0; pi < sel.length; pi++) {
              if (sel[pi].z < czMin) czMin = sel[pi].z;
              if (sel[pi].z > czMax) czMax = sel[pi].z;
              if (sel[pi].y < tyMin) tyMin = sel[pi].y;
              if (sel[pi].y > tyMax) tyMax = sel[pi].y;
            }
            const tubeCZ = (czMin + czMax) / 2;
            const tubeCY = (tyMin + tyMax) / 2;
            centerCheck.push(jNames[ji] + ':dY=' + ((jy - tubeCY) * 1000).toFixed(1) +
              ',dZ=' + ((jz - tubeCZ) * 1000).toFixed(1));
          }
          console.log('[CENTER ' + s + ' ' + name + '] ' + centerCheck.join(' '));
        }

        fingerLens.push(fLen);

        if (isMiddle) {
          P[pr + 'mid_knuckle'] = j0;
          P[pr + 'middle2'] = j1;
          P[pr + 'middle3'] = j2;
          P[pr + 'middle4'] = j3;
        } else {
          P[pr + name + '1'] = j0;
          P[pr + name + '2'] = j1;
          P[pr + name + '3'] = j2;
          P[pr + name + '4'] = j3;
        }

        console.log('[FINGER ' + s + ' ' + name + '] j0=[' +
          j0.map(v => (v * 1000).toFixed(1)).join(',') + '] j1=[' +
          j1.map(v => (v * 1000).toFixed(1)).join(',') + '] j2=[' +
          j2.map(v => (v * 1000).toFixed(1)).join(',') + '] j3=[' +
          j3.map(v => (v * 1000).toFixed(1)).join(',') + '] len=' +
          (fLen * 1000).toFixed(1) + 'mm ' + tipMethod);
      }

      // D) Thumb: find base and tip from mesh on the thumb side of the hand.
      // Thumb is on the side where ts*spread points, extending palmward (-palmN).
      // Thumb base (CMC joint): ~25% along hand from wrist, on thumb side, slightly palmar
      const tb = vadd(wrist, vadd(
        vscale(handDir, handLen * 0.25),
        vadd(vscale(spread, ts * 1.5 * fsp), vscale(palmN, -handLen * 0.12))
      ));
      // Thumb direction: outward + palmar + slightly distal
      const thumbDir = vnorm(vadd(
        vscale(handDir, 0.3),
        vadd(vscale(spread, ts * 0.6), vscale(palmN, -0.5))
      ));
      // Find thumb tip: farthest mesh vert along thumbDir from thumb base,
      // within a cylinder around the thumb axis
      const thumbCylR = fingerR * 2.5;
      let maxThumbAlong = 0;
      for (let i = 0; i < nM; i++) {
        const dx=meshRestPos[i*3]-tb[0], dy=meshRestPos[i*3+1]-tb[1], dz=meshRestPos[i*3+2]-tb[2];
        const al = dx*thumbDir[0]+dy*thumbDir[1]+dz*thumbDir[2];
        if (al < 0) continue;
        const perpSq = dx*dx+dy*dy+dz*dz - al*al;
        if (perpSq > thumbCylR*thumbCylR) continue;
        if (al > maxThumbAlong) maxThumbAlong = al;
      }
      // Centroid of verts in the last 15% of thumb
      const thumbTipBand = maxThumbAlong * 0.15;
      let ttx=0, tty=0, ttz=0, ttcnt=0;
      for (let i = 0; i < nM; i++) {
        const dx=meshRestPos[i*3]-tb[0], dy=meshRestPos[i*3+1]-tb[1], dz=meshRestPos[i*3+2]-tb[2];
        const al = dx*thumbDir[0]+dy*thumbDir[1]+dz*thumbDir[2];
        if (al < maxThumbAlong - thumbTipBand) continue;
        const perpSq = dx*dx+dy*dy+dz*dz - al*al;
        if (perpSq > thumbCylR*thumbCylR) continue;
        ttx+=meshRestPos[i*3]; tty+=meshRestPos[i*3+1]; ttz+=meshRestPos[i*3+2]; ttcnt++;
      }
      const thumbTip = ttcnt >= 2 ? [ttx/ttcnt, tty/ttcnt, ttz/ttcnt]
        : vadd(tb, vscale(thumbDir, handLen * 0.5));
      const thumbLen = vlen(vsub(thumbTip, tb));
      P[pr+'thumb1'] = tb;
      P[pr+'thumb2'] = vadd(tb, vscale(vsub(thumbTip, tb), 0.33));
      P[pr+'thumb3'] = vadd(tb, vscale(vsub(thumbTip, tb), 0.65));
      P[pr+'thumb4'] = thumbTip;

      derived.push(s+'_thumb1',s+'_thumb2',s+'_thumb3',s+'_thumb4',
        s+'_index1',s+'_index2',s+'_index3',s+'_index4',
        s+'_middle2',s+'_middle3',s+'_middle4',
        s+'_ring1',s+'_ring2',s+'_ring3',s+'_ring4',
        s+'_pinky1',s+'_pinky2',s+'_pinky3',s+'_pinky4');

      console.log('[DERIVE FINGERS ' + s + '] knuckle=' + (knuckleAlong*1000).toFixed(1) +
        'mm fingerLens=[' + fingerLens.map(l=>(l*1000).toFixed(0)).join(',') + ']mm' +
        ' thumbLen=' + (thumbLen*1000).toFixed(0) + 'mm' +
        ' width=' + (handWidth*1000).toFixed(1) + 'mm ts=' + ts);
    }

    if (derived.length > 0) {
      console.log('[DERIVE MISSING] Derived ' + derived.length + ' joints from mesh: ' + derived.join(', '));
    }

    // --- Auto-correct wrist positions from mesh geometry ---
    // The horizontal-band centroid in projectToInterior often places the wrist
    // too far along the arm axis. Fix by finding the narrowest mesh cross-section
    // between elbow and the hand (the anatomical wrist).
    if (meshRestPos) {
      for (const s of ['l','r']) {
        const pr = s + '_';
        const elbow = P[pr+'elbow'], wrist = P[pr+'wrist'], shoulder = P[pr+'shoulder'];
        if (!elbow || !wrist || !shoulder) continue;

        const armDir = vnorm(vsub(wrist, elbow));
        const armLen = vlen(vsub(wrist, elbow));
        const nM = meshRestPos.length / 3;

        // Scan along arm axis from elbow outward, compute cross-section radius at each step
        const nSteps = 40;
        let minRadius = Infinity, minT = 0.5;
        const startT = 0.3; // skip elbow region
        const endT = 1.2;   // scan past current wrist to find true narrowing

        for (let si = 0; si < nSteps; si++) {
          const t = startT + (endT - startT) * si / (nSteps - 1);
          const center = vadd(elbow, vscale(armDir, armLen * t));
          const bandHalf = armLen * 0.04; // thin band along arm axis

          let sumR = 0, countR = 0;
          for (let i = 0; i < nM; i++) {
            const dx = meshRestPos[i*3]-center[0], dy = meshRestPos[i*3+1]-center[1], dz = meshRestPos[i*3+2]-center[2];
            const along = dx*armDir[0]+dy*armDir[1]+dz*armDir[2];
            if (Math.abs(along) > bandHalf) continue;
            const radSq = dx*dx+dy*dy+dz*dz - along*along;
            if (radSq > 0) { sumR += Math.sqrt(radSq); countR++; }
          }
          if (countR > 3) {
            const avgR = sumR / countR;
            if (avgR < minRadius) {
              minRadius = avgR;
              minT = t;
            }
          }
        }

        const newWrist = vadd(elbow, vscale(armDir, armLen * minT));
        const oldDist = vlen(vsub(wrist, elbow));
        const newDist = armLen * minT;
        const shift = vlen(vsub(newWrist, wrist));

        if (shift > 0.005 && minT < 1.05) { // only correct if meaningful shift and within reasonable range
          console.log('[WRIST AUTO-CORRECT ' + s + '] narrowest radius=' + (minRadius*1000).toFixed(1) +
            'mm at t=' + minT.toFixed(2) + ', old forearm=' + (oldDist*1000).toFixed(1) +
            'mm, new forearm=' + (newDist*1000).toFixed(1) + 'mm, shift=' + (shift*1000).toFixed(1) + 'mm');
          P[pr+'wrist'] = newWrist;
          // Clear knuckle + finger data so they're re-derived from mesh with new wrist
          delete P[pr+'mid_knuckle'];
          const fingerKeys = ['thumb1','thumb2','thumb3','thumb4',
            'index1','index2','index3','index4',
            'middle2','middle3','middle4',
            'ring1','ring2','ring3','ring4',
            'pinky1','pinky2','pinky3','pinky4'];
          for (const fk of fingerKeys) delete P[pr+fk];
          derived.push(pr+'wrist (auto-corrected)');
        } else {
          console.log('[WRIST AUTO-CORRECT ' + s + '] wrist position OK (shift=' + (shift*1000).toFixed(1) + 'mm)');
        }
      }

      // Re-derive fingers if wrist was corrected: clear finger keys, then
      // re-run the main finger derivation loop by recursing into deriveMissingJoints.
      let needsRederive = false;
      for (const s of ['l','r']) {
        if (!P[s+'_index1'] && P[s+'_wrist'] && P[s+'_elbow']) {
          needsRederive = true;
          console.log('[WRIST AUTO-CORRECT ' + s + '] finger keys cleared, will re-derive');
        }
      }
      if (needsRederive) deriveMissingJoints();
    }
  }

  // Splay rest-pose mesh fingers (Z-axis only) — blended correction field.
  //
  // Uses BLENDED corrections instead of hard per-finger assignment.
  // Each vert gets a weighted average of all nearby finger corrections,
  // based on Z-proximity to each finger center. This creates a smooth,
  // continuous displacement field: tube interiors move rigidly, web skin
  // between fingers stretches naturally (like spreading real fingers).
  // No hard discontinuities → no mesh tearing.
  function straightenFingers() {
    if (!meshRestPos || !meshGeo) return false;
    const nM = meshRestPos.length / 3;
    if (nM === 0) return false;

    const ss01 = (t) => t * t * (3 - 2 * t); // smoothstep 0-1

    // Save original rest positions for shape-preservation diagnostics
    const origRestPos = new Float32Array(meshRestPos);

    let anyApplied = false;
    // Taper: zero before TAPER_START (palm = no correction), ramp to 1 at TAPER_END.
    // Fingers separate from palm at ~15-25% progress (crotch). Start correction after.
    const TAPER_START = 0.20;
    const TAPER_END = 0.50;

    for (const s of ['l', 'r']) {
      const pr = s + '_';
      const wrist = P[pr + 'wrist'], elbow = P[pr + 'elbow'];
      if (!wrist || !elbow) continue;

      const fingerNames = ['index', 'middle', 'ring', 'pinky'];

      // Read knuckle + tip from first-pass joints
      const knuckles = [P[pr+'index1'], P[pr+'mid_knuckle'], P[pr+'ring1'], P[pr+'pinky1']];
      const tips = [P[pr+'index4'], P[pr+'middle4'], P[pr+'ring4'], P[pr+'pinky4']];
      if (knuckles.some(k => !k) || tips.some(t => !t)) continue;

      const handSign = Math.sign(wrist[0] - elbow[0]);
      const knuckleY = (knuckles[0][1]+knuckles[1][1]+knuckles[2][1]+knuckles[3][1]) / 4;
      const knuckleX = knuckles[1][0]; // middle knuckle X (gap detection only)
      const fingerKnX = knuckles.map(k => k[0]); // per-finger knuckle X
      const digitZ = knuckles.map(k => k[2]); // knuckle Z per finger (vert assignment ref)
      const fingerXExtent = tips.map((t, fi) => Math.abs(t[0] - knuckles[fi][0]));
      const midFingerLen = fingerXExtent[1];
      const indexDir = Math.sign(digitZ[0] - digitZ[1]);

      // --- Gap detection — skip if mesh already spread ---
      const gapBnd = [
        (digitZ[0] + digitZ[1]) / 2,
        (digitZ[1] + digitZ[2]) / 2,
        (digitZ[2] + digitZ[3]) / 2
      ];
      let minGap = Infinity;
      for (let pi = 0; pi < 3; pi++) {
        const zB = gapBnd[pi];
        for (let pct = 0.30; pct <= 0.60; pct += 0.10) {
          const scanX = knuckleX + pct * midFingerLen * handSign;
          let maxLo = -Infinity, minHi = Infinity;
          for (let i = 0; i < nM; i++) {
            const vx = meshRestPos[i*3], vy = meshRestPos[i*3+1], vz = meshRestPos[i*3+2];
            if (Math.abs(vx - scanX) > 0.008 || Math.abs(vy - knuckleY) > 0.025) continue;
            if (indexDir > 0) {
              if (vz > zB && vz < minHi) minHi = vz;
              else if (vz <= zB && vz > maxLo) maxLo = vz;
            } else {
              if (vz < zB && vz > maxLo) maxLo = vz;
              else if (vz >= zB && vz < minHi) minHi = vz;
            }
          }
          if (minHi < Infinity && maxLo > -Infinity) {
            const gap = Math.abs(minHi - maxLo);
            if (gap < minGap) minGap = gap;
          }
        }
      }
      if (minGap > 0.0015) {
        console.log('[STRAIGHTEN ' + s + '] SKIPPED - already spread (minGap=' +
          (minGap * 1000).toFixed(2) + 'mm)');
        continue;
      }

      // === SPLAY OFFSETS ===
      // Equal-gap splay: redistribute fingers so all 3 inter-finger gaps are equal.
      // Ring-pinky are naturally much closer (16mm) than index-middle (30mm).
      // Uniform splay wastes budget on already-separated pairs.
      // This computes offsets so final spacing is equal + adds expansion.
      const originalSpan = Math.abs(digitZ[0] - digitZ[3]);
      const expansion = 0.020; // 20mm total hand expansion
      const targetSpacing = (originalSpan + expansion) / 3;
      const handCenter = (digitZ[0] + digitZ[3]) / 2;
      const targetZ = [
        handCenter + 1.5 * targetSpacing * indexDir,
        handCenter + 0.5 * targetSpacing * indexDir,
        handCenter - 0.5 * targetSpacing * indexDir,
        handCenter - 1.5 * targetSpacing * indexDir
      ];
      const splayOffset = targetZ.map((tz, fi) => tz - digitZ[fi]);

      // Save splay offsets for second-pass seed override
      P['_' + s + '_splayOffset'] = splayOffset.slice();

      console.log('[STRAIGHTEN ' + s + '] splay offsets: ' +
        fingerNames.map((n, fi) => n + '=' + (splayOffset[fi]*1000).toFixed(1) + 'mm').join(' '));

      // === APPLY: hard-assign + web blend ===
      // Tube interior verts get their finger's offset rigidly (preserves tube shape).
      // Web verts (near the midpoint between two fingers) get a smooth blend.
      let vertCount = 0;

      // Precompute midpoints between adjacent finger centers
      const midpoints = []; // 3 midpoints: index-middle, middle-ring, ring-pinky
      for (let fi = 0; fi < 3; fi++) midpoints.push((digitZ[fi] + digitZ[fi+1]) / 2);

      for (let i = 0; i < nM; i++) {
        const vx = meshRestPos[i*3], vy = meshRestPos[i*3+1], vz = meshRestPos[i*3+2];

        if (Math.abs(vy - knuckleY) > 0.030) continue;

        // X distance from middle knuckle (use as reference for progress)
        const dxMid = (vx - knuckleX) * handSign;
        if (dxMid < -0.0015) continue; // behind knuckles

        // Knuckle taper: 4.5mm zone at palm→finger transition
        const knuckleTaper = dxMid >= 0.003 ? 1.0 : ss01(Math.max(0, (dxMid + 0.0015) / 0.0045));
        if (knuckleTaper < 0.001) continue;

        // Progress along mid finger (0 at knuckle, 1 at tip)
        let progress = midFingerLen > 0 ? dxMid / midFingerLen : 0;
        progress = Math.max(0, Math.min(1, progress));

        // Progress taper: 0 before TAPER_START (palm), ramp to 1 at TAPER_END
        const taper = progress < TAPER_START ? 0 :
          progress < TAPER_END ? ss01((progress - TAPER_START) / (TAPER_END - TAPER_START)) : 1.0;
        if (taper < 0.001) continue;

        // Find nearest and second-nearest finger by Z distance
        let nearest = -1, nearestDist = Infinity;
        let second = -1, secondDist = Infinity;
        for (let fi = 0; fi < 4; fi++) {
          const dz = Math.abs(vz - digitZ[fi]);
          if (dz < nearestDist) {
            second = nearest; secondDist = nearestDist;
            nearest = fi; nearestDist = dz;
          } else if (dz < secondDist) {
            second = fi; secondDist = dz;
          }
        }

        // Physical-distance blend: rigid inside tubes, smooth 4mm transition at web
        // margin = how much closer to nearest vs second-nearest (0 at midpoint)
        const margin = secondDist - nearestDist;
        const halfBlend = 0.004; // 4mm half-width of blend zone
        const t = Math.min(1, margin / (2 * halfBlend)); // 0 at midpoint, 1 at 8mm from midpoint
        const blend = 0.5 * (1 - ss01(t)); // 0.5 at midpoint, 0 beyond blend zone
        const correction = splayOffset[nearest] * (1 - blend) + splayOffset[second] * blend;

        let finalCorr = correction * taper * knuckleTaper;
        if (Math.abs(finalCorr) < 1e-7) continue;

        meshRestPos[i*3+2] += finalCorr;
        meshGeo.attributes.position.array[i*3+2] += finalCorr;
        vertCount++;
      }

      meshGeo.attributes.position.needsUpdate = true;
      if (vertCount > 0) anyApplied = true;

      // === DIAGNOSTICS ===

      // Total displacement from original
      let maxDisp = 0, totalDisp = 0, dispCount = 0;
      for (let i = 0; i < nM; i++) {
        const d = Math.abs(meshRestPos[i*3+2] - origRestPos[i*3+2]);
        if (d > 1e-7) {
          if (d > maxDisp) maxDisp = d;
          totalDisp += d;
          dispCount++;
        }
      }
      console.log('[STRAIGHTEN ' + s + '] displacement: max=' +
        (maxDisp*1000).toFixed(2) + 'mm avg=' +
        (dispCount > 0 ? (totalDisp/dispCount*1000).toFixed(2) : '0') +
        'mm (' + vertCount + ' verts moved)');

      // Triangle edge stretch diagnostic
      if (meshGeo.index) {
        const idx = meshGeo.index.array;
        let maxEdgeStretch = 0, stretchCount = 0;
        for (let ti = 0; ti < idx.length; ti += 3) {
          const triVerts = [idx[ti], idx[ti+1], idx[ti+2]];
          for (let ei = 0; ei < 3; ei++) {
            const a = triVerts[ei], b = triVerts[(ei+1) % 3];
            const da = meshRestPos[a*3+2] - origRestPos[a*3+2];
            const db = meshRestPos[b*3+2] - origRestPos[b*3+2];
            const edgeStretch = Math.abs(da - db);
            if (edgeStretch > maxEdgeStretch) maxEdgeStretch = edgeStretch;
            if (edgeStretch > 0.0005) stretchCount++;
          }
        }
        console.log('[STRAIGHTEN ' + s + '] triangle edge stretch: max=' +
          (maxEdgeStretch*1000).toFixed(3) + 'mm, edges>0.5mm=' + stretchCount);

        // Stretch warning (no auto-revert — let user judge visually)
        if (maxEdgeStretch > 0.002) {
          console.warn('[STRAIGHTEN ' + s + '] WARNING: max edge stretch=' +
            (maxEdgeStretch*1000).toFixed(1) + 'mm (web region only, tube interiors rigid)');
        }
      }

      // Post-correction inter-finger gaps
      const measX = knuckleX + midFingerLen * 0.40 * handSign;
      const gapReport = [];
      for (let vi = 0; vi < 3; vi++) {
        const bndZ = (digitZ[vi] + digitZ[vi+1]) / 2;
        let maxLo = -Infinity, minHi = Infinity;
        for (let i = 0; i < nM; i++) {
          const vx = meshRestPos[i*3], vy = meshRestPos[i*3+1], vz = meshRestPos[i*3+2];
          if (Math.abs(vx - measX) > 0.008 || Math.abs(vy - knuckleY) > 0.025) continue;
          if (indexDir > 0) {
            if (vz > bndZ + splayOffset[vi] && vz < minHi) minHi = vz;
            else if (vz <= bndZ + splayOffset[vi] && vz > maxLo) maxLo = vz;
          } else {
            if (vz < bndZ + splayOffset[vi] && vz > maxLo) maxLo = vz;
            else if (vz >= bndZ + splayOffset[vi] && vz < minHi) minHi = vz;
          }
        }
        const gap = (minHi < Infinity && maxLo > -Infinity) ? Math.abs(minHi - maxLo) : NaN;
        const pairNames = [['index','middle'], ['middle','ring'], ['ring','pinky']];
        gapReport.push(pairNames[vi].join('-') + '=' + (isNaN(gap) ? 'N/A' : (gap*1000).toFixed(1)+'mm'));
      }
      console.log('[STRAIGHTEN ' + s + '] post-splay gaps at 40%: ' + gapReport.join(' | '));
    }

    return anyApplied;
  }

  // Rescale cage rest positions to match FBX skeleton proportions.
  // Stretches limb regions along bone axes so cage bone lengths match FBX.
  // Called once when FBX is loaded. After rescaling, proportion ratios → ~1.0.
  let _cageRescaled = false;
  function rescaleCageToFBX(restPose) {
    // DISABLED: Rescaling the cage geometry breaks the spatial alignment between
    // cage and mesh vertices, destroying the KNN binding. The cage must stay at
    // its original proportions (matching the mesh it wraps). Proportion differences
    // between cage and FBX skeletons are handled by retargeting ratios instead.
    console.log('[RESCALE] Disabled — proportion differences handled by retargeting ratios');
    return;
    if (!restPose || !cageRest || !P.l_hip || !R.l_thigh) return;
    if (_cageRescaled) {
      console.log('[RESCALE] Already rescaled — skipping');
      return;
    }

    console.log('=== RESCALING CAGE TO MATCH FBX PROPORTIONS ===');

    // Bone chains to rescale: process parent→child top-down so deltas cascade.
    // Each entry: parent joint, child joint, region to stretch,
    //             downstream regions to shift, downstream joints to shift.
    const chains = [
      // Left leg
      { parent: 'l_hip', child: 'l_knee', region: 'l_thigh',
        downstream: ['l_shin', 'l_foot', 'l_toe_reg'],
        downJoints: ['l_ankle', 'l_toe'] },
      { parent: 'l_knee', child: 'l_ankle', region: 'l_shin',
        downstream: ['l_foot', 'l_toe_reg'],
        downJoints: ['l_toe'] },
      // Right leg
      { parent: 'r_hip', child: 'r_knee', region: 'r_thigh',
        downstream: ['r_shin', 'r_foot', 'r_toe_reg'],
        downJoints: ['r_ankle', 'r_toe'] },
      { parent: 'r_knee', child: 'r_ankle', region: 'r_shin',
        downstream: ['r_foot', 'r_toe_reg'],
        downJoints: ['r_toe'] },
      // Left arm
      { parent: 'l_shoulder', child: 'l_elbow', region: 'l_upperarm',
        downstream: ['l_forearm', 'l_hand'],
        downJoints: ['l_wrist', 'l_mid_knuckle'] },
      { parent: 'l_elbow', child: 'l_wrist', region: 'l_forearm',
        downstream: ['l_hand'],
        downJoints: ['l_mid_knuckle'] },
      // Right arm
      { parent: 'r_shoulder', child: 'r_elbow', region: 'r_upperarm',
        downstream: ['r_forearm', 'r_hand'],
        downJoints: ['r_wrist', 'r_mid_knuckle'] },
      { parent: 'r_elbow', child: 'r_wrist', region: 'r_forearm',
        downstream: ['r_hand'],
        downJoints: ['r_mid_knuckle'] },
    ];

    for (const chain of chains) {
      const parentPos = P[chain.parent];
      const childPos = P[chain.child];
      const rpParent = restPose[chain.parent];
      const rpChild = restPose[chain.child];

      if (!parentPos || !childPos || !rpParent || !rpChild) continue;

      const curLen = vlen(vsub(childPos, parentPos));
      const targetLen = vlen(vsub(rpChild, rpParent));
      if (curLen < 0.001 || targetLen < 0.001) continue;

      const scale = targetLen / curLen;
      if (Math.abs(scale - 1.0) < 0.01) continue; // skip if already close

      const boneDir = vnorm(vsub(childPos, parentPos));

      // Scale vertices in this region along the bone axis.
